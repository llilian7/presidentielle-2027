<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Les mêmes questions à chaque candidat à la présidentielle 2027 : réponses courtes, chiffres, mesures expliquées, sources et faisabilité.">
<meta property="og:title" content="Comparateur Présidentielle 2027">
<meta property="og:description" content="Les mêmes questions à chaque candidat : réponses, mesures, sources et faisabilité.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://llilian7.github.io/presidentielle-2027/">
<meta property="og:image" content="https://llilian7.github.io/presidentielle-2027/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#264a6e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%23264a6e%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-size=%2211%22 font-family=%22sans-serif%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3E2027%3C/text%3E%3C/svg%3E">
<title>Comparateur Présidentielle 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout : application. Barre du haut, menu latéral (thèmes ou candidats), zone principale en grille de cartes
   qui remplit la largeur ; le détail d'une réponse s'ouvre dans un panneau latéral. Aucune couleur partisane. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e4e8ed; --ink:#15202b; --muted:#566271; --line:#d5dbe2;
  --accent:#264a6e; --accent-ink:#ffffff; --accent-soft:#dde7f1; --mark:#f6e39a; --mark-ink:#3d3100; --meter:#264a6e; --todo:#69737f;
  --scrim:rgba(15,22,30,.42); --shadow:0 1px 2px rgba(15,22,30,.06),0 4px 14px rgba(15,22,30,.06);
  --display:"Archivo", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:12px; --r-sm:8px; --gut:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#18202a; --sunk:#222c37; --ink:#e7ecf1; --muted:#9ba7b5; --line:#2b3643;
  --accent:#a9c3e0; --accent-ink:#0f141a; --accent-soft:#233243; --mark:#4a3f12; --mark-ink:#f6e39a; --meter:#a9c3e0; --todo:#8d98a5;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#18202a; --sunk:#222c37; --ink:#e7ecf1; --muted:#9ba7b5; --line:#2b3643;
  --accent:#a9c3e0; --accent-ink:#0f141a; --accent-soft:#233243; --mark:#4a3f12; --mark-ink:#f6e39a; --meter:#a9c3e0; --todo:#8d98a5;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
@media (min-width:900px){:root{--gut:max(28px,env(safe-area-inset-left,0px)); --gut-r:max(28px,env(safe-area-inset-right,0px))}}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(1.6rem,2.6vw,2.1rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
h4{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
p{margin:0}
a{color:inherit;text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.btn{font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 13px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--sunk);border-radius:999px;flex-wrap:wrap}
.seg .btn{border:0;background:transparent;min-height:32px}
.seg .btn[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.88rem}

/* Barre du haut */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1560px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r);min-height:60px;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:1.02rem;margin-right:auto}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.72rem;letter-spacing:.02em}
.brand small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:.84rem}
.tabs{display:flex;gap:4px}
.tabs a{padding:6px 12px;border-radius:999px;text-decoration:none;font-size:.9rem;color:var(--muted)}
.tabs a:hover{color:var(--ink);background:var(--sunk)}
.tabs a[aria-current="page"]{color:var(--ink);background:var(--accent-soft);font-weight:700}
.countdown{font-size:.84rem;color:var(--muted);white-space:nowrap}
.countdown b{color:var(--ink);font-variant-numeric:tabular-nums}
.countdown .cd-s{display:none}

/* Structure */
.shell{max-width:1560px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r);padding-block:24px 0;display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;align-items:start}
.shell.full{grid-template-columns:minmax(0,1fr)}
.main{display:grid;gap:28px;min-width:0}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);max-height:calc(100vh - 100px);overflow:auto;display:grid;gap:4px;padding-bottom:16px;font-size:.92rem}
.side-h{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;padding:0 10px 6px}
.side ul{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.side a{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:var(--r-sm);text-decoration:none;color:var(--muted)}
.side a:hover{background:var(--sunk);color:var(--ink)}
.side a[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.side a .n{font-variant-numeric:tabular-nums;font-size:.8rem;font-weight:400}
.side a .n.has{color:var(--ink);background:var(--mark);color:var(--mark-ink);padding:0 6px;border-radius:999px}
.side .sub{padding:2px 0 8px 12px;margin-left:10px;border-left:2px solid var(--line)}
.side .sub a{font-size:.86rem;padding:5px 10px}
.mnav{display:none;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{font-size:.86rem;padding:5px 13px;min-height:40px;display:inline-flex;align-items:center;border-radius:999px;border:1px solid var(--line);text-decoration:none;background:var(--surface);white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (max-width:1000px){.shell{grid-template-columns:minmax(0,1fr);gap:16px}.side{display:none}.mnav{display:flex}}

.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px 24px}
.phead>div{display:grid;gap:6px;min-width:0}
.phead p{max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}

/* Cartes réponse */
.qsec{display:grid;gap:14px;scroll-margin-top:90px}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:start;gap:10px 20px}
.qhead>div{display:grid;gap:4px;max-width:80ch;min-width:0}
.qhead h2{font-size:1.3rem}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{display:grid;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:var(--shadow);scroll-margin-top:84px}
.card:hover{border-color:var(--ink)}
.card-btn{all:unset;box-sizing:border-box;display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:14px 16px;cursor:pointer;height:100%;min-width:0;border-radius:var(--r)}
.card-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.card.none{display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:14px 16px;box-shadow:none;background:transparent;border-style:dashed}
.card.none:hover{border-color:var(--line)}
.lbl-close{display:none}
.card{position:relative}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.sel .card-btn{background:var(--accent-soft)}
.card.sel::after{content:"";position:absolute;left:50%;bottom:-13px;width:14px;height:14px;background:var(--surface);border-left:1px solid var(--accent);border-top:1px solid var(--accent);transform:translateX(-50%) rotate(45deg);z-index:2}
.card.sel .lbl-open{display:none}
.card.sel .lbl-close{display:inline}
.detail{grid-column:1 / -1;background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:18px 22px 18px;display:grid;gap:18px;box-shadow:var(--shadow);scroll-margin-top:84px}
.detail-head{display:flex;justify-content:space-between;align-items:start;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.detail-head .who b{font-family:var(--display);font-size:1.1rem}
.detail-head .who small{font-size:.92rem}
.detail .cols:not(.solo){grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.icon{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.2rem;line-height:1;flex:none}
.icon:hover{border-color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.detail{animation:fadein .16s ease-out}@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}}
.card-end{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line);font-size:.9rem}
.card-end a{color:var(--muted)}
@media (max-width:820px){.detail .cols:not(.solo){grid-template-columns:1fr}.detail{padding:14px}}
.card-top{display:flex;gap:10px;align-items:center;min-width:0}
.mono{width:38px;height:38px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.78rem;flex:none}
.who{display:grid;line-height:1.25;min-width:0}
.who b{font-weight:700}
.who small{color:var(--muted);font-size:.8rem}
.card .rep{font-weight:700;line-height:1.4}
.card .rep.unk{font-weight:400;color:var(--muted)}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--line);font-size:.84rem}
.card-foot .go{color:var(--muted)}
.card-foot{flex-wrap:wrap;row-gap:6px}
.card-foot .score{flex:1 1 auto;min-width:0}
.card-foot .score b{white-space:normal;line-height:1.25}
.card-foot .go{margin-left:auto;white-space:nowrap}
.card:hover .go{color:var(--ink)}

.score{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.86rem}
.score{flex-wrap:wrap;white-space:normal;row-gap:2px}
.score b{font-family:var(--display);font-weight:800;font-size:.98rem;white-space:nowrap}
.score small{color:var(--muted);white-space:nowrap}
.score .lab{font-size:.76rem}
.score.vague{color:var(--muted)}
.score{white-space:normal;flex-wrap:wrap;min-width:0;row-gap:2px}
.ccard,.ab,.verdict,.detail{grid-template-columns:minmax(0,1fr)}
.vtop{flex-wrap:wrap}
.score small{white-space:normal}
.score.none{color:var(--todo);font-size:.82rem}

details.rep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font-size:.92rem}
details.rep>summary{cursor:pointer;padding:9px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.rep>summary::-webkit-details-marker{display:none}
details.rep>summary::after{content:"+";font-family:var(--display)}
details.rep[open]>summary::after{content:"−"}
.rep-body{padding:0 14px 14px;display:grid;gap:10px;max-width:90ch}
.rep-body ul{margin:0;padding-left:18px;display:grid;gap:6px}

/* Contenu détaillé d'une réponse */
.ab{display:grid;gap:18px}
.cols{display:grid;gap:18px 24px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));align-items:start}
.cols.solo{grid-template-columns:1fr}
.part{display:grid;gap:8px;min-width:0}
ul.figs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.figs li{padding:7px 11px;background:var(--mark);color:var(--mark-ink);border-radius:var(--r-sm);font-variant-numeric:tabular-nums;line-height:1.4;font-size:.93rem}
ul.mes{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:m}
ul.mes>li{display:grid;gap:2px;padding-left:30px;position:relative;counter-increment:m}
ul.mes>li::before{content:counter(m);position:absolute;left:0;top:1px;width:21px;height:21px;border-radius:50%;background:var(--accent-soft);font:700 .72rem/21px var(--display);text-align:center}
ul.mes strong{font-weight:700;line-height:1.35}
ul.mes .mtop{display:flex;justify-content:space-between;gap:4px 12px;align-items:baseline;flex-wrap:wrap}
details.mwhy{font-size:.86rem}
.verdict{display:grid;gap:10px;padding:14px 16px;background:var(--sunk);border-radius:var(--r-sm)}
.vtop{display:flex;align-items:center;gap:12px}
.vlab{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted)}
.verdict .score b{font-size:1.25rem}
.journal{margin:.4em 0 0;padding-left:1.2em}
.journal li{margin:.2em 0}
.verdict>p{max-width:75ch}
.vcalc{font-size:.84rem;color:var(--muted)}
ul.crit{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
ul.crit li{display:inline-flex;gap:6px;align-items:baseline;font-size:.82rem;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
ul.crit li span{color:var(--muted)}
ul.crit li b{font-variant-numeric:tabular-nums}
.cap{font-size:.84rem;font-weight:700}
details.mwhy[open] ul.crit li{background:var(--surface)}
.mnn{font-size:.84rem;color:var(--todo)}
body{margin:0}
.brand .logo{width:auto;padding:0 6px}
details.mwhy>summary{cursor:pointer;color:var(--muted);width:fit-content}
details.mwhy>summary:hover{color:var(--ink)}
details.mwhy[open]{padding:8px 10px;background:var(--sunk);border-radius:var(--r-sm);display:grid;gap:6px}
ul.mes>li>span{color:var(--muted);font-size:.92rem;line-height:1.5}
figure.quote{margin:0;display:grid;gap:4px;padding:12px 14px;background:var(--sunk);border-radius:var(--r-sm)}
figure.quote blockquote{margin:0;font-style:italic;line-height:1.45}
figure.quote blockquote::before{content:"« "}
figure.quote blockquote::after{content:" »"}
figure.quote figcaption{font-size:.84rem;color:var(--muted)}
figure.quote figcaption::before{content:"— "}
.meta-row{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:.86rem;color:var(--muted)}
details.more,details.fx{font-size:.9rem}
details.more>summary,details.fx>summary{cursor:pointer;color:var(--muted);width:fit-content}
details.more>summary:hover,details.fx>summary:hover{color:var(--ink)}
details.more p{margin-top:8px}
.fx-body{margin-top:10px;padding:12px 14px;background:var(--sunk);border-radius:var(--r-sm);display:grid;gap:10px}
.fx-body ul{margin:0;padding-left:18px;display:grid;gap:6px}
table.grille{border-collapse:collapse;font-size:.86rem;width:100%}
table.grille th,table.grille td{padding:5px 10px 5px 0;text-align:left;font-weight:400;border-bottom:1px solid var(--line)}
table.grille td{font-variant-numeric:tabular-nums;text-align:right}
table.grille tr:last-child th,table.grille tr:last-child td{border-bottom:0;font-weight:700}

/* Accueil */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:stretch}
.hero .panel{display:grid;gap:12px;align-content:center}
.hero h1{font-size:clamp(1.7rem,3vw,2.4rem)}
.hero .lede{color:var(--muted);max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:4px;align-content:center}
.stats dt{font-size:.82rem;color:var(--muted)}
.stats dd{margin:0;font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.stats dd small{font-family:var(--body);font-weight:400;font-size:.86rem;color:var(--muted)}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
@media (max-width:440px){.stats{grid-template-columns:1fr 1fr}.stats div:first-child{grid-column:span 2}}
.hsec{display:grid;gap:12px;scroll-margin-top:90px}
.ready{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.ready a{display:grid;gap:10px;align-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;text-decoration:none;box-shadow:var(--shadow)}
.ready a:hover{border-color:var(--ink)}
.ready .tag{justify-self:start;font-size:.78rem;font-weight:700;background:var(--mark);color:var(--mark-ink);padding:2px 9px;border-radius:999px}
.ready .go{color:var(--muted);font-size:.86rem}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tile{display:grid;gap:6px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none;min-width:0}
.tile:hover{border-color:var(--ink)}
.tile.empty{background:transparent}
.tile .meta{font-size:.84rem;color:var(--muted)}
.bar{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--meter)}
.ctile{display:flex;gap:12px;align-items:center}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.matrix{border-collapse:collapse;font-size:.84rem;min-width:900px;width:100%}
.matrix th,.matrix td{border-bottom:1px solid var(--line);padding:7px 5px;text-align:center}
.matrix tr:last-child th,.matrix tr:last-child td{border-bottom:0}
.matrix thead th{font-weight:700;font-size:.74rem;vertical-align:bottom;color:var(--muted)}
.matrix a{text-decoration:none}
.matrix tbody th{text-align:left;white-space:nowrap;padding-left:14px;position:sticky;left:0;background:var(--surface)}
.matrix td a{display:inline-block;min-width:44px;padding:3px 6px;border-radius:6px;font-variant-numeric:tabular-nums;color:var(--todo)}
.matrix td a.has{background:var(--mark);color:var(--mark-ink);font-weight:700}
.legend{font-size:.86rem;color:var(--muted)}

/* Vue candidat */
.chead,.phead>.chead{display:flex;gap:16px;align-items:center}
.chead .mono{width:64px;height:64px;font-size:1.2rem}
.chead>div{display:grid;gap:4px;min-width:0}
.ccards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));align-items:start}
.ccard{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.ccard .top{display:grid;gap:4px}
.ccard .rep-line{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--accent-soft);border-radius:var(--r-sm)}
.ccard .rep-line p{font-weight:700}

/* À venir */
.later{display:flex;flex-wrap:wrap;gap:8px}
.later span{font-size:.86rem;padding:6px 12px;border:1px dashed var(--line);border-radius:999px;color:var(--muted)}

.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
footer{max-width:1560px;margin:40px auto 0;padding-left:var(--gut);padding-right:var(--gut-r);font-size:.86rem;color:var(--muted);display:grid;gap:8px}
footer p{max-width:90ch}

@media (prefers-reduced-motion:no-preference){.tile,.btn,.card,.ready a{transition:border-color .15s}}

/* ===== Design et ergonomie (22 novembre 2026) ===== */
/* Questions repliables */
details.qsec{display:block}
details.qsec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
details.qsec>summary::-webkit-details-marker{display:none}
details.qsec>summary:hover{border-color:var(--ink)}
details.qsec[open]>summary{border-color:var(--accent);background:var(--accent-soft)}
.qsum-t{display:grid;gap:4px;min-width:0;flex:1}
.qsum-t h2{font-size:1.15rem}
.qmeta{font-size:.86rem;color:var(--muted)}
.chev{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.chev::before{content:"";width:9px;height:9px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-2px) rotate(45deg)}
details.qsec[open] .chev::before{transform:translateY(2px) rotate(-135deg)}
@media (prefers-reduced-motion:no-preference){.chev::before{transition:transform .15s}}
.qbody{display:grid;gap:14px;padding-top:14px}
.qfoot{display:flex;justify-content:flex-end}
.qlist{display:grid;gap:12px}
.qtools{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.pick{display:inline-flex;align-items:center;gap:8px;font-size:.88rem}
.pick select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 30px 6px 12px;min-height:36px;max-width:100%;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
/* Réponses inconnues : cartes compactes en fin de liste */
.minis{display:grid;gap:8px}
.minis-h{font-size:.84rem;color:var(--muted);font-weight:700}
.cards.cards-mini{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.card.mini{box-shadow:none;background:transparent;border-style:dashed}
.card.mini .card-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px}
.card.mini .mono{width:30px;height:30px;font-size:.68rem}
.card.mini .go{color:var(--muted);font-size:.84rem;flex:none}
.card.mini:hover .go{color:var(--ink)}
.card.none.mini{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px}
.card.none.mini .rep{font-size:.84rem}
.card.sel.mini{border-style:solid}
/* Barre de navigation défilante (mobile) */
.mnav{position:relative;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent);padding-right:30px}
.mnav::-webkit-scrollbar{display:none}
/* Partage et retour en haut */
.share-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.totop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:25;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 2px 10px rgba(15,22,30,.18);cursor:pointer;font-size:1.25rem;opacity:0;pointer-events:none;transform:translateY(8px)}
.totop.on{opacity:1;pointer-events:auto;transform:none}
@media (prefers-reduced-motion:no-preference){.totop{transition:opacity .2s,transform .2s}}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;max-width:calc(100vw - 32px);overflow-wrap:anywhere;box-shadow:0 4px 18px rgba(0,0,0,.25)}
/* Accueil : thèmes vides plus discrets, avancement repliable */
.tile.empty{padding:11px 14px;box-shadow:none;border-style:dashed}
.tile.empty h3{font-size:.95rem;color:var(--muted)}
.tile.empty .bar{display:none}
details.adv>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::after{content:"+";font:700 1.2rem var(--display);color:var(--muted)}
details.adv[open]>summary::after{content:"−"}
details.adv[open]>summary{margin-bottom:12px}
.ccard .qlink{font-size:.88rem;color:var(--muted)}
.ccard .qlink:hover{color:var(--ink)}
/* Téléphone */
@media (max-width:640px){
  .topbar-in{flex-wrap:nowrap;gap:8px;min-height:54px;padding-block:6px}
  .brand>span:not(.logo){display:none}
  .tabs{gap:2px}
  .tabs a{padding:7px 10px;font-size:.88rem}
  .countdown .cd-l{display:none}
  .countdown .cd-s{display:inline}
  .card-btn,.card.none{padding:12px 14px}
  details.qsec>summary{padding:14px}
  .qsum-t h2{font-size:1.05rem}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .ctile{gap:8px;padding:12px}
  .ctile .mono{width:32px;height:32px;font-size:.7rem}
  .ctile .who b{font-size:.92rem}
  .ready{grid-template-columns:minmax(0,1fr)}
  .phead .toolbar,.qtools .toolbar{width:100%}
  .pick{width:100%}
  .pick select{flex:1}
  .detail{padding:14px 14px 16px}
}
.main{grid-template-columns:minmax(0,1fr)}
@media (max-width:640px){.chead .mono{width:48px;height:48px;font-size:.95rem}.chead h1{font-size:1.45rem}}
@media (max-width:370px){.countdown{display:none}.tabs a{padding:7px 8px}}

/* ===== Comparer des candidats (22 novembre 2026) ===== */
.cmp-pick{display:grid;gap:10px}
.cmp-pick .chips{display:flex;flex-wrap:wrap;gap:6px}
details.cmp-sel>summary{list-style:none;width:fit-content}
details.cmp-sel>summary::-webkit-details-marker{display:none}
details.cmp-sel>summary::after{content:"▾";margin-left:4px}
details.cmp-sel[open]>summary::after{content:"▴"}
.cmp-pick .chip{cursor:pointer;font:inherit;font-size:.86rem;color:var(--ink)}
.cmp-pick .chip.on{color:var(--accent-ink)}
.cmp-pick .chip.on::before{content:"✓ "}
.cmp-tnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cmp-tnav::-webkit-scrollbar{display:none}
.cmp-tnav .chip.off{color:var(--muted);border-style:dashed}
.cmp-empty{display:grid;gap:6px;text-align:center;padding:28px 20px}
.cmp-who{display:grid;gap:10px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.cw{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;align-content:start;min-width:0;position:relative}
.cw-h{display:flex;gap:10px;align-items:center;min-width:0;padding-right:28px}
.cw-x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;line-height:1;color:var(--muted)}
.cw-x:hover{color:var(--ink);border-color:var(--ink)}
.cw dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.84rem}
.cw dt{color:var(--muted)}
.cw dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.cmp-tot{display:flex;flex-wrap:wrap;gap:8px}
.tot{display:inline-flex;align-items:baseline;gap:6px;padding:8px 14px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);font-size:.9rem}
.tot b{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.tot.diverge{border-color:var(--ink)}
.cmp-jump{display:flex;flex-wrap:wrap;gap:6px}
.cmp-jump a{font-size:.84rem;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);text-decoration:none;display:inline-flex;gap:6px;align-items:center;min-height:36px}
.cmp-jump a span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cmp-sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tb,61px));z-index:15;background:var(--bg);padding:8px 0;margin-bottom:-8px;border-bottom:1px solid var(--line)}
.cmp-sticky .row{display:grid;gap:10px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.cmp-sticky .row span{display:flex;gap:8px;align-items:center;font-weight:700;font-size:.9rem;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mono.s{width:26px;height:26px;font-size:.62rem}
.cq{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;scroll-margin-top:140px;box-shadow:var(--shadow)}
.cq-h{display:grid;gap:4px}
.cq-h h2{font-size:1.15rem}
.cq-n{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted)}
.cq-n b{color:var(--ink)}
.cmp-cols{display:grid;gap:10px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.cc{display:grid;gap:8px;align-content:start;padding:12px 14px;border-radius:var(--r-sm);background:var(--sunk);min-width:0}
.cc-h{display:flex;gap:8px;align-items:center;font-weight:700;font-size:.88rem;min-width:0}
.cc-r{font-weight:700;line-height:1.4}
.cc-r.unk{font-weight:400;color:var(--muted)}
.cc a{font-size:.84rem;color:var(--muted)}
.cg{display:grid;gap:8px}
.cg-h{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;gap:8px;align-items:center}
.cg-h::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--ink)}
.cg-h.same::before{background:transparent;border:2px solid var(--ink);border-radius:50%}
ul.axl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ax{display:grid;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm)}
.ax-t{font-weight:700;line-height:1.35}
.axv{display:grid;gap:8px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.axv>div{display:grid;gap:3px;align-content:start;min-width:0}
.axv .nm{display:flex;gap:6px;align-items:center;font-size:.8rem;color:var(--muted);min-width:0}
.ax-c{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.ax-c .ax-t{flex:1;min-width:200px;font-weight:400}
.ax-c small{color:var(--muted);flex-basis:100%}
.pos{display:inline-flex;gap:5px;align-items:center;justify-self:start;font-size:.84rem;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pos small{font-weight:400}
.pos.pour{background:var(--accent);color:var(--accent-ink)}
.pos.contre{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink)}
.pos.nuance{background:var(--mark);color:var(--mark-ink)}
.pos.none{background:transparent;color:var(--todo);font-weight:400;padding-left:0}
.pos-n{font-size:.82rem;color:var(--muted);line-height:1.4}
details.cmp-more>summary,details.cmp-solo>summary{cursor:pointer;color:var(--muted);font-size:.9rem;width:fit-content}
details.cmp-more>summary:hover,details.cmp-solo>summary:hover{color:var(--ink)}
details.cmp-more[open]>summary,details.cmp-solo[open]>summary{margin-bottom:10px}
.cm{display:grid;gap:10px;align-content:start;min-width:0}
.cm ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:.9rem}
.cm .figs li{font-size:.86rem}
.cq-foot{font-size:.88rem}
.cq-foot a{color:var(--muted)}
.cmp-note{font-size:.84rem;color:var(--muted);max-width:90ch}
@media (max-width:640px){
  .tabs a.t-home{display:none}
  .cq{padding:14px}
  .cmp-who{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cw dl{grid-template-columns:1fr;gap:0}
  .cw .mono{display:none}
  .cw .qlink{font-size:.82rem}
  .cw dd{text-align:left;margin-bottom:4px}
  .cmp-cols.scrollx{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:78%;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
  .cmp-cols.scrollx>*{scroll-snap-align:start}
  .cmp-cols:not(.scrollx) .cc,.cmp-cols:not(.scrollx) .cm{padding:10px}
  .cmp-cols:not(.scrollx) .cc-r{font-size:.92rem}
  .axv.many{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cmp-sticky .row.many{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* Récap de faisabilité : une case par candidat et par question, plus foncée quand c'est plus faisable */
.fxsum{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.fxsum h2{font-size:1.1rem}
.fxsum > p{margin:0;font-size:.9rem}
.fxwrap{overflow-x:auto;margin:0 -18px;padding:0 18px;-webkit-overflow-scrolling:touch}
.fxt{border-collapse:separate;border-spacing:3px;font-variant-numeric:tabular-nums;min-width:100%}
.fxt th{font-weight:400;font-size:.76rem;color:var(--muted);text-align:center;vertical-align:bottom;padding:0 2px 4px;line-height:1.2;min-width:58px}
.fxt thead a{color:inherit;text-decoration:none}
.fxt thead a:hover{color:var(--ink);text-decoration:underline}
.fxt th[scope="row"]{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;vertical-align:middle;font-size:.88rem;color:var(--ink);padding:0 10px 0 0;white-space:nowrap;min-width:0}
.fxt th[scope="row"] a{color:inherit;text-decoration:none}
.fxt th[scope="row"] a:hover{text-decoration:underline}
.fxt tr.focus th[scope="row"]{font-weight:700}
.fxt td{padding:0}
.fxc{display:grid;place-items:center;height:38px;border-radius:6px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:.95rem;color:var(--ink);border:1px solid transparent}
.fxc:hover{outline:2px solid var(--ink);outline-offset:-2px}
.fxc.f{background:var(--accent);color:var(--accent-ink)}
.fxc.d{background:color-mix(in srgb,var(--accent) 38%,var(--surface))}
.fxc.i{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-color:color-mix(in srgb,var(--accent) 30%,var(--surface))}
.fxc.z{background:var(--surface);border:1px dashed var(--muted)}
.fxc.v,.fxc.x{background:var(--sunk);color:var(--muted);font-family:var(--body);font-weight:400;font-size:.74rem}
.fxc.n,.fxc.o{background:var(--sunk);color:var(--muted);font-family:var(--body);font-weight:400;font-size:.68rem;line-height:1.1;text-align:center}
.fxc.o{background:repeating-linear-gradient(135deg,var(--sunk) 0 4px,var(--surface) 4px 7px)}
.fxleg .fxc.n,.fxleg .fxc.o{width:auto;padding:0 6px}
.fxc.u{color:var(--muted);font-weight:400;background:color-mix(in srgb,var(--sunk) 45%,var(--surface))}
.fxhint{display:none;font-size:.8rem}
.fxleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0;padding:0;list-style:none;font-size:.8rem;color:var(--muted)}
.fxleg li{display:flex;align-items:center;gap:6px}
.fxleg .fxc{width:28px;height:20px;font-size:.7rem}
.fxrows{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.fxr{display:grid;grid-template-columns:minmax(150px,190px) minmax(0,1fr);gap:4px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.fxr:first-child{border-top:0}
.fxr .nm{font-weight:700;text-decoration:none;line-height:1.25}
.fxr .nm small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.fxr .nm:hover{text-decoration:underline}
.fxbar{display:flex;gap:2px;height:26px}
.fxbar a{flex:1 1 0;min-width:0;border-radius:4px;display:grid;place-items:center;font:800 .78rem var(--display);text-decoration:none;color:var(--ink)}
.fxbar .fxc{height:100%;border-radius:4px}
.fxbar a:hover{outline:2px solid var(--ink);outline-offset:-2px}
.fxsyn{grid-column:2;font-size:.86rem;line-height:1.45;color:var(--muted)}
.fxsyn b{color:var(--ink);font-weight:700}
details.fxmore>summary{cursor:pointer;color:var(--muted);font-size:.9rem;width:fit-content}
details.fxmore>summary:hover{color:var(--ink)}
details.fxmore[open]>summary{margin-bottom:10px}
@media (max-width:640px){.fxr{grid-template-columns:minmax(0,1fr)}.fxsyn{grid-column:1}.fxbar{height:24px}.fxbar a{font-size:.7rem}}
.fxplot{display:grid;gap:8px}
.fxplot svg{width:100%;height:auto;display:block;overflow:visible}
.fxplot .gl{stroke:var(--line);stroke-width:1}
.fxplot .band.z1{fill:color-mix(in srgb,var(--accent) 20%,var(--surface))}
.fxplot .band.z2{fill:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.fxplot .band.z3{fill:var(--surface)}
.fxplot .ax{fill:var(--muted);font:12px var(--body)}
.fxplot .axt{fill:var(--muted);font:700 12px var(--body)}
.fxplot .bandl{fill:var(--muted);font:700 11px var(--body);text-transform:uppercase;letter-spacing:.08em}
.fxplot .bandl.z1{fill:var(--accent)}
.fxplot .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2.5}
.fxplot .dot.z2{fill:color-mix(in srgb,var(--accent) 62%,var(--surface))}
.fxplot .dot.z3{fill:color-mix(in srgb,var(--accent) 30%,var(--surface));stroke:var(--accent);stroke-width:1.5}
.fxplot .dot.few{fill:var(--surface);stroke:var(--accent);stroke-width:2.5;stroke-dasharray:4 3}
.fxplot a:hover .dot{stroke:var(--ink)}
.fxplot .lbl{fill:var(--ink);font:700 13px var(--body)}
@media (max-width:640px){.fxplot .lbl{font-size:12px}}
.fxplot .lbl tspan{font-weight:400;fill:var(--muted)}
.fxplot .ini{fill:var(--accent-ink);font:800 10px var(--display);pointer-events:none}
.fxplot .ini.z2{fill:var(--ink)}
.fxplot .ini.z3,.fxplot .ini.few{fill:var(--accent)}
@media (max-width:640px){.fxplot .ini{font-size:9.5px}}
.fxplot .lead{stroke:var(--muted);stroke-width:1}
.fxkey{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0;padding:0;list-style:none;font-size:.8rem;color:var(--muted)}
.fxkey li{display:flex;align-items:center;gap:6px}
.fxkey i{width:12px;height:12px;border-radius:50%;background:var(--accent);display:inline-block}
.fxkey i.few{background:var(--surface);border:2px dashed var(--accent)}
.fxnone{font-size:.86rem;color:var(--muted)}
details.fxmore{border-top:1px solid var(--line);padding-top:10px}
.fxtop{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px}
.fxsort .btn{font-size:.82rem;padding:4px 11px;min-height:32px}
@media (max-width:640px){.fxsort{width:100%}.fxsort .seg{display:grid;grid-template-columns:1fr 1fr;width:100%;border-radius:14px}.fxsort .seg .btn{justify-content:center;border-radius:11px}}
.fxbars ul{list-style:none;margin:0;padding:0;display:grid}
.fxhead,.fxb{display:grid;grid-template-columns:minmax(140px,180px) minmax(0,1fr) minmax(0,1.25fr);gap:2px 22px;align-items:center}
.fxhead{font-size:.76rem;font-weight:700;color:var(--muted);padding-bottom:4px;border-bottom:1px solid var(--line)}
.fxhead small{font-weight:400}
.fxb{padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.fxb:last-child{border-bottom:0}
.fxb .nm{font-weight:700;font-size:.95rem;text-decoration:none;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fxb .nm:hover{text-decoration:underline}
.fxm{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:10px;align-items:center}
.fxm:last-child{grid-template-columns:minmax(0,1fr) 112px}
.fxb .fxm:nth-child(2){grid-template-columns:minmax(0,1fr) 128px}
.fxm .fxl{display:none}
.fxm b{font-family:var(--display);font-weight:800;font-size:.95rem;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.2}
.fxm b small{font-family:var(--body);font-weight:400;font-size:.74rem;color:var(--muted)}
.fxm b em{font-family:var(--body);font-style:normal;font-weight:400;font-size:.72rem;color:var(--muted);margin-left:6px}
.fxm b.na{white-space:normal;font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--muted);grid-column:1 / -1;grid-row:1}
.fxm:has(b.na) .trk{display:none}
.trk{position:relative;height:14px;border-radius:3px;background:var(--sunk);display:block;overflow:hidden}
.trk.seg{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px;background:none}
.trk.seg i{background:var(--sunk);border-radius:2px}
.trk.seg i.on{background:var(--accent)}
.trk.seg i.old{background:repeating-linear-gradient(135deg,var(--accent) 0 2px,color-mix(in srgb,var(--accent) 25%,var(--surface)) 2px 5px)}
.trk .fill{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--accent)}
.trk .fill.z2{background:color-mix(in srgb,var(--accent) 60%,var(--surface))}
.trk .fill.z3{background:color-mix(in srgb,var(--accent) 32%,var(--surface))}
.trk .fill.few{background-image:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--surface) 55%,transparent) 4px 7px)}
.trk .t7{position:absolute;top:0;bottom:0;left:70%;width:2px;background:var(--ink);opacity:.55}
@media (max-width:760px){
  .fxhead{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 14px}
  .fxhead>span:first-child{display:none}
  .fxb{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 14px;padding:8px 0}
  .fxb .nm{grid-column:1 / -1;font-size:.86rem}
  .fxm,.fxm:last-child{grid-template-columns:minmax(0,1fr) auto;gap:6px}
  .fxm b{font-size:.86rem}
  .fxm b em{display:none}
}
@media (max-width:640px){.fxt .fn{display:none}.fxhint{display:block}.fxsum{padding:14px}.fxwrap{margin:0 -14px;padding:0 14px}.fxt th{min-width:48px;font-size:.72rem}.fxc{height:34px}}
.fxc.w{background:transparent;border:1px dashed var(--line)}
.fxbar .fxc.w{flex:1 1 0;min-width:0;height:100%;border-radius:4px}
.fxt th.w,.fxt th.w a{color:color-mix(in srgb,var(--muted) 60%,var(--surface))}
.fxprog{display:flex;align-items:center;gap:10px;font-size:.86rem;color:var(--muted);margin:0;flex-wrap:wrap}
.fxprog .pgt{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;width:min(220px,100%);height:10px}
.fxprog .pgt i{display:block;height:10px;background:var(--sunk);border-radius:2px}
.fxprog .pgt i.on{background:var(--accent)}
.fxprog b{color:var(--ink)}
/* Comparer : un mot de faisabilité long passe à la ligne sur mobile (23 novembre 2026) */
.cc .score{white-space:normal;flex-wrap:wrap}.cc .score b{white-space:normal}

const EXPLICATIONS = {"Rénovation thermique massive des logements": "Isoler murs, toits et fenêtres et changer les chauffages, pour que les logements consomment moins d'énergie et que les factures baissent.", "Électrification rendue accessible à tous": "Remplacer l'essence, le gaz et le fioul par de l'électricité, en grande partie bas carbone en France : voitures électriques, pompes à chaleur, industrie. L'objectif affiché est que le prix ne soit pas un frein pour les ménages modestes.", "TVA à 5,5 % sur les voitures électriques (proposition de juillet 2025)": "La TVA est l'impôt compris dans le prix d'achat, normalement de 20 %. La passer à 5,5 % baisserait le prix d'une voiture électrique d'environ 12 % (calcul).", "Un plan des 100 premiers jours avec un « état d'urgence écologique »": "Lancer les principales mesures écologiques dans les trois premiers mois du mandat, en les présentant comme une priorité nationale.", "Une loi de programmation pour sortir du gaz et du pétrole": "Une loi de programmation fixe à l'avance des objectifs et des budgets sur plusieurs années, comme celle qui existe pour l'armée. Ici, elle fixerait un calendrier pour cesser d'utiliser le gaz et le pétrole.", "Inscrire la « République écologique » dans la Constitution": "Écrire dans la Constitution que la protection de l'environnement guide l'action de l'État. Une telle révision demande un vote des deux chambres du Parlement, puis un référendum ou les 3/5 des parlementaires réunis en Congrès.", "L'incitation plutôt que l'obligation": "Encourager les changements par des aides ou des baisses d'impôt plutôt que par des interdictions ou des normes imposées.", "Arrêt du développement de l'éolien et du solaire": "Ne plus construire de nouvelles éoliennes ni de nouveaux grands parcs solaires, et compter sur le nucléaire pour produire l'électricité.", "Prix de l'électricité régulé pendant 10 ans": "L'État fixerait lui-même le prix de l'électricité pendant dix ans, au lieu de le laisser dépendre en partie des marchés européens.", "Opposition à la programmation énergétique (PPE), qu'elle chiffre à « un minimum de 300 milliards »": "La PPE est le plan officiel qui fixe la production d'énergie de la France pour les dix prochaines années (dernière version : février 2026). Marine Le Pen la conteste, surtout pour la place donnée à l'éolien et au solaire.", "Une « écologie de solutions et non d'injonctions »": "Miser sur l'innovation et les entreprises pour réduire la pollution, plutôt que sur des interdictions et des obligations.", "Un « principe de responsabilité » à la place du principe de précaution": "Le principe de précaution, inscrit dans la Constitution depuis 2005, permet de bloquer une activité en cas de risque grave mais incertain pour l'environnement. David Lisnard veut le remplacer par un principe qu'il juge moins bloquant pour l'innovation.", "Des règles simples et moins nombreuses": "Réduire le nombre de normes environnementales, qu'il juge trop complexes pour les entreprises et les collectivités.", "Priorité à l'adaptation": "Préparer le pays aux effets du réchauffement déjà en cours : canicules, sécheresses, inondations.", "Une « règle verte » dans la Constitution : ne pas prélever plus que la nature ne reconstitue": "Interdire, dans la Constitution, de prendre à la nature plus qu'elle ne peut renouveler en un an : eau, forêts, sols, poissons…", "Un conseil à la planification écologique": "Un organisme public chargé d'organiser la transition secteur par secteur (transports, logement, industrie…), avec des objectifs et un calendrier.", "Fin des subventions aux énergies fossiles": "Supprimer les aides et avantages fiscaux qui rendent le pétrole et le gaz moins chers pour certaines activités.", "Un pôle public de l'énergie": "Placer la production et la distribution d'énergie sous contrôle public, pour que l'État décide des prix et des investissements.", "Électrification des usages": "Remplacer l'essence, le gaz et le fioul par de l'électricité, en grande partie bas carbone en France : voitures électriques, pompes à chaleur, industrie.", "Taxe carbone aux frontières de l'Europe": "Faire payer aux produits importés une taxe selon le CO2 émis pour les fabriquer, pour ne pas désavantager les entreprises européennes, soumises à des règles plus strictes. L'Union européenne l'applique depuis 2026 à quelques produits comme l'acier ou le ciment.", "Aide à la voiture électrique d'occasion alignée sur celle du neuf": "Donner pour une voiture électrique d'occasion la même aide que pour une neuve, pour que les ménages qui achètent d'occasion en profitent aussi.", "Doublement du Fonds vert des collectivités": "Le Fonds vert est une enveloppe de l'État qui aide les communes à financer des travaux écologiques : rénovation d'écoles, espaces verts, etc. Il propose de doubler son montant.", "Priorité à l'adaptation, notamment au stockage de l'eau": "Préparer le pays aux sécheresses, par exemple en construisant des réserves d'eau pour l'agriculture.", "Une loi organique contre la surtransposition des normes européennes": "Quand la France applique une règle européenne, elle ajoute parfois des exigences en plus. Cette loi l'interdirait.", "Retrait du principe de précaution de la Constitution": "Le principe de précaution, inscrit dans la Constitution depuis 2005, permet de bloquer une activité en cas de risque grave mais incertain pour l'environnement. Bruno Retailleau veut le retirer, le jugeant frein à l'innovation.", "Fin du financement public de l'éolien et du solaire (position de 2025)": "Arrêter les aides publiques qui garantissent un prix de vente aux nouveaux parcs éoliens et solaires.", "Fin du financement public de l'éolien et du solaire": "Arrêter les aides publiques qui garantissent un prix de vente aux nouveaux parcs éoliens et solaires.", "Une « économie de guerre climatique » planifiée": "Mobiliser l'État comme en temps de guerre : investissements publics massifs et production organisée pour accélérer la transition.", "« Pas de nouvelle contrainte écologique sans nouveaux droits sociaux »": "Chaque nouvelle obligation écologique devrait s'accompagner d'une aide ou d'une garantie pour les ménages modestes, pour qu'ils n'en paient pas seuls le prix.", "Une loi de programmation climatique": "Une loi de programmation fixe à l'avance des objectifs et des budgets sur plusieurs années, comme celle qui existe pour l'armée. Ici, elle fixerait la trajectoire de baisse des émissions et les moyens pour y arriver.", "Des obligations : fin des voitures thermiques neuves en 2035, des poids lourds en 2040, vols de moins de 4 h 30 remplacés par le train": "Interdire la vente de voitures neuves essence ou diesel en 2035, puis celle des camions en 2040. Supprimer les vols intérieurs quand le train fait le trajet en moins de 4 h 30 (la règle actuelle est 2 h 30).", "Des incitations pour les ménages": "Des aides pour que les ménages puissent rénover leur logement ou changer de véhicule.", "Financement par une taxe de 2 % sur les grandes fortunes, un ISF climatique et une taxe sur les superprofits": "Trois impôts nouveaux : 2 % par an sur les plus grandes fortunes, un impôt sur la fortune qui tient compte de sa pollution, et une taxe sur les bénéfices exceptionnels des grandes entreprises.", "Aides à l'achat de voitures électriques et de pompes à chaleur": "Une pompe à chaleur chauffe le logement à l'électricité en puisant la chaleur de l'air ou du sol ; elle remplace une chaudière au gaz ou au fioul.", "Un « prix juste » du carbone, montant non précisé": "Faire payer les émissions de CO2 à un niveau qui reflète les dégâts qu'elles causent, pour orienter vers des solutions moins polluantes.", "Suppression des certificats d'économies d'énergie": "Ce dispositif oblige les fournisseurs d'énergie à financer des économies d'énergie (primes à l'isolation, au changement de chaudière…) ; son coût est répercuté sur les factures.", "Découpler le prix de l'électricité de celui du gaz": "En Europe, le prix de l'électricité sur le marché dépend souvent du coût des centrales au gaz, même quand l'électricité vient du nucléaire. L'idée est que le prix payé en France suive plutôt le coût de production français.", "Arrêt de l'éolien (2022)": "Ne plus construire d'éoliennes.", "Suppression des zones à faibles émissions (2022)": "Ces zones interdisent l'accès des voitures les plus polluantes dans certaines grandes villes.", "Nucléaire et renouvelables ensemble, sans opposer les deux": "Produire l'électricité à la fois avec les centrales nucléaires et avec l'éolien et le solaire.", "« Neutralité technologique » entre énergies bas carbone": "Ne pas favoriser une énergie par principe : toutes celles qui émettent peu de CO2 sont soutenues.", "Prolonger les réacteurs existants": "Faire fonctionner les centrales actuelles plus longtemps, au-delà de 50 ou 60 ans, si l'autorité de sûreté nucléaire l'autorise après ses contrôles tous les dix ans.", "Décider du nombre de nouveaux réacteurs après une expertise de la Cour des comptes": "La Cour des comptes contrôle l'usage de l'argent public. Il attend son analyse des coûts avant de dire combien de réacteurs construire.", "Position différente de celle de Yannick Jadot, opposé à de nouveaux réacteurs": "Sur ce point, il se distingue d'une partie de ses alliés écologistes.", "Développer la 4e génération": "Des réacteurs d'un nouveau type, encore au stade de la recherche, qui pourraient réutiliser une partie des déchets nucléaires comme combustible.", "Rouvrir Fessenheim (2022)": "La plus ancienne centrale française (Haut-Rhin), fermée en 2020. La rouvrir supposerait de remettre en état des installations arrêtées depuis plusieurs années.", "Refus des conditions posées par Bruxelles à l'aide d'État, jugées « inacceptables »": "L'État veut prêter de l'argent à EDF pour les nouveaux réacteurs. L'Union européenne doit vérifier que cette aide ne fausse pas la concurrence et pourrait poser des conditions, par exemple obliger EDF à vendre une partie de son électricité à ses concurrents.", "Relancer le nucléaire et l'hydroélectricité": "Construire de nouveaux réacteurs et développer les barrages qui produisent de l'électricité.", "Solaire en autoconsommation, jugé selon son « rapport coût-bénéfice »": "Des panneaux solaires installés par des particuliers ou des entreprises pour leur propre consommation, soutenus seulement quand ils sont rentables.", "Fermeture progressive des réacteurs": "Arrêter les réacteurs un par un, à mesure que les renouvelables les remplacent.", "Abandon du stockage des déchets à Bure (Cigéo)": "Cigéo est le projet de stockage des déchets les plus radioactifs à 500 mètres sous terre, à Bure (Meuse).", "Retour sur la fusion de l'ASN et de l'IRSN": "Depuis 2025, le gendarme du nucléaire (ASN) et l'institut d'expertise (IRSN) forment une seule autorité, l'ASNR. Le projet est de les séparer à nouveau, pour que l'expertise reste indépendante de la décision.", "Financement avec la Banque européenne d'investissement": "La banque de l'Union européenne, qui prête à taux bas pour des projets d'intérêt général.", "Renouvelables « là où elles sont efficaces »": "Développer l'éolien et le solaire seulement là où ils produisent beaucoup pour un coût raisonnable.", "Relancer le réacteur de 4e génération Astrid": "Astrid était un prototype de réacteur capable de réutiliser une partie des déchets nucléaires. L'État l'a abandonné en 2019.", "Arrêt des EPR2 et des petits réacteurs (SMR)": "Ne pas construire les six nouveaux réacteurs prévus, ni les petits réacteurs modulaires (SMR) en projet.", "Moratoire sur Cigéo": "Suspendre le projet de stockage souterrain des déchets les plus radioactifs à Bure (Meuse).", "Annulation de la fusion de l'ASN et de l'IRSN": "Depuis 2025, le gendarme du nucléaire (ASN) et l'institut d'expertise (IRSN) forment une seule autorité, l'ASNR. Le projet est de les séparer à nouveau, pour que l'expertise reste indépendante de la décision.", "Reconversion des salariés et des territoires": "Accompagner vers d'autres emplois les salariés des centrales, et aider les communes qui vivent de leur présence.", "Poursuivre le programme dans un « pacte productif »": "Inscrire le nucléaire dans un plan plus large pour l'industrie et l'emploi.", "Un prix de l'électricité qui ne suive plus celui du gaz": "En Europe, le prix de l'électricité sur le marché dépend souvent du coût des centrales au gaz, même quand l'électricité vient du nucléaire. L'idée est que le prix payé en France suive plutôt le coût de production français.", "Relance du nucléaire et 4e génération (2022)": "Construire de nouveaux réacteurs et développer la 4e génération, des réacteurs encore au stade de la recherche.", "Un référendum sur l'avenir du nucléaire": "Faire trancher par un vote des Français la question : construire de nouveaux réacteurs ou sortir du nucléaire.", "Plus de recherche sur les renouvelables": "Investir davantage d'argent public dans la recherche sur l'éolien, le solaire et le stockage."};
for (const c of Object.values(POSITIONS)) for (const p of Object.values(c.ecologie || {})) if (p.mesures) p.mesures = p.mesures.map(m => typeof m === 'string' ? {titre: m, explication: EXPLICATIONS[m]} : m);

ull, "financement": null, "juridique": 1, "rythme": null}, "pourquoi": "Objectif clair. Une loi organique ne peut encadrer le Parlement que dans les cas prévus par la Constitution : une révision pourrait être nécessaire."}, "Retrait du principe de précaution de la Constitution": {"note": {"objectif": 1, "cout": null, "financement": null, "juridique": 1, "rythme": null}, "pourquoi": "Objectif clair. Suppose une révision de la Constitution."}, "Fin du financement public de l'éolien et du solaire (position de 2025)": {"note": {"objectif": 1, "cout": null, "financement": null, "juridique": 1, "rythme": null}, "pourquoi": "Objectif clair pour les nouveaux projets, sans date. Les objectifs européens de renouvelables engagent la France : il faudrait revoir sa contribution avec l'Union européenne."}, "Une « économie de guerre climatique » planifiée": {"note": null, "pourquoi": "Non noté : position de 2023, comme pour la note d'ensemble."}, "« Pas de nouvelle contrainte écologique sans nouveaux droits sociaux »": {"note": null, "pourquoi": "Non noté : position de 2023, comme pour la note d'ensemble."}, "Une loi de programmation climatique": {"note": {"objectif": 2, "cout": 1, "financement": 1, "juridique": 2, "rythme": 0}, "pourquoi": "Objectifs chiffrés et datés (44 % de renouvelables en 2030, 500 000 rénovations par an), coût partiel (7 Md€ par an pour l'adaptation) et recettes nommées. Mais 500 000 rénovations complètes par an, c'est plus de deux fois le rythme récent."}, "Des obligations : fin des voitures thermiques neuves en 2035, des poids lourds en 2040, vols de moins de 4 h 30 remplacés par le train": {"note": {"objectif": 2, "cout": null, "financement": null, "juridique": 1, "rythme": null}, "pourquoi": "Dates précises. Ces règles relèvent en grande partie de l'Union européenne : la fin des voitures thermiques neuves est fixée au niveau européen, et l'interdiction actuelle des vols courts a dû être validée par la Commission européenne."}, "Des incitations pour les ables ensemble, sans opposer les deux": {"note": null, "pourquoi": "Non noté : c'est un principe général, pas une mesure précise qu'on peut évaluer."}, "« Neutralité technologique » entre énergies bas carbone": {"note": null, "pourquoi": "Non noté : c'est un principe général, pas une mesure précise qu'on peut évaluer."}, "Prolonger les réacteurs existants": {"note": {"objectif": 1, "cout": null, "financement": null, "juridique": 2, "rythme": null}, "pourquoi": "Trajectoire déjà suivie par EDF, qui finance les travaux. Chaque réacteur reste soumis à un réexamen de sûreté tous les dix ans ; l'ASNR n'a pas vu d'obstacle a priori au-delà de 60 ans."}, "Décider du nombre de nouveaux réacteurs après une expertise de la Cour des comptes": {"note": null, "pourquoi": "Non noté : c'est une méthode de décision, pas une mesure."}, "Position différente de celle de Yannick Jadot, opposé à de nouveaux réacteurs": {"note": null, "pourquoi": "Non noté : c'est une prise de position, pas une mesure."}, "Développer la 4e génération": {"note": {"objectif": 0, "cout": 0, "financement": 0, "juridique": 2, "rythme": null}, "pourquoi": "Ni calendrier, ni coût. L'État a lancé quatre ans d'études avant toute décision."}, "Rouvrir Fessenheim (2022)": {"note": null, "pourquoi": "Non noté : position de 2022, comme pour la note d'ensemble."}, "Refus des conditions posées par Bruxelles à l'aide d'État, jugées « inacceptables »": {"note": null, "pourquoi": "Non noté : c'est une prise de position, pas une mesure."}, "Relancer le nucléaire et l'hydroélectricité": {"note": {"objectif": 0, "cout": 0, "financement": 0, "juridique": 1, "rythme": null}, "pourquoi": "Ni nombre de réacteurs ou de barrages, ni coût. Les concessions hydroélectriques font l'objet d'un désaccord ancien avec la Commission européenne."}, "Solaire en autoconsommation, jugé selon son « rapport coût-bénéfice »": {"note": null, "pourquoi": "Non noté : c'est un principe général, pas une mesure précise qu'on peut évaluer."}, "Fermeture ncement": null, "juridique": 2, "rythme": null}, "pourquoi": "Possible tant qu'EDF n'a pas pris sa décision finale d'investissement, attendue fin 2026. Après, des contrats seraient engagés."}, "Moratoire sur Cigéo": {"note": {"objectif": 1, "cout": 0, "financement": 0, "juridique": 2, "rythme": null}, "pourquoi": "Faisable par la loi, mais la gestion des déchets pendant le moratoire et son coût ne sont pas précisés."}, "Annulation de la fusion de l'ASN et de l'IRSN": {"note": {"objectif": 1, "cout": null, "financement": null, "juridique": 2, "rythme": null}, "pourquoi": "Possible par une loi ordinaire, comme la fusion votée en 2024."}, "Reconversion des salariés et des territoires": {"note": {"objectif": 0, "cout": 0, "financement": 0, "juridique": 2, "rythme": null}, "pourquoi": "Ni montant, ni calendrier, ni nombre de personnes concernées."}, "Poursuivre le programme dans un « pacte productif »": {"note": null, "pourquoi": "Non noté : c'est un principe général, pas une mesure précise qu'on peut évaluer."}, "Un prix de l'électricité qui ne suive plus celui du gaz": {"note": {"objectif": 1, "cout": 0, "financement": 0, "juridique": 1, "rythme": null}, "pourquoi": "Mécanisme et coût non précisés. Les règles européennes du marché de l'électricité, réformées en 2024, encadrent ce que la France peut faire seule."}, "Relance du nucléaire et 4e génération (2022)": {"note": null, "pourquoi": "Non noté : position de 2022, comme pour la note d'ensemble."}, "Un référendum sur l'avenir du nucléaire": {"note": {"objectif": 1, "cout": null, "financement": null, "juridique": 2, "rythme": null}, "pourquoi": "Possible : l'article 11 de la Constitution permet un référendum sur la politique environnementale. Question et date non précisées."}, "Plus de recherche sur les renouvelables": {"note": {"objectif": 0, "cout": 0, "financement": 0, "juridique": 2, "rythme": null}, "pourquoi": "Ni montant ni calendrier."}};

s/baisse-de-la-tva-arret-du-photovoltaique-ce-que-le-programme-energie-du-rn-changerait-pour-les-menages-2302/", "date": "29 septembre 2026", "reponse": "Arrêter le développement de l'éolien et du solaire", "chiffres": ["Mix 2050 visé : 60 % nucléaire, 40 % renouvelables", "Environ 7,2 Md€ d'économies par an affichées en supprimant les tarifs de rachat (contre-budget 2026 du RN)"], "mesures": [{"titre": "Arrêter le développement de l'éolien et du solaire", "explication": "Ne plus construire de nouvelles éoliennes ni de nouveaux parcs solaires.", "pourquoi": "Faisable en soi, mais incompatible avec son propre objectif de 40 % de renouvelables en 2050 et, selon RTE, avec la neutralité carbone. Les objectifs européens de renouvelables engagent aussi la France.", "note": {"realisme": 2, "droit": 1, "financement": 2, "precision": 1}}, {"titre": "Supprimer les tarifs de rachat préférentiels", "explication": "Aujourd'hui, l'État garantit un prix de vente de l'électricité aux producteurs éoliens et solaires. Le RN veut supprimer cette garantie.", "pourquoi": "Possible pour les nouveaux projets. Les contrats déjà signés restent dus : les remettre en cause exposerait l'État à des recours. L'économie annoncée dépend aussi des prix de marché : quand ils sont hauts, ces contrats rapportent à l'État.", "note": {"realisme": 4, "droit": 1, "financement": 1, "precision": 1}}, {"titre": "Démanteler une partie des parcs éoliens existants", "explication": "Retirer des éoliennes avant la fin de leur vie prévue.", "pourquoi": "Ni nombre de parcs, ni coût. Les exploitants ont des autorisations et des contrats en cours : un démontage anticipé supposerait de les indemniser.", "note": {"realisme": 4, "droit": 1, "financement": 0, "precision": 0}}]}}}, "lisnard": {"ecologie": {"2": {"texte": "Dit ne pas être « contre l'éolien ou le solaire » et soutient l'autoconsommation et le solaire sur les bâtiments agricoles. Mais il refuse de financer l'appel d'offres éolien en mer AO10 (11 parcs, environ 10 GW), qui selon lui « peut coûter 82 milliards d'euros sur sa durée de vie ». Il juge chaque investissement sur son rapport coût-bénéfice et donne la priorité au nucléaire et à l'hydraulique.", "source": "https://www.les-energies-renouvelables.eu/article/actualites/energies/david-lisnard-devoile-sa-vision-de-lenergie-et-leolien-en-mer-en-fait-les-frais-2461/", "date": "2 novembre 2026", "reponse": "Pas d'opposition de principe, mais pas d'éolien en mer AO10", "chiffres": ["AO10 : 11 parcs éoliens en mer, environ 10 GW, qu'il refuse de financer", "82 Md€ : son estimation du coût de l'AO10 sur sa durée de vie"], "mesures": [{"titre": "Ne pas financer l'appel d'offres éolien en mer AO10", "explication": "Renoncer à la dixième vague de parcs éoliens en mer, prévue au large des côtes françaises.", "pourquoi": "Le chiffre de 82 Md€ additionne une aide plafonnée à 63 Md€, atteinte seulement si les prix restent bas, et environ 20 Md€ de raccordement. L'attribution est prévue en février 2027, avant l'élection : y renoncer ensuite exposerait l'État à indemniser les lauréats, et ces 10 GW devraient être remplacés.", "note": {"realisme": 3, "droit": 1, "financement": 2, "precision": 2}}, {"titre": "Soutenir l'autoconsommation et le solaire sur les bâtiments agricoles", "explication": "Des panneaux posés sur les toits des maisons, des entreprises ou des hangars agricoles, dont l'électricité est consommée sur place.", "pourquoi": "Ni objectif ni montant.", "note": {"realisme": 4, "droit": 2, "financement": 0, "precision": 0}}, {"titre": "Juger chaque projet sur son rapport coût-bénéfice", "explication": "Ne soutenir une installation que si elle rapporte plus qu'elle ne coûte, économiquement et pour l'environnement.", "pourquoi": "Non noté : c'est un principe général, pas une mesure précise qu'on peut évaluer.", "note": null}], "citation": {"texte": "Il ne s'agit pas d'être contre l'éolien ou le solaire"}}}}, "melenchon": {"ecologie": {"2": {"texte": "Vise 100 % d'électricité renouvelable « au plus tard en 2060 », contre 2050 dans le programme de 2022. Le programme cite les énergies marines (éolien en mer, hydroliennes), l'hydraulique et la géothermie, et prévoit une planification du stockage. Pas de chiffre pour l'éolien ou le solaire ; le chiffrage est annoncé pour début 2027.", "source": "https://www.les-energies-renouvelables.eu/article/actualites/energies/100-renouvelables-en-2060-fin-des-epr2-ce-que-lfi-prevoit-pour-lenergie-2523/", "date": "10 novembre 2026", "reponse": "Développer massivement : 100 % renouvelables au plus tard en 2060", "chiffres": ["100 % d'électricité renouvelable au plus tard en 2060", "Objectif repoussé de 2050 (programme 2022) à 2060"], "mesures": [{"titre": "Développer les énergies marines (éolien en mer, hydroliennes)", "explication": "Installer des éoliennes en mer et des turbines sous-marines qui tournent avec les courants.", "pourquoi": "Ni puissance, ni calendrier, ni coût.", "note": {"realisme": 4, "droit": 2, "financement": 0, "precision": 0}}, {"titre": "Planifier le stockage et l'équilibre du réseau", "explication": "Organiser à l'avance les moyens de stocker l'électricité et d'équilibrer production et consommation quand il n'y a ni vent ni soleil.", "pourquoi": "Ni objectif ni montant.", "note": {"realisme": 4, "droit": 2, "financement": 0, "precision": 0}}, {"titre": "Gestion publique des barrages", "explication": "Confier l'exploitation des centrales hydroélectriques à des acteurs publics plutôt qu'à des concessions ouvertes à la concurrence.", "pourquoi": "La loi du 29 juin 2026 a fait passer les grandes centrales sous un régime d'autorisation. Revenir à une gestion publique doit respecter les règles européennes de concurrence ; coût non chiffré.", "note": {"realisme": 4, "droit": 1, "financement": 0, "precision": 1}}], "citation": {"texte": "Nous avons pris beaucoup de retard", "auteur": "Aurélie Trouvé, députée LFI, à propos des renouvelables", "date": "23 juin 2026"}}}}, "philippe": {"ecologie": {"2": {"texte": "Veut « développer les renouvelables là où elles sont efficaces », aux côtés du nucléaire, sans objectif chiffré pour l'éolien ou le solaire. Au colloque de l'UFE, Christophe Béchu (Horizons) a présenté les renouvelables comme des « compléments indispensables » et jugé « indispensable » d'accélérer le stockage et la flexibilité.", "source": "https://www.edouardphilippe.fr/programme/energie", "date": "programme consulté le 18 novembre 2026", "reponse": "Développer là où elles sont efficaces, sans objectif chiffré", "mesures": [{"titre": "Renouvelables « là où elles sont efficaces »", "explication": "Développer l'éolien et le solaire seulement là où ils produisent beaucoup pour un coût raisonnable.", "pourquoi": "Non noté : c'est un principe général, pas une mesure précise qu'on peut évaluer.", "note": null}, {"titre": "Accélérer le stockage et la flexibilité", "explication": "Développer batteries, stations de pompage et consommation plus souple pour absorber la production variable du vent et du soleil.", "pourquoi": "Ni objectif, ni montant, ni calendrier.", "note": {"realisme": 4, "droit": 2, "financement": 0, "precision": 0}}], "citation": {"texte": "Relancer le nucléaire et développer les renouvelables là où elles sont efficaces."}}}}, "retailleau": {"ecologie": {"2": {"texte": "Veut arrêter les subventions publiques à l'éolien et au solaire. Dans une tribune au Figaro du 2 juillet 2025, cosignée avec François-Xavier Bellamy et Julien Aubert, il estimait qu'ils n'apportent « qu'une intermittence coûteuse à gérer ». Il l'a redit au colloque de l'UFE du 23 juin 2026, en proposant aussi de mobiliser jusqu'à 4 GW de nouvelle hydroélectricité. En juin 2025, des députés LR avaient fait voter, avec le RN, un moratoire sur l'éolien et le solaire, retiré ensuite.", "source": "https://www.connaissancedesenergies.org/afp/macron-repond-retailleau-apres-son-appel-stopper-les-subventions-publiques-pour-leolien-et-le-photovoltaique-250703", "date": "2 juillet 2025, confirmé le 23 juin 2026", "reponse": "Arrêter les subventions à l'éolien et au solaire", "chiffres": ["Jusqu'à 4 GW de nouvelle hydroélectricité"], "mesures": [{"titre": "Fin du financement public de l'éolien et du solaire", "explication": "Arrêter les aides publiques qui garantissent un prix de vente aux nouveaux parcs éoliens et solaires.", "pourquoi": "Objectif clair pour les nouveaux projets, sans date. Les contrats signés restent dus, et les objectifs européens de renouvelables engagent la France.", "note": {"realisme": 4, "droit": 1, "financement": 2, "precision": 1}}, {"titre": "Mobiliser jusqu'à 4 GW de nouvelle hydroélectricité", "explication": "Augmenter la puissance des barrages, notamment avec des stations de pompage qui remontent l'eau quand l'électricité est abondante.", "pourquoi": "Selon RTE, le potentiel de nouveaux barrages est limité : l'essentiel devrait venir de stations de pompage. Ni calendrier ni coût.", "note": {"realisme": 2, "droit": 1, "financement": 0, "precision": 1}}], "citation": {"texte": "Il n'y a donc aucune raison de continuer de les financer par des subventions publiques", "auteur": "Bruno Retailleau, François-Xavier Bellamy et Julien Aubert, Le Figaro", "date": "2 juillet 2025"}}}}, "tondelier": {"ecologie": {"2": {"texte": "Veut « déployer le plus vite possible les énergies renouvelables », avec 100 % de renouvelables à terme. Le programme vise 44 % de renouvelables dans la consommation d'électricité en 2030, contre 24 % en 2025, et interdirait les parcs éoliens et solaires dans les parcs nationaux et les réserves naturelles.", "source": "https://vert.eco/politique/conge-climatique-interdiction-des-pesticides-sortie-du-nucleaire-ce-que-contient-le-programme-de-marine-tondelier-sur-lecologie/", "date": "18 novembre 2026", "reponse": "Accélérer au maximum : 44 % d'électricité renouvelable en 2030", "chiffres": ["44 % de renouvelables dans la consommation d'électricité en 2030", "Contre 24 % en 2025 (SDES, méthode européenne de calcul, différente de la part dans la production)", "100 % de renouvelables à terme"], "mesures": [{"titre": "Atteindre 44 % d'électricité renouvelable en 2030", "explication": "Presque doubler la part de l'électricité produite par le vent, le soleil, l'eau et la biomasse en cinq ans.", "pourquoi": "Passer de 24 % à 44 % en cinq ans demande environ +18 TWh par an, près de deux fois le rythme récent (calcul), et plus que la programmation officielle.", "note": {"realisme": 1, "droit": 2, "financement": 1, "precision": 2}}, {"titre": "Interdire l'éolien et le solaire dans les parcs nationaux et les réserves naturelles", "explication": "Ne pas installer d'éoliennes ni de panneaux solaires dans les espaces naturels les plus protégés.", "pourquoi": "Faisable par la loi, sans dépense. Ces zones accueillent déjà peu de projets.", "note": {"realisme": 4, "droit": 2, "financement": 2, "precision": 1}}], "citation": {"texte": "Il faudra d'abord déployer le plus vite possible les énergies renouvelables", "date": "23 juin 2026"}}}}});

ammation-arrive-enfin-par-decret-155776/"}]}}});

ecision": 0}}], "citation": {"texte": "La logique, c'est de cibler un soutien envers ceux qui en ont le plus besoin et le faire de façon temporaire", "date": "23 septembre 2026"}}}}, "philippe": {"ecologie": {"3": {"texte": "Face à la hausse des carburants, il propose de doubler tout de suite l'aide ciblée aux automobilistes qui dépendent de leur voiture, financée par des économies sur les dépenses de l'État, plutôt que de baisser les taxes. Il rappelle son expérience des gilets jaunes. Pas de position connue sur les ZFE ni sur la fin du thermique en 2035.", "source": "https://www.connaissancedesenergies.org/afp/la-campagne-dattal-et-de-philippe-percutee-par-la-crise-des-carburants-260922", "date": "22 septembre 2026", "reponse": "Doubler l'aide ciblée, financée par des économies", "chiffres": ["Aide actuelle : 100 € pour les gros rouleurs modestes", "Proposition : la doubler"], "mesures": [{"titre": "Doubler l'aide aux automobilistes qui dépendent de leur voiture", "explication": "Passer de 100 € à environ 200 € l'aide versée aux personnes modestes qui roulent beaucoup pour travailler.", "pourquoi": "Le gouvernement a annoncé ce doublement le même mois. Le financement par « des économies » n'est pas détaillé.", "note": {"realisme": 4, "droit": 2, "financement": 1, "precision": 1}}], "citation": {"texte": "L'expérience (lui) a appris qu'avant de demander un effort aux Français", "auteur": "Édouard Philippe, cité par l'AFP", "date": "22 septembre 2026"}}}}, "le-pen": {"ecologie": {"3": {"texte": "Le RN demande de baisser la TVA sur les carburants de 20 % à 5,5 %. Ses députés ont déposé en juin 2026 une proposition de loi pour supprimer les zones à faibles émissions, qui n'a pas pu être votée le 8 octobre 2026. Son programme de 2024 prévoyait de renoncer à l'interdiction de vendre des voitures thermiques neuves en 2035.", "source": "https://www.connaissancedesenergies.org/afp/la-campagne-dattal-et-de-philippe-percutee-par-la-crise-des-carburants-260922", "date": "22 septembre 2026", "reponse": "Baisser la TVA sur les carburants et supprimer les ZFE", "chiffres": ["TVA sur les carburants : de 20 % à 5,5 %", "Coût estimé par Gabriel Attal : 12 à 15 Md€ par an"], "mesures": [{"titre": "Baisser la TVA sur les carburants à 5,5 %", "explication": "La TVA représente environ un sixième du prix à la pompe. La passer de 20 % à 5,5 % ferait baisser le litre d'environ 25 à 30 centimes.", "pourquoi": "La directive européenne sur la TVA ne prévoit pas de taux réduit pour les carburants : il faudrait la modifier, ce qui demande l'accord des 27 pays. Le coût, plus de 10 Md€ par an, n'est pas financé.", "note": {"realisme": 4, "droit": 0, "financement": 0, "precision": 1}}, {"titre": "Supprimer les zones à faibles émissions", "explication": "Mettre fin aux règles qui interdisent aux voitures les plus anciennes de circuler dans certaines grandes villes, comme Paris ou Lyon.", "pourquoi": "Une loi suffit : le Parlement l'avait votée en avril 2026, et le Conseil constitutionnel ne l'a censurée que pour une raison de procédure (mesure sans lien avec le texte).", "note": {"realisme": 4, "droit": 2, "financement": 2, "precision": 1}}, {"titre": "Renoncer à la fin des voitures thermiques neuves en 2035 (programme 2024)", "explication": "Continuer à autoriser la vente de voitures neuves à essence ou diesel après 2035.", "pourquoi": "L'Union européenne va déjà dans ce sens, mais le texte n'est pas définitif ; la France ne peut pas décider seule.", "note": {"realisme": 3, "droit": 1, "financement": 2, "precision": 1}}]}}}, "melenchon": {"ecologie": {"3": {"texte": "Veut bloquer le prix des carburants à 1,70 € le litre, en s'appuyant sur le Code de commerce, et plafonner les marges des raffineurs. Son programme automobile prévoit un leasing social généralisé, des voitures électriques à 10 000 € et l'achat par l'État de 300 000 voitures électriques par an, et garde l'objectif de 100 % de ventes électriques en 2035. Ses députés ont voté la suppression des ZF
