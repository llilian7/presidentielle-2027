REPERES.ecologie[5] = [{"texte": "Revenus : en 2025, la valeur ajoutée de l'agriculture a progressé de 4,7 %, mais le prix des céréales a baissé de 10,7 % après −8 % en 2024 (comptes provisoires Insee-Agreste, juillet 2026).", "source": "https://www.terre-net.fr/revenus-agricoles/article/900993/les-comptes-de-l-agriculture-confirment-l-effondrement-des-cerealiers"}, {"texte": "Mercosur : la France a voté contre le 9 janvier 2026 mais a été mise en minorité. Accord signé le 17 janvier, application provisoire depuis le 1er mai 2026 ; le Parlement européen a saisi la Cour de justice de l'UE.", "source": "https://www.ifri.org/sites/default/files/2026-04/ifri_krpata_accord_ue-mercosur_avril2026_0.pdf"}, {"texte": "Clauses de sauvegarde votées par le Parlement européen le 10 février 2026 (483 voix pour) : enquête si les importations sensibles (bœuf, volaille, sucre…) augmentent de 5 %.", "source": "https://www.reussir.fr/mercosur-le-parlement-europeen-approuve-les-clauses-de-sauvegarde-quels-produits-agricoles"}, {"texte": "Loi Duplomb (août 2025) : le retour de l'acétamipride a été censuré au nom de la Charte de l'environnement ; les mesures sur les réserves d'eau et les élevages ont été validées.", "source": "https://lcp.fr/actualites/loi-agricole-duplomb-le-conseil-constitutionnel-censure-la-reintroduction-de-l"}, {"texte": "Loi d'urgence agricole, validée le 14 août 2026 : dérogations d'un an, renouvelables deux fois, pour deux insecticides interdits (acétamipride pour les noisettes, flupyradifurone pour betteraves, pommes et cerises).", "source": "https://vert.eco/agriculture/le-conseil-constitutionnel-valide-lessentiel-de-la-loi-durgence-agricole-dont-le-retour-controverse-de-lacetamipride/"}];
deepMerge(POSITIONS, {"arthaud": {"ecologie": {"5": {"texte": "Pas de position connue pour 2027 sur l'agriculture.", "source": "", "date": "", "reponse": "Pas de réponse connue"}}}, "dupont-aignan": {"ecologie": {"5": {"texte": "Pas de position connue pour 2027 sur l'agriculture.", "source": "", "date": "", "reponse": "Pas de réponse connue"}}}, "glucksmann": {"ecologie": {"5": {"texte": "Pas de position connue pour 2027 sur l'agriculture.", "source": "", "date": "", "reponse": "Pas de réponse connue"}}}, "lisnard": {"ecologie": {"5": {"texte": "Pas de position connue pour 2027 sur l'agriculture.", "source": "", "date": "", "reponse": "Pas de réponse connue"}}}, "roussel": {"ecologie": {"5": {"texte": "Pas de position connue pour 2027 sur l'agriculture.", "source": "", "date": "", "reponse": "Pas de réponse connue"}}}, "villepin": {"ecologie": {"5": {"texte": "Pas de position connue pour 2027 sur l'agriculture.", "source": "", "date": "", "reponse": "Pas de réponse connue"}}}, "philippe": {"ecologie": {"5": {"texte": "Pas de proposition propre connue. Au Sommet de l'élevage, le 9 octobre 2026, il a jugé « très dangereuses pour les agriculteurs français » les propositions de Marine Le Pen.", "source": "https://lavolontepaysanne.fr/ils-sont-candidats-a-la-presidentielle-2027-leurs-programmes-pour-lagriculture/", "date": "9 octobre 2026", "reponse": "Pas de réponse connue"}}}, "attal": {"ecologie": {"5": {"texte": "Veut des prix planchers indexés sur les coûts de production (lait, viande, céréales) et des contrats obligatoires de trois à cinq ans entre la grande distribution et les producteurs, au lieu de la renégociation chaque année. Il refuse l'accord avec le Mercosur « en l'état » et veut des clauses miroirs dans tous les accords commerciaux. Il veut aussi renforcer la PAC et simplifier l'agrandissement des bâtiments d'élevage. Rien sur les pesticides.", "source": "https://lavolontepaysanne.fr/ils-sont-candidats-a-la-presidentielle-2027-leurs-programmes-pour-lagriculture/", "date": "11 novembre 2026", "reponse": "Prix planchers, contrats longs et non au Mercosur en l'état", "chiffres": ["Contrats de 3 à 5 ans entre distributeurs et producteurs"], "mesures": [{"titre": "Prix planchers indexés sur les coûts de production", "explication": "Un prix minimum en dessous duquel le lait, la viande ou les céréales ne pourraient pas être achetés, calculé à partir de ce que coûte leur production.", "pourquoi": "Des prix minimum imposés par l'État se heurtent aux règles européennes du marché agricole commun, qui laissent les prix se former librement. La loi EGalim s'en approche déjà en obligeant à partir des coûts de production. Et un prix plancher français ne s'applique pas aux produits importés.", "note": {"realisme": 3, "droit": 1, "financement": 2, "precision": 1}}, {"titre": "Contrats obligatoires de 3 à 5 ans avec la grande distribution", "explication": "Fixer les prix pour plusieurs années, au lieu de les renégocier chaque année entre supermarchés et fournisseurs.", "pourquoi": "Proche de ce que la loi EGalim 2 impose déjà entre agriculteurs et premiers acheteurs ; l'étendre aux grandes surfaces se fait par la loi.", "note": {"realisme": 4, "droit": 2, "financement": 2, "precision": 1}}, {"titre": "Refuser le Mercosur en l'état et imposer des clauses miroirs", "explication": "Les clauses miroirs obligent les produits importés à respecter les mêmes règles que les produits européens (pesticides, bien-être animal…).", "pourquoi": "La France a voté contre en janvier 2026 mais a été mise en minorité : l'accord s'applique à titre provisoire depuis le 1er mai 2026. Le commerce relève de l'Union européenne : un président ne peut pas le bloquer seul. Les clauses miroirs se négocient aussi au niveau européen.", "note": {"realisme": 2, "droit": 1, "financement": 2, "precision": 0}}], "citation": {"texte": "Il faut que l'agriculture ne soit pas la variable d'ajustement de ces accords commerciaux", "date": "4 juin 2026"}}}}, "retailleau": {"ecologie": {"5": {"texte": "Défend « pas d'interdiction sans solution » pour les pesticides et a soutenu le retour de l'acétamipride : « C'est moi qui ai fait inscrire la loi Duplomb au calendrier parlementaire ! » Il veut interdire les surtranspositions des normes européennes, retirer le principe de précaution de la Constitution, supprimer l'Office français de la biodiversité et généraliser les réserves d'eau. Il veut une PAC à l'hectare avec un premier pilier fort et s'oppose aux « mauvais » accords commerciaux.", "source": "https://www.reussir.fr/retailleau-tondelier-et-attal-passent-leur-premier-oral-face-aux-jeunes-agriculteurs", "date": "4 juin 2026", "reponse": "Moins de normes, pas d'interdiction de pesticides sans solution, plus de réserves d'eau", "mesures": [{"titre": "Pas d'interdiction de pesticide sans solution de remplacement", "explication": "Ne pas interdire un produit tant que les agriculteurs n'ont pas d'alternative, et réautoriser ceux permis ailleurs en Europe, comme l'acétamipride.", "pourquoi": "En partie fait : la loi d'urgence agricole, validée le 14 août 2026, permet des dérogations d'un an pour l'acétamipride. Aller plus loin se heurterait à la Charte de l'environnement, qui a fait censurer la loi Duplomb en 2025.", "note": {"realisme": 4, "droit": 1, "financement": 2, "precision": 1}}, {"titre": "Interdire les surtranspositions", "explication": "Interdire d'ajouter, en droit français, des règles plus strictes que celles exigées par l'Union européenne.", "pourquoi": "Une loi ne peut pas empêcher les lois suivantes d'être plus strictes : il faudrait sans doute réviser la Constitution. Pas de liste des règles visées.", "note": {"realisme": 3, "droit": 1, "financement": 2, "precision": 0}}, {"titre": "Généraliser les réserves d'eau", "explication": "Construire davantage de retenues pour stocker l'eau en hiver et irriguer en été.", "pourquoi": "La loi Duplomb et la loi d'urgence agricole ont déjà simplifié leur construction. Ni nombre ni coût, alors que ces réserves sont souvent financées en partie par l'argent public.", "note": {"realisme": 3, "droit": 2, "financement": 0, "precision": 0}}, {"titre": "Supprimer l'Office français de la biodiversité", "explication": "Cet organisme public contrôle notamment le respect des règles environnementales dans les exploitations.", "pourquoi": "Faisable par la loi, mais ses missions de contrôle, dont certaines viennent du droit européen, devraient être confiées à un autre service.", "note": {"realisme": 3, "droit": 2, "financement": 1, "precision": 1}}], "citation": {"texte": "Pas d'interdiction sans solution", "date": "4 juin 2026"}}}}, "le-pen": {"ecologie": {"5": {"texte": "Au congrès des Jeunes agriculteurs, Jean-Philippe Tanguy, pour le RN, a promis des prix planchers, la lutte contre les centrales d'achat et la suppression des droits de succession pour un agriculteur qui garde la ferme au moins dix ans. Marine Le Pen promet des ordonnances pour mettre fin à la « folie normative » et veut se battre pour que la PAC ne baisse pas. Le RN s'oppose à l'entrée de l'Ukraine dans l'Union.", "source": "https://lavolontepaysanne.fr/ils-sont-candidats-a-la-presidentielle-2027-leurs-programmes-pour-lagriculture/", "date": "8 octobre 2026", "reponse": "Prix planchers, moins de normes, pas de droits de succession sur les fermes", "mesures": [{"titre": "Prix planchers et lutte contre les centrales d'achat", "explication": "Un prix minimum pour les produits agricoles, et des règles contre les grandes centrales qui négocient pour plusieurs supermarchés, parfois depuis l'étranger.", "pourquoi": "Des prix minimum imposés par l'État se heurtent aux règles européennes du marché agricole commun, qui laissent les prix se former librement. La loi EGalim s'en approche déjà en obligeant à partir des coûts de production. Et un prix plancher français ne s'applique pas aux produits importés. Ni niveau ni produits précisés.", "note": {"realisme": 3, "droit": 1, "financement": 2, "precision": 0}}, {"titre": "Supprimer les droits de succession sur les fermes gardées dix ans", "explication": "Un enfant qui reprend la ferme familiale ne paierait aucun impôt sur l'héritage, s'il la garde au moins dix ans.", "pourquoi": "Faisable par la loi ; des exonérations partielles existent déjà. Le coût n'est pas chiffré.", "note": {"realisme": 4, "droit": 2, "financement": 0, "precision": 2}}, {"titre": "Ordonnances contre la « folie normative »", "explication": "Supprimer rapidement des règles jugées inutiles, par des textes du gouvernement autorisés par le Parlement.", "pourquoi": "Beaucoup de règles agricoles viennent de l'Union européenne et ne peuvent pas être supprimées en France seule. Pas de liste des normes visées.", "note": {"realisme": 3, "droit": 1, "financement": 2, "precision": 0}}], "citation": {"texte": "Des prix rémunérateurs, que vous puissiez vivre de notre métier", "auteur": "Jean-Philippe Tanguy (RN), au congrès des Jeunes agriculteurs", "date": "4 juin 2026"}}}}, "melenchon": {"ecologie": {"5": {"texte": "Le plan agricole de LFI prévoit des prix planchers obligatoires, fixés à partir des coûts réels de production, par produit et par région, avec des contrôles renforcés. Il veut plafonner les marges des intermédiaires et des supermarchés, geler temporairement les prix d'un panier de produits essentiels et taxer les superprofits. Il veut sortir des traités de libre-échange et donner la priorité à l'alimentation et à l'eau potable sur l'irrigation pour l'export. Pas de coût global.", "source": "https://lafranceinsoumise.fr/wp-content/uploads/2026/09/Plan-ClimatAgri-Sept-2026-WEB.pdf", "date": "septembre 2026", "reponse": "Prix planchers obligatoires et sortie du libre-échange", "mesures": [{"titre": "Prix planchers obligatoires par production et par région", "explication": "Aucun produit agricole ne pourrait être acheté en dessous d'un prix fixé à partir de ce qu'il coûte à produire.", "pourquoi": "Des prix minimum imposés par l'État se heurtent aux r ve n'est pas confirmée à ce jour ; les assouplissements ajoutés à la loi de simplification ont été censurés par le Conseil constitutionnel le 21 mai 2026, comme la suppression des ZFE.", "source": "https://www.banquedesterritoires.fr/trajectoire-de-reduction-de-lartificialisation-feu-vert-du-senat-pour-un-nouveau-round"}, {"texte": "Décision du Conseil constitutionnel du 21 mai 2026 sur la loi de simplification (ZFE et ZAN).", "source": "https://www.publicsenat.fr/actualites/politique/loi-de-simplification-le-conseil-constitutionnel-censure-la-suppression-des-zfe-et-lassouplissement-du-zan"}, {"texte": "Zones humides : environ la moitié de leur surface était dégradée en 2020, surtout par l'agriculture intensive et l'urbanisation.", "source": "https://www.statistiques.developpement-durable.gouv.fr/milieux-humides-et-aquatiques-en-france-etat-des-connaissances-en-2025"}];

d les allègements généraux de cotisations (Haut-commissariat à la Stratégie et au Plan, juillet 2026, chiffrage non mis à jour depuis juillet 2025).", "source": "https://www.strategie-plan.gouv.fr/files/files/Publications/2026/2026-07-16%20-%20Rapport%20Aides%20aux%20entreprises/HCSP-2026-RAPPORT-AIDES-ENTREPRISES.pdf"}], "3": [{"texte": "La politique commerciale est une compétence exclusive de l'Union européenne : les droits de douane et les accords commerciaux sont décidés à Bruxelles, pas par la France seule (article 207 du traité sur le fonctionnement de l'Union).", "source": "https://eur-lex.europa.eu/legal-content/FR/TXT/?uri=CELEX:12012E207"}, {"texte": "L'accord commercial intérimaire entre l'Union européenne et le Mercosur « s'applique provisoirement à compter du 1er mai 2026 », en attendant la ratification de l'accord complet (douanes françaises, 28 avril 2026).", "source": "https://www.douane.gouv.fr/actualites/entree-en-vigueur-de-laccord-de-commerce-interimaire-entre-lunion-europeenne-et-le"}], "4": [{"texte": "Les rachats d'entreprises françaises sensibles par des investisseurs étrangers sont déjà soumis à l'autorisation du ministère de l'Économie (contrôle des investissements étrangers) : 418 dossiers ont été déposés en 2025, et 167 autorisations délivrées sur 323 décisions.", "source": "https://www.tresor.economie.gouv.fr/Articles/2026/07/28/publication-du-rapport-annuel-sur-le-controle-ief-en-2025"}, {"texte": "L'article 123 du traité sur le fonctionnement de l'Union interdit à la Banque centrale européenne de financer directement les États.", "source": "https://eur-lex.europa.eu/legal-content/FR/TXT/?uri=CELEX:12012E123"}], "5": [{"texte": "Les concessions des grandes sociétés d'autoroutes se terminent entre fin 2031 et 2036 (voir thème Écologie, transports).", "source": "https://www.ecologie.gouv.fr/sites/default/files/documents/11022026_DP_LoiCadre_Transports.pdf"}, {"texte": "La Constitution (Déclaration de 1789, article 17) impose une « juste et préalable indemnité » en cas de privation de propriété.", "source": "https://www.conseil-constitutionnel.fr/le-bloc-de-constitutionnalite/declaration-des-droits-de-l-homme-et-du-citoyen-de-1789"}], "6": [{"texte": "Au premier trimestre 2026, le patrimoine financier des ménages comprend 3 922,3 Md€ de produits de taux et 2 511,6 Md€ de produits de fonds propres (Banque de France, citée par la Fédération bancaire française). Les 37 000 Md€ cités par Éric Zemmour portent sur toute l'Europe.", "source": "https://www.fbf.fr/uploads/2026/09/Lepargne-des-menages-Aout-2026.pdf"}, {"texte": "Modifier les traités européens, par exemple le statut de la BCE, demande l'accord unanime des 27 États et une ratification par chacun.", "source": "https://eur-lex.europa.eu/legal-content/FR/TXT/?uri=CELEX:12016M048"}], "7": [{"texte": "En 2024, la dépense intérieure de recherche et développement atteint 2,18 % du PIB (64,1 Md€), dont 1,43 % du PIB pour les entreprises (ministère de l'Enseignement supérieur et de la Recherche, juillet 2026).", "source": "https://www.enseignementsup-recherche.gouv.fr/sites/default/files/2026-10/NF_2026-16_DIRD_v2.pdf"}, {"texte": "Le crédit d'impôt recherche devrait coûter 8,0 Md€ en 2027, pour un peu plus de 17 500 entreprises (Sénat, commission des finances, octobre 2026).", "source": "https://www.senat.fr/fileadmin/cru-1792598966/Commissions/Finances/2026-2027/PLF_2027/NP/NP_Remboursements_et_degrevements_PLF_2027.pdf"}], "8": [{"texte": "Le règlement européen sur l'IA (AI Act) et le RGPD s'appliquent directement en France : un État ne peut pas y déroger seul, mais l'AI Act prévoit des « bacs à sable réglementaires » pour tester des innovations.", "source": "https://eur-lex.europa.eu/legal-content/FR/TXT/?uri=CELEX:32024R1689"}], "9": [{"texte": "Le code de commerce (article L410-2) permet au gouvernement de fixer des prix par décret pendant une crise, pour six mois au plus.", "source": "https://www.publicsenat.fr/actualites/politique/jean-luc-melenchon-denonce-un-gouvernement-depasse-face-a-la-flambee-des-prix-des-carburants"}, {"texte": "La directive européenne sur la TVA autorise un taux réduit sur l'électricité et le gaz, mais pas sur les carburants.", "source": "https://eur-lex.europa.eu/legal-content/FR/TXT/?uri=CELEX:32022L0542"}, {"texte": "Les certificats d'économies d'énergie sont une obligation « imposée par les pouvoirs publics aux fournisseurs d'énergie », qui financent ainsi des travaux d'économies d'énergie chez les ménages ; ils servent à atteindre l'objectif européen d'économies d'énergie.", "source": "https://www.ecologie.gouv.fr/politiques-publiques/dispositif-certificats-deconomies-denergie"}]};
deepMerge(POSITIONS, {"arthaud": {"economie": {"0": {"texte": "Ne propose pas de politique de croissance : elle veut « renverser le capitalisme » et dit que « les vrais maîtres de la société » sont « la classe capitaliste ». Elle propose de prendre « sur les profits » pour garantir à chacun au moins 2 200 € net par mois (salaire, revenu ou pension). À son premier meeting de campagne, elle a présenté son programme comme « un plan de combat » plutôt qu'un programme électoral.", "source": "https://www.lagazettefrance.fr/article/plus-leon-trotski-que-leon-xiv-premier-meeting-de-campagne-pour-arthaud-et-lo", "date": "26 septembre 2026 (et 14 février 2026)", "reponse": "Renverser le capitalisme, pas relancer la croissance", "citation": {"texte": "Notre programme n'est pas un programme électoral, c'est un plan de combat", "date": "26 septembre 2026"}}, "1": {"texte": "Ne propose pas de politique industrielle. Elle dénonce les fermetures d'usines et les suppressions d'emplois, et les plus de 200 Md€ d'aides publiques versées chaque année aux entreprises.", "source": "https://www.lutte-ouvriere.org/medias/journalnumero/fichiers/2026/09/3031-web.pdf", "date": "4 septembre 2026", "reponse": "Dénoncer les fermetures d'usines, pas de plan industriel", "citation": {"texte": "le bilan de la bourgeoisie est d'avoir fermé des centaines d'usines ces dernières années", "date": "4 septembre 2026"}}, "2": {"texte": "Ne propose pas de soutien aux entreprises. Elle reproche au patronat de recevoir plus de 200 Md€ d'aides publiques par an, et veut prendre « sur les profits » pour augmenter les salaires.", "source": "https://www.lutte-ouvriere.org/medias/journalnumero/fichiers/2026/09/3031-web.pdf", "date": "4 septembre 2026", "reponse": "Contre les aides publiques au patronat"}, "3": {"texte": "Rejette le protectionnisme et le « produire français », qu'elle range parmi les politiques patronales : « Le protectionnisme ne protège ni l'emploi ni les salaires ».", "source": "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure-ete-2026.pdf", "date": "26 juin 2026 (et 14 février 2026)", "reponse": "Contre le protectionnisme et le « nationalisme économique »", "citation": {"texte": "Le protectionnisme ne protège ni l'emploi ni les salaires", "date": "26 juin 2026"}}, "4": {"texte": "Rejette la souveraineté nationale comme solution, qu'elle oppose à l'intérêt des travailleurs, et reproche à Jean-Luc Mélenchon de se poser en « champion de la souveraineté française ».", "source": "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure-ete-2026.pdf", "date": "26 juin 2026 (et 14 février 2026)", "reponse": "Rejette l'idée de souveraineté nationale"}, "5": {"texte": "Rejette l'idée d'« injecter une petite dose de planification et de nationalisations » dans le système. Elle veut l'« expropriation sans indemnité ni rachat » des grands groupes, « en commençant par ceux de l'industrie pétrolière et des industries de guerre », et que leurs comptes soient rendus publics.", "source": "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure-ete-2026.pdf", "date": "26 juin 2026", "reponse": "Exproprier sans indemnité les grands groupes, pas les nationaliser", "mesures": [{"titre": "Exproprier sans indemnité les groupes pétroliers et d'armement", "explication": "L'État prendrait ces entreprises à leurs actionnaires sans les payer.", "pourquoi": "La Constitution impose une « juste et préalable indemnité » en cas de privation de propriété : contraire à la Constitution en l'état. Sans coût ; entreprises visées par secteur seulement.", "note": {"v2": 1, "technique": 3, "droit": 0, "financement": 2, "precision": 1, "portee": "S", "statut": "N"}}]}, "6": {"texte": "Dénonce le poids des banques : « Les plus grands bénéficiaires de cette dette sont les banques et les financiers », qui recevraient 74 Md€ d'intérêts en 2026. Elle veut taxer les profits des grandes entreprises. Pas de mesure sur la régulation bancaire.", "source": "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure-ete-2026.pdf", "date": "26 juin 2026", "reponse": "Contre les banques et la finance, sans mesure précise", "citation": {"texte": "Les plus grands bénéficiaires de cette dette sont les banques et les financiers.", "date": "26 juin 2026"}}, "7": {"texte": "Pas de politique de l'innovation. Elle estime que « les progrès techniques permettraient de réduire à quelques heures par semaine le temps de travail ».", "source": "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure-ete-2026.pdf", "date": "26 juin 2026", "reponse": "Le progrès technique devrait réduire le temps de travail"}, "8": {"texte": "Pas de programme sur l'IA. Elle dénonce son usage comme prétexte : « Au prétexte que l'intelligence artificielle peut prendre en charge certaines tâches, de nouveaux plans de licenciements sont en préparation ».", "source": "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure-ete-2026.pdf", "date": "26 juin 2026", "reponse": "L'IA, prétexte à des licenciements"}, "9": {"texte": "Pour elle, « les salaires doivent suivre la hausse des prix » : elle veut indexer les salaires, les pensions et les allocations, et les augmenter de « 300, 400, 500 euros ». Elle accuse les groupes pétroliers d'avoir augmenté les carburants dès le début de la guerre en Iran.", "source": "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure-ete-2026.pdf", "date": "26 juin 2026", "reponse": "Indexer les salaires sur les prix, plutôt que bloquer les prix", "mesures": [{"titre": "Indexer salaires, pensions et allocations sur les prix", "explication": "Les revenus augmenteraient automatiquement comme les prix.", "pourquoi": "Sera évaluée avec les salaires (thème Travail) : non notée ici.", "note": null}], "citation": {"texte": "Les salaires doivent suivre la hausse des prix.", "date": "26 juin 2026"}}}}, "attal": {"economie": {"0": {"texte": "Défend une économie « libérale » mais « planifiée », au service d'un « capitalisme de l'innovation » : l'État planifierait « à la De Gaulle » les secteurs stratégiques (IA, quantique, biotechnologies, énergie, spatial, défense). Selon l'AFP, il veut aussi une loi de stabilité fiscale et normative sur dix ans, réduire d'un quart la charge administrative des entreprises, et retrouver en dix ans le rythme de croissance des États-Unis (2,4 % par an, contre 1,2 % en France). Il propose une « TVA sociale » pour baisser les cotisations des salariés, et veut mieux orienter l'épargne (2 000 Md€ d'assurance-vie).", "source": "https://www.maddyness.com/2026/10/28/presidentielle-2027-gabriel-attal-veut-investir-200-milliards-deuros-dans-lia-et-le-quantique/", "date": "28 octobre 2026 (et 21 juillet 2025)", "reponse": "Une économie « libérale » mais « planifiée » autour de l'innovation", "chiffres": ["2 millions d'emplois visés, dont 500 000 dans l'industrie", "2 000 Md€ d'assurance-vie à mieux orienter"], "mesures": [{"titre": "Une « TVA sociale » pour baisser les cotisations des salariés", "explication": "Augmenter la TVA, payée sur la consommation, pour financer la suppression de la part salariale des cotisations vieillesse : le salaire net augmente.", "pourquoi": "Déjà fait en Allemagne en 2007 ; votée en France en 2012 puis abrogée avant d'entrer en vigueur. Une loi de finances suffit. Recette désignée (la TVA), mais ni taux ni coût annoncés, alors que la mesure pèse plusieurs milliards par an. Une hausse de TVA se répercute en partie sur les prix.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 1, "precision": 1, "portee": "T", "statut": "N", "gc": 1}}, {"titre": "Une loi de stabilité fiscale et normative sur dix ans", "explication": "S'engager à ne pas changer les impôts et les règles des entreprises pendant dix ans.", "pourquoi": "Une loi peut fixer ce cadre, mais elle ne lie pas les lois suivantes : c'est surtout un engagement politique. Sans coût. Le périmètre exact n'est pas détaillé. Même note que le pacte proposé par Édouard Philippe.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 2, "precision": 1, "portee": "T", "statut": "N"}}, {"titre": "Mieux orienter l'épargne vers l'économie", "explication": "Diriger une partie de l'assurance-vie vers les entreprises françaises.", "pourquoi": "Non noté : ni mécanisme ni objectif.", "note": null}]}, "1": {"texte": "Vise 500 000 emplois industriels dans le cadre de 2 millions d'emplois (juillet 2025), et une politique industrielle européenne « sur le modèle de la politique agricole commune », avec un « bouclier industriel » face à la concurrence chinoise. En octobre 2026, il propose de « libérer et planifier » : une planification dans les secteurs stratégiques, en priorité l'IA et le quantique, puis les biotechnologies, l'énergie, le spatial et la défense, et le passage d'une « logique de subvention » à une « logique de contrat » par la commande publique.", "source": "https://www.maddyness.com/2026/10/28/presidentielle-2027-gabriel-attal-veut-investir-200-milliards-deuros-dans-lia-et-le-quantique/", "date": "28 octobre 2026 (et 21 juillet 2025)", "reponse": "Une politique industrielle européenne commune et 500 000 emplois industriels", "chiffres": ["500 000 emplois industriels visés"], "mesures": [{"titre": "Une politique industrielle européenne sur le modèle de la PAC", "explication": "Un budget et des règles communes à l'Europe pour soutenir l'industrie, comme pour l'agriculture.", "pourquoi": "Ni budget, ni calendrier. Un nouveau budget européen de cette taille demande l'unanimité des 27 pays.", "note": {"v2": 1, "technique": 3, "droit": 0, "financement": 0, "precision": 0, "portee": "T", "statut": "N"}}], "citation": {"texte": "Je propose une méthode : libérer et planifier", "date": "28 octobre 2026"}}, "2": {"texte": "Veut revoir à la baisse les impôts de production, sans chiffre, et créer une agence unique « France Entreprise » pour les démarches (2025). En 2026, il propose de réduire d'un quart la « charge administrative des entreprises », une loi de stabilité fiscale et normative, de revenir sur les hausses du coût du travail depuis 2024 et de rétablir les aides à l'apprentissage.", "source": "https://www.presse-citron.net/gabriel-attal-salaire-median/", "date": "21 juillet 2025, 27 août, 28 octobre et 19 novembre 2026", "reponse": "Baisser les impôts de production et créer un guichet unique", "mesures": [{"titre": "Une agence unique « France Entreprise »", "explication": "Un seul interlocuteur pour toutes les démarches administratives des entreprises.", "pourquoi": "Réorganisation administrative possible par la loi ou le décret ; coût non indiqué.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 0, "precision": 1, "portee": "S", "statut": "N"}}, {"titre": "Baisser les impôts de production", "explication": "Réduire les impôts que paient les entreprises quels que soient leurs bénéfices.", "pourquoi": "Ni montant ni calendrier : trop vague pour être notée.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 0, "precision": 0, "portee": "S", "statut": "N"}}]}, "3": {"texte": "Veut un « bouclier industriel » européen face à la « concurrence chinoise ». Pas de position explicite sur les accords de libre-échange.", "source": "https://www.presse-citron.net/gabriel-attal-salaire-median/", "date": "21 juillet 2025", "reponse": "Un « bouclier industriel » européen face à la Chine", "mesures": [{"titre": "Un « bouclier industriel » européen", "explication": "Des protections européennes contre les produits chinois vendus à bas prix.", "pourquoi": "Ni instrument ni secteur précisés : trop vague pour être notée.", "note": {"v2": 1, "technique": 3, "droit": 1, "financement": 2, "precision": 0, "portee": "S", "statut": "N"}}]}, "4": {"texte": "Pas de mesure spécifique en dehors du « bouclier industriel » européen (voir Commerce).", "source": "https://www.presse-citron.net/gabriel-attal-salaire-median/", "date": "21 juillet 2025", "reponse": "Pas de réponse connue"}, "5": {"texte": "Pas de position connue pour 2027 sur les nationalisations ou privatisations.", "source": "", "date": "", "reponse": "Pas de réponse connue"}, "6": {"texte": "Veut un « meilleur fléchage de l'épargne privée », dont 2 000 Md€ d'assurance-vie, vers l'économie. Pas de mesure sur la régulation des banques.", "source": "https://www.presse-citron.net/gabriel-attal-salaire-median/", "date": "21 juillet 2025", "reponse": "Mieux orienter l'épargne, sans mesure précise"}, "7": {"texte": "Veut un « capitalisme de l'innovation » planifié « dans les secteurs stratégiques », avec 200 Md€ pour l'IA et le quantique d'ici 2040, moitié publics, moitié privés (voir Numérique et IA). En 2025, il proposait 100 « territoires d'innovation » à la fiscalité et aux procédures simplifiées.", "source": "https://www.maddyness.com/2026/10/28/presidentielle-2027-gabriel-attal-veut-investir-200-milliards-deuros-dans-lia-et-le-quantique/", "date": "28 octobre 2026 (et 21 juillet 2025)", "reponse": "Planifier l'innovation et créer 100 « territoires d'innovation »", "mesures": [{"titre": "100 « territoires d'innovation » à la fiscalité simplifiée", "explication": "Des zones où les entreprises innovantes paieraient moins d'impôts et auraient moins de démarches.", "pourquoi": "Des zones franches existent déjà. Les avantages fiscaux ciblés doivent respecter les règles européennes sur les aides d'État. Coût non indiqué.", "note": {"v2": 1, "technique": 3, "droit": 2, "financement": 0, "precision": 1, "portee": "S", "statut": "N"}}]}, "8": {"texte": "Veut faire de la France le champion européen de l'intelligence artificielle (promesse de son meeting du 30 mai 2026). Il propose 200 Md€ pour l'IA et le quantique d'ici 2040, apportés à parts égales par l'État et le privé, dans une « logique de contrat » avec les entreprises, et la formation de dix millions de salariés au numérique en trois ans.", "source": "https://www.maddyness.com/2026/10/28/presidentielle-2027-gabriel-attal-veut-investir-200-milliards-deuros-dans-lia-et-le-quantique/", "date": "28 octobre 2026 (et 15 septembre 2026)", "reponse": "200 Md€ pour l'IA et le quantique d'ici 2040, moitié publics", "chiffres": ["200 Md€ pour l'IA et le quantique d'ici 2040, dont la moitié publique", "10 millions de salariés formés au numérique en trois ans"], "mesures": [{"titre": "200 Md€ pour l'IA et le quantique d'ici 2040, moitié publics", "explication": "L'État et les entreprises investiraient chacun 100 Md€ d'ici 2040.", "pourquoi": "Environ 7 Md€ publics par an, nettement plus que France 2030 (54 Md€ sur dix ans). Montant et durée précisés, mais pas le financement de la part publique. Plus de 1 Md€ par an non financé : note plafonnée à 6.", "note": {"v2": 1, "technique": 2, "droit": 3, "financement": 1, "precision": 2, "portee": "T", "statut": "N", "gc": 1}}, {"titre": "Former dix millions de salariés au numérique en trois ans", "explication": "Plus de trois millions de formations par an aux outils numériques et à l'IA.", "pourquoi": "Objectif et délai précis, sans coût ni financement.", "note": {"v2": 1, "technique": 2, "droit": 3, "financement": 0, "precision": 2, "portee": "S", "statut": "N"}}], "citation": {"texte": "Je trouve qu'on ne parle pas suffisamment d'innovation, d'intelligence artificielle dans ce débat", "date": "30 août 2026"}}, "9": {"texte": "Veut faire baisser « durablement » le prix de l'énergie à 50 €/MWh. Sa TVA sociale augmenterait la TVA (voir Croissance).", "source": "https://www.presse-citron.net/gabriel-attal-salaire-median/", "date": "21 juillet 2025", "reponse": "Pas de mesure sur les prix de détail ; énergie à 50 €/MWh visée"}}}, "dupont-aignan": {"economie": {"0": {"texte": "Promet un « programme d'assainissement des finances » et des « efforts productifs ». Il vise 2 % de croissance par an en relançant la production en France (voir Industrie). Selon lui, l'argent public est « mal dépensé » (aide à l'Ukraine, fraude à la carte Vitale, éoliennes). Il veut sortir de l'Union européenne pour mener sa propre politique économique.", "source": "https://www.sudradio.fr/linvite-politique/nicolas-dupont-aignan-la-position-du-rn-est-incomprehensible", "date": "20 septembre et 12 novembre 2026", "reponse": "Assainir les finances et retrouver une politique économique hors de l'UE", "chiffres": ["2 % de croissance par an visés"], "citation": {"texte": "Donc il y a de l'argent, il est mal dépensé", "date": "20 septembre 2026"}}, "1": {"texte": "Le premier axe de son projet économique est « Produire en France », pour relocaliser et créer 2 millions d'emplois. Il veut « oser un protectionnisme intelligent » (voir Commerce) et « remettre en place un État stratège », avec un objectif de 2 % de croissance par an.", "source": "https://www.debout-la-france.fr/actualite/nicolas-dupont-aignan-au-salon-du-made-in-france-2026/", "date": "12 novembre 2026", "reponse": "« Produire en France » grâce à un État stratège et un protectionnisme intelligent", "chiffres": ["2 millions d'emplois visés", "2 % de croissance par an"]}, "2": {"texte": "Veut « diviser par 2 l'ensemble des normes administratives qui entravent la bonne marche des entreprises », « zéro taxe et zéro norme supplémentaire pour les TPE/PME », baisser les impôts de production (sans montant) et un crédit d'impôt pour les entreprises qui réinvestissent leurs bénéfices en France. Il propose une « participation gaullienne » : 1 point d'impôt sur les sociétés en moins pour 5 % d'actionnariat salarié en plus, dans la limite de 10 points, pour 1 Md€.", "source": "https://www.dupontaignan.fr/wp-content/uploads/2026/11/Economie-2026_11-12_Livret.pdf", "date": "12 novembre 2026", "reponse": "Diviser les normes par deux et récompenser l'actionnariat salarié", "mesures": [{"titre": "Moins d'impôt sur les sociétés pour plus d'actionnariat salarié", "explication": "Une entreprise paierait 1 point d'impôt sur les sociétés en moins pour chaque tranche de 5 % de son capital détenue en plus par ses salariés, jusqu'à 10 points.", "pourquoi": "Une loi de finances suffit. Mécanisme et coût (1 Md€) précisés ; financé dans son plan d'économies global, sans lien direct.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 1, "precision": 2, "portee": "S", "statut": "N"}}, {"titre": "Diviser par deux les normes administratives des entreprises", "explication": "Supprimer la moitié des règles qui pèsent sur les entreprises.", "pourquoi": "Normes visées non définies : trop vague pour être notée.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 2, "precision": 0, "portee": "S", "statut": "N"}}, {"titre": "Un crédit d'impôt pour les bénéfices réinvestis en France", "explication": "Les entreprises qui réinvestissent leurs bénéfices sur le sol français paieraient moins d'impôts.", "pourquoi": "Une loi de finances suffit ; ni taux ni coût.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 0, "precision": 1, "portee": "S", "statut": "N"}}], "citation": {"texte": "zéro taxe et zéro norme supplémentaire pour les TPE/PME", "date": "12 novembre 2026"}}, "3": {"texte": "Veut « déployer un protectionnisme intelligent et renégocier tous les accords de libre-échange à l'occasion de la sortie de l'UE », avec des « droits de douane compensateurs » et une taxe antidumping. Son « Buy French Act » réserverait la commande publique aux entreprises qui produisent en France, si leur prix ne dépasse pas de plus de 50 % celui du produit étranger. Il veut aussi un étiquetage obligatoire du pays d'origine.", "source": "https://www.dupontaignan.fr/wp-content/uploads/2026/11/Economie-2026_11-12_Livret.pdf", "date": "12 novembre 2026", "reponse": "Un « protectionnisme intelligent » et la commande publique réservée au « fabriqué en France »", "mesures": [{"titre": "Un « Buy French Act » pour la commande publique", "explication": "Les administrations achèteraient aux entreprises qui produisent en France, tant que leur prix ne dépasse pas de 50 % celui du produit étranger.", "pourquoi": "Contraire aux règles européennes des marchés publics en l'état ; possible seulement après une sortie de l'Union (évaluée dans le thème International), et sous réserve des engagements à l'OMC. Seuil précis ; surcoût pour les acheteurs publics non chiffré.", "note": {"v2": 1, "technique": 3, "droit": 0, "financement": 1, "precision": 2, "portee": "T", "statut": "N"}}, {"titre": "Sortir de l'Union européenne pour décider seul des droits de douane", "explication": "La France fixerait ses propres droits de douane et accords commerciaux.", "pourquoi": "Non noté ici : la sortie de l'Union sera évaluée dans le thème International.", "note": null}], "citation": {"texte": "un protectionnisme intelligent", "date": "20 septembre 2026"}}, "4": {"texte": "Veut « élargir le décret « Montebourg » à tous les secteurs », c'est-à-dire soumettre tout rachat d'entreprise française par un étranger à l'accord de l'État, et utiliser des « actions préférentielles » contre les prises de contrôle. Il veut « rebâtir un État stratège en réhabilitant un vrai commissariat au Plan » pour créer des filières (robotique, quantique, IA). Il veut aussi sortir de l'Union européenne.", "source": "https://www.dupontaignan.fr/wp-content/uploads/2026/11/Economie-2026_11-12_Livret.pdf", "date": "12 novembre 2026", "reponse": "Contrôler tous les rachats étrangers et sortir de l'Union européenne", "chiffres": ["1 600 entreprises françaises rachetées par des Américains depuis 2014 (son chiffre)"], "mesures": [{"titre": "Étendre le contrôle des rachats étrangers à tous les secteurs", "explication": "Tout rachat d'une entreprise française par un investisseur étranger devrait être autorisé par l'État.", "pourquoi": "Le contrôle existe pour les secteurs sensibles. En l'état, le droit européen ne l'autorise que pour des motifs de sécurité ou d'ordre public ; l'étendre à tous les secteurs suppose une sortie de l'Union. Sans coût.", "note": {"v2": 1, "technique": 3, "droit": 1, "financement": 2, "precision": 1, "portee": "S", "statut": "N"}}], "citation": {"texte": "Je veux qu'on rende sa liberté à la France", "date": "20 septembre 2026"}}, "5": {"texte": "Veut rétablir le « monopole de production et de distribution d'EDF », créer « un monopole public de distribution » du gaz et garder les barrages hydroélectriques « dans le giron d'EDF ». Dans le thème Écologie, il propose aussi de renationaliser les autoroutes sans indemnité. Pas de privatisation.", "source": "https://www.dupontaignan.fr/wp-content/uploads/2026/11/Economie-2026_11-12_Livret.pdf", "date": "12 novembre 2026", "reponse": "Rétablir le monopole d'EDF et un monopole public du gaz", "mesures": [{"titre": "Rétablir le monopole d'EDF sur la production et la distribution d'électricité", "explication": "EDF redeviendrait la seule entreprise à produire et à vendre de l'électricité en France.", "pourquoi": "Contraire aux directives européennes qui ouvrent le marché de l'électricité, en l'état. Il faudrait aussi indemniser ou racheter les concurrents d'EDF ; coût non chiffré.", "note": {"v2": 1, "technique": 3, "droit": 0, "financement": 0, "precision": 1, "portee": "S", "statut": "N"}}, {"titre": "Renationaliser les autoroutes sans indemnité", "explication": "Voir thème Écologie, où la mesure est évaluée.", "pourquoi": "Évaluée dans le thème Écologie.", "note": null}]}, "6": {"texte": "Veut « rapatrier le pouvoir monétaire, bancaire et financier en France » : l'État emprunterait directement à la Banque de France « à taux zéro », pour 10 Md€ d'intérêts économisés par an au bout de cinq ans. Il propose aussi un Livret A rémunéré au-dessus de l'inflation, une baisse des frais bancaires et un capital de 10 000 € pour chaque nouveau-né, placé jusqu'à la retraite dans un fonds public (environ 6 Md€ par an).", "source": "https://www.dupontaignan.fr/wp-content/uploads/2026/11/Economie-2026_11-12_Livret.pdf", "date": "12 novembre 2026", "reponse": "Emprunter à la Banque de France et un capital de 10 000 € à la naissance", "mesures": [{"titre": "Emprunter directement à la Banque de France à taux zéro", "explication": "L'État ne passerait plus par les marchés : la banque centrale lui prêterait sans intérêt.", "pourquoi": "Les traités européens (article 123) interdisent ce financement ; il faudrait sortir de la zone euro et de l'Union. Économie chiffrée, calendrier de cinq ans.", "note": {"v2": 1, "technique": 3, "droit": 0, "financement": 2, "precision": 1, "portee": "T", "statut": "N"}}, {"titre": "Un capital de 10 000 € pour chaque nouveau-né", "explication": "Une somme bloquée jusqu'à la retraite, placée dans un fonds public inspiré du fonds souverain norvégien.", "pourquoi": "Sera évalué avec les retraites (thème Social) : non noté ici.", "note": null}]}, "7": {"texte": "Veut porter l'effort de recherche à 3 % du PIB : « L'objectif sera de passer la barre des 3 % dès 2029 », contre « 2,2 % » aujourd'hui selon lui, et « faire de la France le paradis des chercheurs ». Il relancerait la recherche sur le nucléaire (neutrons rapides, projet Astrid).", "source": "https://www.dupontaignan.fr/wp-content/uploads/2026/11/Economie-2026_11-12_Livret.pdf", "date": "12 novembre 2026", "reponse": "Porter la recherche à 3 % du PIB dès 2029", "mesures": [{"titre": "Porter la recherche à 3 % du PIB dès 2029", "explication": "Dépenser beaucoup plus en recherche, publique et privée, en deux ans.", "pourquoi": "Il faudrait près de 25 Md€ de plus par an, en grande partie venus des entreprises : la France n'a jamais dépassé 2,3 %. Objectif et date précis, sans coût ni financement.", "note": {"v2": 1, "technique": 1, "droit": 3, "financement": 0, "precision": 2, "portee": "S", "statut": "N", "gc": 1}}], "citation": {"texte": "L'objectif sera de passer la barre des 3 % dès 2029", "date": "12 novembre 2026"}}, "8": {"texte": "Veut une « IA française » parmi les filières que créerait un commissariat au Plan, et « une taxe sur l'exploitation des données personnelles », qui rapporterait 5 Md€ par an au bout de cinq ans. Il critique le « contrôle numérique ».", "source": "https://www.dupontaignan.fr/wp-content/uploads/2026/11/Economie-2026_11-12_Livret.pdf", "date": "12 novembre 2026", "reponse": "Taxer l'exploitation des données personnelles et créer une filière d'IA française", "mesures": [{"titre": "Une taxe sur l'exploitation des données personnelles", "explication": "Les entreprises qui exploitent les données des Français paieraient une taxe.", "pourquoi": "Une taxe sur les services numériques existe déjà depuis 2019 ; une loi de finances suffit. Recette chiffrée (5 Md€ par an), mais ni taux ni assiette.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 2, "precision": 1, "portee": "S", "statut": "N"}}]}, "9": {"texte": "Veut « baisser de 40 centimes le prix des carburants » : suppression des certificats d'économies d'énergie (17 centimes), de la TVA payée sur les taxes (13 centimes, « 4 milliards d'euros de coût ») et plafonnement des marges des raffineurs (10 centimes). Il veut « diviser par 2 le prix de l'électricité dès la première année », en sortant du marché européen et avec un tarif réglementé de 10 centimes le kWh, baisser de 20 % le prix du gaz et mettre une « TVA à zéro sur une liste de 50 produits de première nécessité ». En septembre, il annonçait 50 centimes de baisse.", "source": "https://www.dupontaignan.fr/wp-content/uploads/2026/11/Economie-2026_11-12_Livret.pdf", "date": "12 novembre 2026", "reponse": "Baisser les carburants de 40 centimes et diviser par deux le prix de l'électricité", "chiffres": ["−40 centimes par litre : 17 (certificats), 13 (TVA sur les taxes), 10 (marges des raffineurs)", "Électricité à 10 centimes le kWh"], "mesures": [{"titre": "Baisser les carburants de 40 centimes par litre", "explication": "Supprimer les certificats d'économies d'énergie et la TVA payée sur les taxes, et plafonner les marges des raffineurs.", "pourquoi": "Les certificats peuvent être supprimés par la loi, si la France atteint autrement ses objectifs européens. La directive européenne impose de calculer la TVA en incluant les taxes : cette partie y est contraire en l'état. Le plafonnement des marges n'est possible par décret que six mois. Coût de 4 Md€ par an, non financé : note plafonnée à 6.", "note": {"v2": 1, "technique": 3, "droit": 1, "financement": 0, "precision": 2, "portee": "S", "statut": "N", "gc": 1}}, {"titre": "Diviser par deux le prix de l'électricité dès la première année", "explication": "Sortir du marché européen de l'électricité et fixer un tarif réglementé à 10 centimes le kWh.", "pourquoi": "Contraire aux règles européennes du marché de l'électricité en l'état. Une baisse de moitié en un an ferait perdre des milliards à EDF, sans compensation prévue.", "note": {"v2": 1, "technique": 1, "droit": 0, "financement": 0, "precision": 2, "portee": "S", "statut": "N", "gc": 1}}], "citation": {"texte": "Diviser par 2 le prix de l'électricité dès la première année", "date": "12 novembre 2026"}}}}, "glucksmann": {"economie": {"0": {"texte": "Mise sur l'investissement public : 200 Md€ engagés par l'ensemble des administrations « dès les premiers jours » du quinquennat, sans durée précisée, avec un « effet d'entraînement » espéré sur le privé. Une partie serait financée par une contribution exceptionnelle de 5 % sur les patrimoines de plus de 100 M€, pour une seule année (50 Md€ annoncés), une taxe européenne sur les superprofits pétroliers et gaziers et un grand emprunt écologique européen. Selon RFI, il veut faire de la transition écologique un levier de réindustrialisation et de création d'emplois.", "source": "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-raphael-glucksmann-met-200-milliards-sur-la-table-et-invite-le-senat-a-voter-en-faveur-dune-future-republique-ecologique", "date": "9 novembre 2026", "reponse": "200 Md€ d'investissement public, financés en partie par les très grandes fortunes", "chiffres": ["200 Md€ d'investissements publics, durée non précisée", "50 Md€ attendus d'une contribution de 5 % sur les patrimoines de plus de 100 M€, une seule année"], "mesures": [{"titre": "200 Md€ d'investissements publics", "explication": "L'État et les collectivités investiraient 200 Md€, surtout dans la transition écologique. La durée n'est pas précisée : sur cinq ans, cela ferait environ 40 Md€ par an (calcul du site).", "pourquoi": "Montant donné, durée non précisée. Seuls 50 Md€ ont une recette chiffrée ; le reste dépend d'une taxe et d'un emprunt européens qui demandent l'accord des autres pays. Plus de 1 Md€ par an non financé : note plafonnée à 6.", "note": {"v2": 1, "technique": 2, "droit": 3, "financement": 1, "precision": 1, "portee": "T", "statut": "N", "gc": 1}}, {"titre": "Une contribution exceptionnelle de 5 % sur les patrimoines de plus de 100 M€", "explication": "Un impôt d'une seule année sur les plus grandes fortunes, pour financer l'investissement climatique.", "pourquoi": "Recette annoncée de 50 Md€, sans estimation indépendante à ce taux. Une taxe de ce niveau présente un risque constitutionnel selon plusieurs juristes. Même note que dans le thème Écologie.", "note": {"v2": 1, "technique": 3, "droit": 2, "financement": 1, "precision": 1, "portee": "P", "statut": "N"}}]}, "1": {"texte": "Présente la transition écologique comme « un levier de réindustrialisation ». En 2024, son programme européen voulait refaire de l'Europe « un grand continent de producteurs » d'ici 2030, avec des filières européennes de panneaux solaires, d'éoliennes et de pièces détachées.", "source": "https://www.dakaractu.com/Presidentielle-en-France-Raphael-Glucksmann-presente-son-projet-de-revolution-ecologique_a278006.html", "date": "9 novembre 2026 (et programme européen de mai 2024)", "reponse": "Réindustrialiser par la transition écologique et la préférence européenne", "mesures": [{"titre": "Produire en Europe les équipements de la transition", "explication": "Fabriquer en Europe les panneaux solaires, les éoliennes et leurs pièces, aujourd'hui souvent importés.", "pourquoi": "Non noté : orientation de 2024, sans montant ni objectif.", "note": null}]}, "2": {"texte": "Veut baisser la CSG sur les salaires, en la finançant en partie par une taxation plus forte des plus grosses successions, et recentrer le pacte Dutreil (transmission d'entreprises) sur sa vocation première, sans toucher aux PME de moins de 60 M€ de chiffre d'affaires. Sur les normes : « Il y a de bonnes et de mauvaises normes », il veut garder celles qui protègent la santé, les salariés ou l'environnement. Il propose aussi de rétablir les aides à l'apprentissage.", "source": "https://business-times.fr/actualites/presidentielle-2027-debat-medef-entreprises/", "date": "27 août et 19 novembre 2026", "reponse": "Moins de CSG sur les salaires, sans toucher aux normes protectrices", "citation": {"texte": "Il y a de bonnes et de mauvaises normes", "date": "19 novembre 2026"}}, "3": {"texte": "Veut une loi « Acheter européen » qui réserverait les commandes publiques européennes (environ 2 000 Md€ selon Frenchweb) aux productions européennes : « Cela ne marchera qu'à l'échelle européenne ». En 2024, il voulait « rompre avec la religion du libre-échange » et assumer « un protectionnisme écologique aux frontières de l'Union ».", "source": "https://www.frenchweb.fr/presidentielle-2027-ce-que-les-candidats-ont-reellement-compris-de-la-puissance-technologique/463107", "date": "30 août 2026 (et programme européen de mai 2024)", "reponse": "Un protectionnisme écologique européen et des commandes publiques réservées", "mesures": [{"titre": "Une loi « Acheter européen » pour la commande publique", "explication": "Les administrations européennes achèteraient en priorité des produits fabriqués en Europe.", "pourquoi": "Suppose de changer les règles européennes des marchés publics (majorité qualifiée) et de tenir compte des engagements à l'OMC. Sans coût direct ; part réservée non précisée.", "note": {"v2": 1, "technique": 3, "droit": 1, "financement": 2, "precision": 1, "portee": "T", "statut": "N"}}], "citation": {"texte": "Cela ne marchera qu'à l'échelle européenne", "date": "30 août 2026"}}, "4": {"texte": "Veut que la France « produise à nouveau chez nous », pour ne pas être « dépendant en tout de la Chine », par exemple pour les panneaux solaires, et sortir de la dépendance au gaz et au pétrole. Il veut affronter « les géants de la tech américaine qui transforment la France en colonie numérique » et propose un grand emprunt européen. En 2024, il voulait un droit européen de préemption contre les rachats d'entreprises stratégiques.", "source": "https://lcp.fr/actualites/presidentielle-2027-s-il-gagne-raphael-glucksmann-engagera-les-100-jours-de-la", "date": "25 août 2026 (et 30 août 2026)", "reponse": "Produire à nouveau en France et en Europe pour moins dépendre de la Chine", "mesures": [{"titre": "Un droit européen de préemption contre les rachats d'entreprises stratégiques", "explication": "L'Europe pourrait racheter elle-même une entreprise stratégique menacée d'être achetée par un groupe étranger.", "pourquoi": "Non noté : proposition européenne de 2024, sans précision.", "note": null}], "citation": {"texte": "le courage d'affronter les géants de la tech américaine qui transforment la France en colonie numérique", "date": "30 août 2026"}}, "5": {"texte": "Pas de position connue pour 2027 sur les nationalisations ou privatisations.", "source": "", "date": "", "reponse": "Pas de réponse connue"}, "6": {"texte": "Propose de fusionner le livret A et le LDDS, avec un plafond doublé et un taux porté à 2,5 %. En 2024, il défendait l'union européenne des marchés de capitaux.", "source": "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-raphael-glucksmann-met-200-milliards-sur-la-table-et-invite-le-senat-a-voter-en-faveur-dune-future-republique-ecologique", "date": "9 novembre 2026", "reponse": "Un livret d'épargne unique mieux rémunéré, à 2,5 %", "mesures": [{"titre": "Fusionner livret A et LDDS, plafond doublé et taux à 2,5 %", "explication": "Un seul livret d'épargne populaire, avec un plafond plus haut et un meilleur taux.", "pourquoi": "Une loi et un arrêté suffisent. Plafond et taux précisés. Le surcoût de rémunération, qui pèse sur le financement du logement social, n'est pas chiffré.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 0, "precision": 2, "portee": "S", "statut": "N"}}]}, "7": {"texte": "Pas de mesure sur la recherche privée. Il appelle à un « sursaut européen massif » dans la recherche (voir Numérique et IA).", "source": "https://www.75secondes.fr/tech/plan-a-200-milliards-100-000-ingenieurs-la-surenchere-des-candidats-sur-lia", "date": "15 septembre 2026", "reponse": "Pas de réponse connue"}, "8": {"texte": "Veut « un projet Manhattan sur l'IA » à l'échelle européenne et « le courage d'affronter les géants de la tech américaine qui transforment la France en colonie numérique ». Les mesures concrètes restent à préciser.", "source": "https://www.frenchweb.fr/presidentielle-2027-ce-que-les-candidats-ont-reellement-compris-de-la-puissance-technologique/463107", "date": "30 août 2026", "reponse": "Un « projet Manhattan » européen sur l'IA face aux géants américains", "mesures": [{"titre": "Un « projet Manhattan » européen sur l'IA", "explication": "Un grand programme commun de recherche et de calcul pour l'IA.", "pourquoi": "Ni montant, ni pays partenaires, ni calendrier : trop vague pour être notée.", "note": {"v2": 1, "technique": 3, "droit": 1, "financement": 0, "precision": 0, "portee": "T", "statut": "N"}}], "citation": {"texte": "le courage d'affronter les géants de la tech américaine qui transforment la France en colonie numérique", "date": "30 août 2026"}}, "9": {"texte": "Propose un chèque énergie de 500 € pour 6 millions de familles, élargi à 200 € pour 10 millions de familles des classes moyennes, et un moratoire sur les hausses de taxes sur l'électricité.", "source": "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-raphael-glucksmann-met-200-milliards-sur-la-table-et-invite-le-senat-a-voter-en-faveur-dune-future-republique-ecologique", "date": "9 novembre 2026", "reponse": "Des aides ciblées et un gel des taxes sur l'électricité", "mesures": [{"titre": "Un moratoire sur les hausses de taxes sur l'électricité", "explication": "Ne plus augmenter les taxes sur l'électricité pendant le quinquennat.", "pourquoi": "Une loi de finances suffit ; ni durée ni coût précisés.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 0, "precision": 1, "portee": "S", "statut": "N"}}, {"titre": "Porter le chèque énergie à 500 € et l'étendre aux classes moyennes", "explication": "Le chèque énergie aide les ménages modestes à payer leurs factures ; il serait plus élevé et versé à plus de monde.", "pourquoi": "Voir thème Écologie : même mesure, même note.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 0, "precision": 1, "portee": "S", "statut": "N", "gc": 1}}]}}}, "le-pen": {"economie": {"0": {"texte": "Propose de réduire fortement la dépense publique, avec 140 Md€ d'économies nettes en 2032 par rapport à 2026 (142 Md€ selon d'autres comptes rendus), et de baisser les impôts de 30 Md€. Objectif : déficit sous 3 % en 2030, et règle d'or budgétaire inscrite dans la Constitution par référendum. Devant les chefs d'entreprise, elle promet aussi une ordonnance de simplification pour « lever les verrous normatifs qui freinent le développement économique ».", "source": "https://www.moneyvox.fr/impot/actualites/110673/140-milliards-economies-ce-quil-faut-retenir-de-intervention-de-marine-le-pen-a-assemblee-nationale", "date": "6 octobre 2026 (et 20 avril 2026)", "reponse": "Réduire la dépense publique et baisser les impôts pour relancer la croissance", "chiffres": ["Environ 140 Md€ d'économies nettes en 2032", "30 Md€ de baisses d'impôts", "Déficit sous 3 % en 2030"], "citation": {"texte": "Stop à la folie normative", "date": "28 août 2026"}}, "1": {"texte": "Propose un suramortissement fiscal pour l'achat de machines-outils, la robotisation et la numérisation, et d'orienter les 230 Md€ d'achats publics annuels vers les entreprises « présentes territorialement en France ».", "source": "https://www.frenchweb.fr/presidentielle-2027-ce-que-les-candidats-ont-reellement-compris-de-la-puissance-technologique/463107", "date": "30 août 2026", "reponse": "Aider l'investissement des usines et réserver davantage la commande publique", "mesures": [{"titre": "Un suramortissement pour les machines, les robots et le numérique", "explication": "Une entreprise qui achète une machine déduit de ses bénéfices plus que son prix : elle paie moins d'impôt.", "pourquoi": "Déjà fait en France entre 2015 et 2017 (« suramortissement Macron »). Une loi de finances suffit. Ni taux, ni durée, ni coût.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 0, "precision": 1, "portee": "S", "statut": "N"}}, {"titre": "Orienter la commande publique vers les entreprises installées en France", "explication": "Les 230 Md€ d'achats publics annuels iraient davantage à des entreprises présentes sur le territoire.", "pourquoi": "Voir Commerce : les règles européennes des marchés publics interdisent de favoriser une entreprise selon son implantation nationale.", "note": {"v2": 1, "technique": 3, "droit": 0, "financement": 2, "precision": 1, "portee": "S", "statut": "N"}}]}, "2": {"texte": "Annonce 30 Md€ de baisses d'impôts dans son contre-budget, sans préciser la part des entreprises, et un suramortissement pour l'investissement (voir Industrie). Elle veut supprimer par ordonnances les normes qui « étouffent l'activité des entreprises », limiter la sous-traitance à trois niveaux, tenir compte de la localisation dans les marchés publics, et verser des aides à l'apprentissage jusqu'à bac+3. Elle conditionnerait le pacte Dutreil (transmission d'entreprises) à dix ans d'activité en France.", "source": "https://bati.zepros.fr/actu-generale/sommet-construction-ffb-sept-candidats-presidentielle-face-batiment", "date": "6 octobre et 19 novembre 2026", "reponse": "Supprimer des normes par ordonnances et favoriser les entreprises implantées en France"}, "3": {"texte": "Veut orienter les 230 Md€ d'achats publics annuels vers les entreprises « présentes territorialement en France », sans critère de nationalité.", "source": "https://www.frenchweb.fr/presidentielle-2027-ce-que-les-candidats-ont-reellement-compris-de-la-puissance-technologique/463107", "date": "30 août 2026", "reponse": "Réserver davantage la commande publique aux entreprises installées en France", "mesures": [{"titre": "Orienter la commande publique vers les entreprises installées en France", "explication": "Les administrations françaises achèteraient en priorité à des entreprises qui produisent en France.", "pourquoi": "Les règles européennes des marchés publics interdisent de favoriser une entreprise selon son implantation nationale : il faudrait les changer, ou s'en affranchir, ce qui serait contraire aux traités en l'état.", "note": {"v2": 1, "technique": 3, "droit": 0, "financement": 2, "precision": 1, "portee": "T", "statut": "N"}}]}, "4": {"texte": "Veut que la BCE « doit intervenir » pour financer « notre souveraineté, à savoir la défense et le rattrapage technologique ».", "source": "https://www.moneyvox.fr/impot/actualites/110673/140-milliards-economies-ce-quil-faut-retenir-de-intervention-de-marine-le-pen-a-assemblee-nationale", "date": "6 octobre 2026", "reponse": "Faire financer par la BCE la défense et le rattrapage technologique", "mesures": [{"titre": "Mobiliser la BCE pour financer la défense et la technologie", "explication": "La banque centrale européenne fournirait des fonds pour ces investissements.", "pourquoi": "Les traités interdisent à la BCE de financer directement les États ; le mécanisme n'est pas précisé : trop vague pour être notée.", "note": {"v2": 1, "technique": 3, "droit": 0, "financement": 0, "precision": 0, "portee": "T", "statut": "N"}}]}, "5": {"texte": "Le comparateur de la Fondation iFRAP résume ainsi son projet : « Baisser la dotation à l'audiovisuel public, puis privatisation (sauf FranceInfo, Arte, OM…) ». Pas d'autre privatisation ni de nationalisation trouvée.", "source": "https://www.ifrap.org/comparateurs/presidentielles-2027", "date": "programme en ligne, consulté le 25 novembre 2026", "reponse": "Privatiser l'audiovisuel public, sauf quelques chaînes", "mesures": [{"titre": "Privatiser l'audiovisuel public, sauf FranceInfo, Arte et quelques autres", "explication": "Vendre à des entreprises privées les chaînes et radios publiques, après une baisse de leur budget.", "pourquoi": "Possible par la loi, comme la privatisation de TF1 en 1987. Réduit la dépense publique. Calendrier et liste exacte des chaînes non publiés.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 2, "precision": 1, "portee": "S", "statut": "N"}}]}, "6": {"texte": "Pas de mesure sur la régulation des banques. Elle veut que la BCE finance la défense et la technologie (voir Souveraineté). En octobre 2025, son contre-budget prévoyait un « impôt sur la fortune financière » et une hausse d'un tiers de la taxe sur les rachats d'actions.", "source": "https://www.moneyvox.fr/impot/actualites/110673/140-milliards-economies-ce-quil-faut-retenir-de-intervention-de-marine-le-pen-a-assemblee-nationale", "date": "6 octobre 2026 (et 23 octobre 2025)", "reponse": "Pas de régulation bancaire ; taxer davantage la fortune financière"}, "7": {"texte": "Pas de mesure sur la recherche privée. Le contre-budget prévoit une « rallonge » pour la recherche publique.", "source": "https://www.publicsenat.fr/actualites/politique/140-milliards-deuros-deconomies-dici-2032-leffort-radical-propose-par-marine-le-pen-pour-redresser-les-f", "date": "6 octobre 2026", "reponse": "Pas de réponse connue"}, "8": {"texte": "Pas de proposition sur l'IA. Elle propose un suramortissement pour la numérisation des entreprises (voir Industrie).", "source": "https://www.frenchweb.fr/presidentielle-2027-ce-que-les-candidats-ont-reellement-compris-de-la-puissance-technologique/463107", "date": "30 août 2026", "reponse": "Pas de réponse connue"}, "9": {"texte": "Le RN propose de baisser la TVA sur l'électricité et le gaz à 5,5 %. En octobre 2025, son contre-budget prévoyait aussi une TVA nulle sur « 100 produits de première nécessité ».", "source": "https://www.les-energies-renouvelables.eu/article/actualites/energies/baisse-de-la-tva-arret-du-photovoltaique-ce-que-le-programme-energie-du-rn-changerait-pour-les-menages-2302/", "date": "29 septembre 2026 (et 23 octobre 2025)", "reponse": "Baisser la TVA sur l'électricité et le gaz", "mesures": [{"titre": "TVA à 5,5 % sur l'électricité et le gaz", "explication": "Baisser d'environ un huitième la facture d'électricité et de gaz des ménages.", "pourquoi": "Voir thème Écologie : même mesure, même note.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 0, "precision": 1, "portee": "S", "statut": "N", "gc": 1}}]}}}, "lisnard": {"economie": {"0": {"texte": "Veut baisser massivement la dépense publique : 80 Md€ d'économies la première année, au moins 200 Md€ par an en fin de quinquennat. Sur 100 € économisés, 60 € iraient au salaire net, 20 € à la baisse des impôts de production et 20 € au désendettement. Il juge qu'« on est pollué par les normes » et veut des règles plus simples, contrôlées après coup.", "source": "https://lessentieldeleco.fr/9412-david-lisnard-un-programme-de-rupture-pour-la-droite/", "date": "15 novembre 2026 (et 27 octobre 2026)", "reponse": "Baisser massivement la dépense pour augmenter les salaires nets et baisser les impôts", "chiffres": ["80 Md€ d'économies la première année, 200 Md€ par an à terme", "Répartition : 60 % salaire net, 20 % impôts de production, 20 % dette"]}, "1": {"texte": "Refuse que l'État choisisse les secteurs à aider. Sa règle des « six F » consiste à libérer le foncier, les flux énergétiques, les formalités administratives, la formation, les fonds et la fiscalité. Il veut remplacer le « zéro artificialisation nette », qu'il juge inapplicable, par une incitation à la densité, une électricité abondante grâce au nucléaire, et baisser les impôts de production (voir Entreprises).", "source": "https://www.unenouvelleenergie.fr/questions/quel-candidat-veut-reindustrialiser-la-france/", "date": "29 août au 16 octobre 2026", "reponse": "Libérer le foncier, l'énergie et les normes plutôt que choisir des filières", "citation": {"texte": "Donc réindustrialiser, c'est libérer le foncier", "date": "29 août 2026"}}, "2": {"texte": "Veut baisser les impôts de production de 40 Md€ en rythme de croisière, financés par les économies, et supprimer la C3S (selon Cryptoast, 22 octobre 2026). Sur BFMTV, il promet « un moratoire sur les normes stupides ». Au débat du Medef : « Notre économie étouffe sous le poids des normes ».", "source": "https://cryptoast.fr/david-lisnard-programme-200-milliards-economies-salaires-nets/", "date": "22 octobre 2026 (et 28 août, 3 novembre 2026)", "reponse": "Baisser les impôts de production de 40 Md€ et geler les normes", "chiffres": ["40 Md€ de baisse des impôts de production à terme"], "mesures": [{"titre": "Baisser les impôts de production de 40 Md€", "explication": "Réduire les impôts payés par les entreprises indépendamment de leurs bénéfices, financés par des économies sur la dépense publique.", "pourquoi": "Montant et financement indiqués. Une baisse de cette ampleur a déjà été faite (CICE et pacte de responsabilité, environ 40 Md€). Une partie (CFE) finance les collectivités et devrait être compensée. Calendrier non précisé.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 2, "precision": 1, "portee": "S", "statut": "N"}}, {"titre": "Supprimer la C3S", "explication": "Supprimer une taxe sur le chiffre d'affaires des grandes entreprises.", "pourquoi": "Déjà réduite en 2015-2016 pour les petites entreprises ; une loi de finances suffit. Coût non indiqué séparément.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 1, "precision": 1, "portee": "S", "statut": "N"}}, {"titre": "Un moratoire sur les « normes stupides »", "explication": "Ne plus créer de nouvelles normes pour les entreprises pendant un temps.", "pourquoi": "Les normes visées ne sont pas définies : trop vague pour être notée.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 2, "precision": 0, "portee": "S", "statut": "N"}}], "citation": {"texte": "un moratoire sur les normes stupides", "date": "3 novembre 2026"}}, "3": {"texte": "Pas de position connue pour 2027 sur le libre-échange ou le protectionnisme.", "source": "", "date": "", "reponse": "Pas de réponse connue"}, "4": {"texte": "Ne veut pas que l'État choisisse les secteurs : il ne doit pas « désigner les secteurs dignes d'intérêt ». Pour lui, la souveraineté passe d'abord par l'énergie : « Pas de réindustrialisation et de souveraineté technologique sans énergie abondante et compétitive ».", "source": "https://www.unenouvelleenergie.fr/questions/quel-candidat-veut-reindustrialiser-la-france/", "date": "24 septembre 2026 (page mise à jour le 16 octobre 2026)", "reponse": "Pas de secteurs choisis par l'État ; la souveraineté passe par l'énergie", "citation": {"texte": "Pas de réindustrialisation et de souveraineté technologique sans énergie abondante et compétitive", "date": "24 septembre 2026"}}, "5": {"texte": "Pas de nationalisation ni de privatisation annoncée. Il veut « passer au crible » les 1 153 organismes publics et transférer aux collectivités l'essentiel des missions non régaliennes de l'État.", "source": "https://lessentieldeleco.fr/9412-david-lisnard-un-programme-de-rupture-pour-la-droite/", "date": "15 novembre 2026", "reponse": "Pas de réponse connue"}, "6": {"texte": "Pas de mesure sur les banques. Il propose une « dose » de capitalisation obligatoire pour les retraites (thème Social).", "source": "https://lessentieldeleco.fr/9412-david-lisnard-un-programme-de-rupture-pour-la-droite/", "date": "15 novembre 2026", "reponse": "Pas de réponse connue"}, "7": {"texte": "Pas de position connue pour 2027 sur l'innovation.", "source": "", "date": "", "reponse": "Pas de réponse connue"}, "8": {"texte": "Pas de position connue pour 2027 sur le numérique et l'IA.", "source": "", "date": "", "reponse": "Pas de réponse connue"}, "9": {"texte": "Pas de mesure sur les prix. Il promet une hausse des salaires nets de 200 € puis 400 € par mois, financée par les économies (thème Travail).", "source": "https://lessentieldeleco.fr/9412-david-lisnard-un-programme-de-rupture-pour-la-droite/", "date": "15 novembre 2026", "reponse": "Pas de réponse connue"}}}, "melenchon": {"economie": {"0": {"texte": "Propose une « économie au service des besoins » : une « production planifiée » et une économie de coopération qui « se substitue à l'économie libérale ». La planification écologique est le « point de départ » du programme. Le chiffrage complet est annoncé pour début 2027.", "source": "https://melenchon2027.fr/programme/livre/une-economie-au-service-des-besoins/chapitre1/", "date": "programme mis à jour le 7 novembre 2026", "reponse": "Une économie planifiée, tournée vers les besoins et l'écologie", "citation": {"texte": "Face à la prédation de la finance et à la dictature des actionnaires, une autre économie est possible.", "date": "7 novembre 2026"}}, "1": {"texte": "Veut planifier la relocalisation des productions essentielles, avec un conseil à la planification écologique et des plans d'investissement par filière annoncés pour début 2027. Il propose une filière nationale de composants électroniques, avec « une fonderie de microprocesseurs sur le territoire français ».", "source": "https://next.ink/267269/presidentielle-2027-lfi-detaille-son-programme-pour-democratiser-la-revolution-numerique/", "date": "13 novembre 2026", "reponse": "Planifier la relocalisation par filières, dont une usine de microprocesseurs", "mesures": [{"titre": "Une fonderie de microprocesseurs en France", "explication": "Une usine qui fabrique des puces électroniques, aujourd'hui surtout produites en Asie.", "pourquoi": "La France a déjà des usines de puces (Crolles, près de Grenoble), mais pas de fonderie de pointe. L'aide publique doit être autorisée au titre du règlement européen sur les semi-conducteurs. Ni montant ni calendrier, pour un investissement de plusieurs milliards.", "note": {"v2": 1, "technique": 2, "droit": 2, "financement": 0, "precision": 1, "portee": "S", "statut": "N", "gc": 1}}], "citation": {"texte": "Pour réindustrialiser, il faut dire ce que l'on veut faire dans notre pays.", "date": "30 août 2026"}}, "2": {"texte": "Veut conditionner les aides : « pas d'arrosage d'aides publiques sans contreparties écologiques et sociales ». Il donnerait la priorité à l'économie sociale et solidaire (coopératives, Scop) pour la petite enfance, les personnes âgées et la restauration collective.", "source": "https://lcp.fr/actualites/presidentielle-2027-ce-qui-change-dans-le-nouveau-programme-de-jean-luc-melenchon-444841", "date": "6 novembre 2026", "reponse": "Conditionner les aides publiques à des contreparties écologiques et sociales", "mesures": [{"titre": "Conditionner les aides publiques aux entreprises", "explication": "Une entreprise aidée devrait respecter des engagements écologiques et sociaux, sinon elle rembourserait.", "pourquoi": "Possible par la loi, sans coût. Les critères ne sont pas détaillés.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 2, "precision": 1, "portee": "S", "statut": "N"}}, {"titre": "Priorité à l'économie sociale et solidaire pour certaines activités", "explication": "Les coopératives et associations passeraient avant les entreprises privées pour la petite enfance, l'aide aux personnes âgées et la restauration collective.", "pourquoi": "Les règles européennes permettent de réserver certains marchés à ces structures, mais dans des cas limités.", "note": {"v2": 1, "technique": 3, "droit": 2, "financement": 2, "precision": 1, "portee": "S", "statut": "N"}}], "citation": {"texte": "pas d'arrosage d'aides publiques sans contreparties écologiques et sociales", "date": "6 novembre 2026"}}, "3": {"texte": "Veut faire voter par le Parlement un moratoire sur « les accords de libre-échange » et sur la libre circulation sans limite des marchandises et des capitaux, en assumant une « désobéissance » aux règles européennes.", "source": "https://lcp.fr/actualites/presidentielle-2027-ce-qui-change-dans-le-nouveau-programme-de-jean-luc-melenchon-444841", "date": "6 novembre 2026", "reponse": "Suspendre les accords de libre-échange, au besoin en désobéissant à l'Union", "mesures": [{"titre": "Un moratoire national sur les accords de libre-échange", "explication": "La France cesserait d'appliquer les accords commerciaux signés par l'Union.", "pourquoi": "Le commerce relève de l'Union seule : un moratoire national serait contraire aux traités, ce que le programme assume. Sans coût direct ; accords visés non listés.", "note": {"v2": 1, "technique": 3, "droit": 0, "financement": 2, "precision": 1, "portee": "T", "statut": "N"}}]}, "4": {"texte": "Veut « constituer des pôles publics dans les secteurs stratégiques » (médicament, transports, banque et assurance, énergie, armement, mines, satellites) et rendre effectif le droit de réquisition des entreprises d'intérêt général. Selon Next, les infrastructures du numérique passeraient sous contrôle public.", "source": "https://melenchon2027.fr/programme/livre/une-economie-au-service-des-besoins/chapitre1/", "date": "programme mis à jour le 7 novembre 2026", "reponse": "Des pôles publics dans les secteurs stratégiques", "mesures": [{"titre": "Créer des pôles publics dans sept secteurs stratégiques", "explication": "L'État prendrait le contrôle d'entreprises du médicament, des transports, de la banque, de l'énergie, de l'armement, des mines et des satellites.", "pourquoi": "Possible par la loi, mais la Constitution impose d'indemniser les actionnaires. Ni liste d'entreprises, ni coût, ni calendrier, pour des montants de plusieurs dizaines de milliards.", "note": {"v2": 1, "technique": 3, "droit": 2, "financement": 0, "precision": 1, "portee": "T", "statut": "N", "gc": 1}}]}, "5": {"texte": "Veut « revenir sur les privatisations (aéroports, autoroutes, Française des jeux, etc.) », instaurer un moratoire sur les partenariats public-privé et « collectiviser » l'eau. Il nationaliserait toute entreprise du numérique au savoir-faire essentiel menacée de faillite, de délocalisation ou de rachat par des « fonds prédateurs ».", "source": "https://melenchon2027.fr/programme/livre/une-economie-au-service-des-besoins/chapitre1/", "date": "programme mis à jour le 7 novembre 2026", "reponse": "Revenir sur les privatisations : autoroutes, aéroports, Française des jeux", "mesures": [{"titre": "Renationaliser autoroutes, aéroports et Française des jeux", "explication": "L'État reprendrait ces entreprises ou concessions privatisées depuis 2006.", "pourquoi": "Possible par la loi, avec indemnisation des actionnaires et des concessionnaires avant la fin des contrats. Ni coût ni calendrier.", "note": {"v2": 1, "technique": 3, "droit": 2, "financement": 0, "precision": 1, "portee": "S", "statut": "N", "gc": 1}}, {"titre": "Nationaliser les entreprises du numérique stratégiques menacées", "explication": "Reprendre une entreprise au savoir-faire essentiel en cas de faillite, de délocalisation ou de rachat hostile.", "pourquoi": "Déjà fait ponctuellement (chantiers STX en 2017). Au cas par cas : non noté.", "note": null}]}, "6": {"texte": "Veut « geler » la part de la dette française détenue par la BCE, et modifier le traité et le statut de la BCE pour qu'elle puisse acheter de la dette publique directement, sans passer par les banques privées. Il propose aussi un pôle public bancaire et d'assurance.", "source": "https://lcp.fr/actualites/presidentielle-2027-ce-qui-change-dans-le-nouveau-programme-de-jean-luc-melenchon-444841", "date": "6 novembre 2026", "reponse": "Changer le rôle de la BCE et créer un pôle public bancaire", "mesures": [{"titre": "Permettre à la BCE d'acheter directement la dette des États", "explication": "La banque centrale prêterait aux États sans passer par les marchés.", "pourquoi": "Il faut réviser les traités européens à l'unanimité des 27 États. Sans coût budgétaire direct ; calendrier non précisé.", "note": {"v2": 1, "technique": 3, "droit": 0, "financement": 2, "precision": 1, "portee": "T", "statut": "N"}}]}, "7": {"texte": "Veut faire de la France une « puissance quantique mondiale », en investissant dans la recherche fondamentale et l'industrie, et en conditionnant les aides aux start-up du quantique à des garanties de souveraineté.", "source": "https://next.ink/267269/presidentielle-2027-lfi-detaille-son-programme-pour-democratiser-la-revolution-numerique/", "date": "13 novembre 2026", "reponse": "Investir dans le quantique, avec des aides conditionnées à la souveraineté", "mesures": [{"titre": "Faire de la France une « puissance quantique mondiale »", "explication": "Financer la recherche et les entreprises des ordinateurs quantiques.", "pourquoi": "Ni montant ni calendrier : trop vague pour être notée.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 0, "precision": 0, "portee": "S", "statut": "N"}}]}, "8": {"texte": "Propose une « mission nationale de maîtrise de l'intelligence artificielle », des IA qui assistent les travailleurs plutôt que de les surveiller ou les remplacer, l'interdiction des IA qui simulent une relation affective, et le contrôle public des infrastructures numériques. Il veut achever la fibre, garantir un accès minimal gratuit à Internet et généraliser le logiciel libre dans l'administration.", "source": "https://next.ink/267269/presidentielle-2027-lfi-detaille-son-programme-pour-democratiser-la-revolution-numerique/", "date": "13 novembre 2
