<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Les mêmes questions à chaque candidat à la présidentielle 2027 : réponses courtes, chiffres, mesures expliquées, sources et faisabilité.">
<meta property="og:title" content="Comparateur Présidentielle 2027">
<meta property="og:description" content="Les mêmes questions à chaque candidat : réponses, mesures, sources et faisabilité.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://llilian7.github.io/presidentielle-2027/">
<meta property="og:image" content="https://llilian7.github.io/presidentielle-2027/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#264a6e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%23264a6e%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-size=%2211%22 font-family=%22sans-serif%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3E2027%3C/text%3E%3C/svg%3E">
<title>Comparateur Présidentielle 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout : application. Barre du haut, menu latéral (thèmes ou candidats), zone principale en grille de cartes
   qui remplit la largeur ; le détail d'une réponse s'ouvre dans un panneau latéral. Aucune couleur partisane. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e4e8ed; --ink:#15202b; --muted:#566271; --line:#d5dbe2;
  --accent:#264a6e; --accent-ink:#ffffff; --accent-soft:#dde7f1; --mark:#f6e39a; --mark-ink:#3d3100; --meter:#264a6e; --todo:#69737f;
  --scrim:rgba(15,22,30,.42); --shadow:0 1px 2px rgba(15,22,30,.06),0 4px 14px rgba(15,22,30,.06);
  --display:"Archivo", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:12px; --r-sm:8px; --gut:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#18202a; --sunk:#222c37; --ink:#e7ecf1; --muted:#9ba7b5; --line:#2b3643;
  --accent:#a9c3e0; --accent-ink:#0f141a; --accent-soft:#233243; --mark:#4a3f12; --mark-ink:#f6e39a; --meter:#a9c3e0; --todo:#8d98a5;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#18202a; --sunk:#222c37; --ink:#e7ecf1; --muted:#9ba7b5; --line:#2b3643;
  --accent:#a9c3e0; --accent-ink:#0f141a; --accent-soft:#233243; --mark:#4a3f12; --mark-ink:#f6e39a; --meter:#a9c3e0; --todo:#8d98a5;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
@media (min-width:900px){:root{--gut:max(28px,env(safe-area-inset-left,0px)); --gut-r:max(28px,env(safe-area-inset-right,0px))}}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(1.6rem,2.6vw,2.1rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
h4{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
p{margin:0}
a{color:inherit;text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.btn{font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 13px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--sunk);border-radius:999px;flex-wrap:wrap}
.seg .btn{border:0;background:transparent;min-height:32px}
.seg .btn[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.88rem}

/* Barre du haut */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1560px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r);min-height:60px;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:1.02rem;margin-right:auto}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.72rem;letter-spacing:.02em}
.brand small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:.84rem}
.tabs{display:flex;gap:4px}
.tabs a{padding:6px 12px;border-radius:999px;text-decoration:none;font-size:.9rem;color:var(--muted)}
.tabs a:hover{color:var(--ink);background:var(--sunk)}
.tabs a[aria-current="page"]{color:var(--ink);background:var(--accent-soft);font-weight:700}
.countdown{font-size:.84rem;color:var(--muted);white-space:nowrap}
.countdown b{color:var(--ink);font-variant-numeric:tabular-nums}
.countdown .cd-s{display:none}

/* Structure */
.shell{max-width:1560px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r);padding-block:24px 0;display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;align-items:start}
.shell.full{grid-template-columns:minmax(0,1fr)}
.main{display:grid;gap:28px;min-width:0}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);max-height:calc(100vh - 100px);overflow:auto;display:grid;gap:4px;padding-bottom:16px;font-size:.92rem}
.side-h{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;padding:0 10px 6px}
.side ul{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.side a{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:var(--r-sm);text-decoration:none;color:var(--muted)}
.side a:hover{background:var(--sunk);color:var(--ink)}
.side a[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.side a .n{font-variant-numeric:tabular-nums;font-size:.8rem;font-weight:400}
.side a .n.has{color:var(--ink);background:var(--mark);color:var(--mark-ink);padding:0 6px;border-radius:999px}
.side .sub{padding:2px 0 8px 12px;margin-left:10px;border-left:2px solid var(--line)}
.side .sub a{font-size:.86rem;padding:5px 10px}
.mnav{display:none;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{font-size:.86rem;padding:5px 13px;min-height:40px;display:inline-flex;align-items:center;border-radius:999px;border:1px solid var(--line);text-decoration:none;background:var(--surface);white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (max-width:1000px){.shell{grid-template-columns:minmax(0,1fr);gap:16px}.side{display:none}.mnav{display:flex}}

.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px 24px}
.phead>div{display:grid;gap:6px;min-width:0}
.phead p{max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}

/* Cartes réponse */
.qsec{display:grid;gap:14px;scroll-margin-top:90px}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:start;gap:10px 20px}
.qhead>div{display:grid;gap:4px;max-width:80ch;min-width:0}
.qhead h2{font-size:1.3rem}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{display:grid;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:var(--shadow);scroll-margin-top:84px}
.card:hover{border-color:var(--ink)}
.card-btn{all:unset;box-sizing:border-box;display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:14px 16px;cursor:pointer;height:100%;min-width:0;border-radius:var(--r)}
.card-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.card.none{display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:14px 16px;box-shadow:none;background:transparent;border-style:dashed}
.card.none:hover{border-color:var(--line)}
.lbl-close{display:none}
.card{position:relative}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.sel .card-btn{background:var(--accent-soft)}
.card.sel::after{content:"";position:absolute;left:50%;bottom:-13px;width:14px;height:14px;background:var(--surface);border-left:1px solid var(--accent);border-top:1px solid var(--accent);transform:translateX(-50%) rotate(45deg);z-index:2}
.card.sel .lbl-open{display:none}
.card.sel .lbl-close{display:inline}
.detail{grid-column:1 / -1;background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:18px 22px 18px;display:grid;gap:18px;box-shadow:var(--shadow);scroll-margin-top:84px}
.detail-head{display:flex;justify-content:space-between;align-items:start;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.detail-head .who b{font-family:var(--display);font-size:1.1rem}
.detail-head .who small{font-size:.92rem}
.detail .cols:not(.solo){grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.icon{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.2rem;line-height:1;flex:none}
.icon:hover{border-color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.detail{animation:fadein .16s ease-out}@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}}
.card-end{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line);font-size:.9rem}
.card-end a{color:var(--muted)}
@media (max-width:820px){.detail .cols:not(.solo){grid-template-columns:1fr}.detail{padding:14px}}
.card-top{display:flex;gap:10px;align-items:center;min-width:0}
.mono{width:38px;height:38px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.78rem;flex:none}
.who{display:grid;line-height:1.25;min-width:0}
.who b{font-weight:700}
.who small{color:var(--muted);font-size:.8rem}
.card .rep{font-weight:700;line-height:1.4}
.card .rep.unk{font-weight:400;color:var(--muted)}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--line);font-size:.84rem}
.card-foot .go{color:var(--muted)}
.card:hover .go{color:var(--ink)}

.score{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.86rem}
.score .meter{width:44px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.score .meter i{display:block;height:100%;background:var(--meter)}
.score b{font-family:var(--display);font-weight:800;font-size:.98rem}
.score small{color:var(--muted)}
.score.none{color:var(--todo);font-size:.82rem}

details.rep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font-size:.92rem}
details.rep>summary{cursor:pointer;padding:9px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.rep>summary::-webkit-details-marker{display:none}
details.rep>summary::after{content:"+";font-family:var(--display)}
details.rep[open]>summary::after{content:"−"}
.rep-body{padding:0 14px 14px;display:grid;gap:10px;max-width:90ch}
.rep-body ul{margin:0;padding-left:18px;display:grid;gap:6px}

/* Contenu détaillé d'une réponse */
.ab{display:grid;gap:18px}
.cols{display:grid;gap:18px 24px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));align-items:start}
.cols.solo{grid-template-columns:1fr}
.part{display:grid;gap:8px;min-width:0}
ul.figs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.figs li{padding:7px 11px;background:var(--mark);color:var(--mark-ink);border-radius:var(--r-sm);font-variant-numeric:tabular-nums;line-height:1.4;font-size:.93rem}
ul.mes{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:m}
ul.mes li{display:grid;gap:2px;padding-left:30px;position:relative;counter-increment:m}
ul.mes li::before{content:counter(m);position:absolute;left:0;top:1px;width:21px;height:21px;border-radius:50%;background:var(--accent-soft);font:700 .72rem/21px var(--display);text-align:center}
ul.mes strong{font-weight:700;line-height:1.35}
ul.mes .mtop{display:flex;justify-content:space-between;gap:4px 12px;align-items:baseline;flex-wrap:wrap}
details.mwhy{font-size:.86rem}
.verdict{display:grid;gap:10px;padding:14px 16px;background:var(--sunk);border-radius:var(--r-sm)}
.vtop{display:flex;align-items:center;gap:12px}
.vlab{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted)}
.verdict .score b{font-size:1.25rem}
.verdict>p{max-width:75ch}
.vcalc{font-size:.84rem;color:var(--muted)}
ul.crit{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
ul.crit li{display:inline-flex;gap:6px;align-items:baseline;font-size:.82rem;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
ul.crit li span{color:var(--muted)}
ul.crit li b{font-variant-numeric:tabular-nums}
.cap{font-size:.84rem;font-weight:700}
details.mwhy[open] ul.crit li{background:var(--surface)}
.mnn{font-size:.84rem;color:var(--todo)}
body{margin:0}
.brand .logo{width:auto;padding:0 6px}
details.mwhy>summary{cursor:pointer;color:var(--muted);width:fit-content}
details.mwhy>summary:hover{color:var(--ink)}
details.mwhy[open]{padding:8px 10px;background:var(--sunk);border-radius:var(--r-sm);display:grid;gap:6px}
ul.mes>li>span{color:var(--muted);font-size:.92rem;line-height:1.5}
figure.quote{margin:0;display:grid;gap:4px;padding:12px 14px;background:var(--sunk);border-radius:var(--r-sm)}
figure.quote blockquote{margin:0;font-style:italic;line-height:1.45}
figure.quote blockquote::before{content:"« "}
figure.quote blockquote::after{content:" »"}
figure.quote figcaption{font-size:.84rem;color:var(--muted)}
figure.quote figcaption::before{content:"— "}
.meta-row{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:.86rem;color:var(--muted)}
details.more,details.fx{font-size:.9rem}
details.more>summary,details.fx>summary{cursor:pointer;color:var(--muted);width:fit-content}
details.more>summary:hover,details.fx>summary:hover{color:var(--ink)}
details.more p{margin-top:8px}
.fx-body{margin-top:10px;padding:12px 14px;background:var(--sunk);border-radius:var(--r-sm);display:grid;gap:10px}
.fx-body ul{margin:0;padding-left:18px;display:grid;gap:6px}
table.grille{border-collapse:collapse;font-size:.86rem;width:100%}
table.grille th,table.grille td{padding:5px 10px 5px 0;text-align:left;font-weight:400;border-bottom:1px solid var(--line)}
table.grille td{font-variant-numeric:tabular-nums;text-align:right}
table.grille tr:last-child th,table.grille tr:last-child td{border-bottom:0;font-weight:700}

/* Accueil */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:stretch}
.hero .panel{display:grid;gap:12px;align-content:center}
.hero h1{font-size:clamp(1.7rem,3vw,2.4rem)}
.hero .lede{color:var(--muted);max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:4px;align-content:center}
.stats dt{font-size:.82rem;color:var(--muted)}
.stats dd{margin:0;font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.stats dd small{font-family:var(--body);font-weight:400;font-size:.86rem;color:var(--muted)}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
@media (max-width:440px){.stats{grid-template-columns:1fr 1fr}.stats div:first-child{grid-column:span 2}}
.hsec{display:grid;gap:12px;scroll-margin-top:90px}
.ready{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.ready a{display:grid;gap:10px;align-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;text-decoration:none;box-shadow:var(--shadow)}
.ready a:hover{border-color:var(--ink)}
.ready .tag{justify-self:start;font-size:.78rem;font-weight:700;background:var(--mark);color:var(--mark-ink);padding:2px 9px;border-radius:999px}
.ready .go{color:var(--muted);font-size:.86rem}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tile{display:grid;gap:6px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none;min-width:0}
.tile:hover{border-color:var(--ink)}
.tile.empty{background:transparent}
.tile .meta{font-size:.84rem;color:var(--muted)}
.bar{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--meter)}
.ctile{display:flex;gap:12px;align-items:center}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.matrix{border-collapse:collapse;font-size:.84rem;min-width:900px;width:100%}
.matrix th,.matrix td{border-bottom:1px solid var(--line);padding:7px 5px;text-align:center}
.matrix tr:last-child th,.matrix tr:last-child td{border-bottom:0}
.matrix thead th{font-weight:700;font-size:.74rem;vertical-align:bottom;color:var(--muted)}
.matrix a{text-decoration:none}
.matrix tbody th{text-align:left;white-space:nowrap;padding-left:14px;position:sticky;left:0;background:var(--surface)}
.matrix td a{display:inline-block;min-width:44px;padding:3px 6px;border-radius:6px;font-variant-numeric:tabular-nums;color:var(--todo)}
.matrix td a.has{background:var(--mark);color:var(--mark-ink);font-weight:700}
.legend{font-size:.86rem;color:var(--muted)}

/* Vue candidat */
.chead,.phead>.chead{display:flex;gap:16px;align-items:center}
.chead .mono{width:64px;height:64px;font-size:1.2rem}
.chead>div{display:grid;gap:4px;min-width:0}
.ccards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));align-items:start}
.ccard{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.ccard .top{display:grid;gap:4px}
.ccard .rep-line{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--accent-soft);border-radius:var(--r-sm)}
.ccard .rep-line p{font-weight:700}

/* À venir */
.later{display:flex;flex-wrap:wrap;gap:8px}
.later span{font-size:.86rem;padding:6px 12px;border:1px dashed var(--line);border-radius:999px;color:var(--muted)}

.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
footer{max-width:1560px;margin:40px auto 0;padding-left:var(--gut);padding-right:var(--gut-r);font-size:.86rem;color:var(--muted);display:grid;gap:8px}
footer p{max-width:90ch}

@media (prefers-reduced-motion:no-preference){.tile,.btn,.card,.ready a{transition:border-color .15s}}

/* ===== Design et ergonomie (22 novembre 2026) ===== */
/* Questions repliables */
details.qsec{display:block}
details.qsec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
details.qsec>summary::-webkit-details-marker{display:none}
details.qsec>summary:hover{border-color:var(--ink)}
details.qsec[open]>summary{border-color:var(--accent);background:var(--accent-soft)}
.qsum-t{display:grid;gap:4px;min-width:0;flex:1}
.qsum-t h2{font-size:1.15rem}
.qmeta{font-size:.86rem;color:var(--muted)}
.chev{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.chev::before{content:"";width:9px;height:9px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-2px) rotate(45deg)}
details.qsec[open] .chev::before{transform:translateY(2px) rotate(-135deg)}
@media (prefers-reduced-motion:no-preference){.chev::before{transition:transform .15s}}
.qbody{display:grid;gap:14px;padding-top:14px}
.qfoot{display:flex;justify-content:flex-end}
.qlist{display:grid;gap:12px}
.qtools{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.pick{display:inline-flex;align-items:center;gap:8px;font-size:.88rem}
.pick select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 30px 6px 12px;min-height:36px;max-width:100%;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
/* Réponses inconnues : cartes compactes en fin de liste */
.minis{display:grid;gap:8px}
.minis-h{font-size:.84rem;color:var(--muted);font-weight:700}
.cards.cards-mini{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.card.mini{box-shadow:none;background:transparent;border-style:dashed}
.card.mini .card-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px}
.card.mini .mono{width:30px;height:30px;font-size:.68rem}
.card.mini .go{color:var(--muted);font-size:.84rem;flex:none}
.card.mini:hover .go{color:var(--ink)}
.card.none.mini{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px}
.card.none.mini .rep{font-size:.84rem}
.card.sel.mini{border-style:solid}
/* Barre de navigation défilante (mobile) */
.mnav{position:relative;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent);padding-right:30px}
.mnav::-webkit-scrollbar{display:none}
/* Partage et retour en haut */
.share-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.totop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:25;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 2px 10px rgba(15,22,30,.18);cursor:pointer;font-size:1.25rem;opacity:0;pointer-events:none;transform:translateY(8px)}
.totop.on{opacity:1;pointer-events:auto;transform:none}
@media (prefers-reduced-motion:no-preference){.totop{transition:opacity .2s,transform .2s}}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;max-width:calc(100vw - 32px);overflow-wrap:anywhere;box-shadow:0 4px 18px rgba(0,0,0,.25)}
/* Accueil : thèmes vides plus discrets, avancement repliable */
.tile.empty{padding:11px 14px;box-shadow:none;border-style:dashed}
.tile.empty h3{font-size:.95rem;color:var(--muted)}
.tile.empty .bar{display:none}
details.adv>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::after{content:"+";font:700 1.2rem var(--display);color:var(--muted)}
details.adv[open]>summary::after{content:"−"}
details.adv[open]>summary{margin-bottom:12px}
.ccard .qlink{font-size:.88rem;color:var(--muted)}
.ccard .qlink:hover{color:var(--ink)}
/* Téléphone */
@media (max-width:640px){
  .topbar-in{flex-wrap:nowrap;gap:8px;min-height:54px;padding-block:6px}
  .brand>span:not(.logo){display:none}
  .tabs{gap:2px}
  .tabs a{padding:7px 10px;font-size:.88rem}
  .countdown .cd-l{display:none}
  .countdown .cd-s{display:inline}
  .card-btn,.card.none{padding:12px 14px}
  details.qsec>summary{padding:14px}
  .qsum-t h2{font-size:1.05rem}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .ctile{gap:8px;padding:12px}
  .ctile .mono{width:32px;height:32px;font-size:.7rem}
  .ctile .who b{font-size:.92rem}
  .ready{grid-template-columns:minmax(0,1fr)}
  .phead .toolbar,.qtools .toolbar{width:100%}
  .pick{width:100%}
  .pick select{flex:1}
  .detail{padding:14px 14px 16px}
}
@media (max-width:370px){.countdown{display:none}.tabs a{padding:7px 8px}}

partie des marchés européens.", "Opposition à la programmation énergétique (PPE), qu'elle chiffre à « un minimum de 300 milliards »": "La PPE est le plan officiel qui fixe la production d'énergie de la France pour les dix prochaines années (dernière version : février 2026). Marine Le Pen la conteste, surtout pour la place donnée à l'éolien et au solaire.", "Une « écologie de solutions et non d'injonctions »": "Miser sur l'innovation et les entreprises pour réduire la pollution, plutôt que sur des interdictions et des obligations.", "Un « principe de responsabilité » à la place du principe de précaution": "Le principe de précaution, inscrit dans la Constitution depuis 2005, permet de bloquer une activité en cas de risque grave mais incertain pour l'environnement. David Lisnard veut le remplacer par un principe qu'il juge moins bloquant pour l'innovation.", "Des règles simples et moins nombreuses": "Réduire le nombre de normes environnementales, qu'il juge trop complexes pour les entreprises et les collectivités.", "Priorité à l'adaptation": "Préparer le pays aux effets du réchauffement déjà en cours : canicules, sécheresses, inondations.", "Une « règle verte » dans la Constitution : ne pas prélever plus que la nature ne reconstitue": "Interdire, dans la Constitution, de prendre à la nature plus qu'elle ne peut renouveler en un an : eau, forêts, sols, poissons…", "Un conseil à la planification écologique": "Un organisme public chargé d'organiser la transition secteur par secteur (transports, logement, industrie…), avec des objectifs et un calendrier.", "Fin des subventions aux énergies fossiles": "Supprimer les aides et avantages fiscaux qui rendent le pétrole et le gaz moins chers pour certaines activités.", "Un pôle public de l'énergie": "Placer la production et la distribution d'énergie sous contrôle public, pour que l'État décide des prix et des investissements.", "Électrification des usages": "Remplacer l'essence, le gaz et le fioul par de l'électricité, en grande partie bas carbone en France : voitures électriques, pompes à chaleur, industrie.", "Taxe carbone aux frontières de l'Europe": "Faire payer aux produits importés une taxe selon le CO2 émis pour les fabriquer, pour ne pas désavantager les entreprises européennes, soumises à des règles plus strictes. L'Union européenne l'applique depuis 2026 à quelques produits comme l'acier ou le ciment.", "Aide à la voiture électrique d'occasion alignée sur celle du neuf": "Donner pour une voiture électrique d'occasion la même aide que pour une neuve, pour que les ménages qui achètent d'occasion en profitent aussi.", "Doublement du Fonds vert des collectivités": "Le Fonds vert est une enveloppe de l'État qui aide les communes à financer des travaux écologiques : rénovation d'écoles, espaces verts, etc. Il propose de doubler son montant.", "Priorité à l'adaptation, notamment au stockage de l'eau": "Préparer le pays aux sécheresses, par exemple en construisant des réserves d'eau pour l'agriculture.", "Une loi organique contre la surtransposition des normes européennes": "Quand la France applique une règle européenne, elle ajoute parfois des exigences en plus. Cette loi l'interdirait.", "Retrait du principe de précaution de la Constitution": "Le principe de précaution, inscrit dans la Constitution depuis 2005, permet de bloquer une activité en cas de risque grave mais incertain pour l'environnement. Bruno Retailleau veut le retirer, le jugeant frein à l'innovation.", "Fin du financement public de l'éolien et du solaire (position de 2025)": "Arrêter les aides publiques qui garantissent un prix de vente aux nouveaux parcs éoliens et solaires.", "Fin du financement public de l'éolien et du solaire": "Arrêter les aides publiques qui garantissent un prix de vente aux nouveaux parcs éoliens et solaires.", "Une « économie de guerre climatique » planifiée": "Mobiliser l'État comme en temps de guerre : investissements publics massifs et production organisée pour accélérer la transition.", "« Pas de nouvelle contrainte écologique sans nouveaux droits sociaux »": "Chaque nouvelle obligation écologique devrait s'accompagner d'une aide ou d'une garantie pour les ménages modestes, pour qu'ils n'en paient pas seuls le prix.", "Une loi de programmation climatique": "Une loi de programmation fixe à l'avance des objectifs et des budgets sur plusieurs années, comme celle qui existe pour l'armée. Ici, elle fixerait la trajectoire de baisse des émissions et les moyens pour y arriver.", "Des obligations : fin des voitures thermiques neuves en 2035, des poids lourds en 2040, vols de moins de 4 h 30 remplacés par le train": "Interdire la vente de voitures neuves essence ou diesel en 2035, puis celle des camions en 2040. Supprimer les vols intérieurs quand le train fait le trajet en moins de 4 h 30 (la règle actuelle est 2 h 30).", "Des incitations pour les ménages": "Des aides pour que les ménages puissent rénover leur logement ou changer de véhicule.", "Financement par une taxe de 2 % sur les grandes fortunes, un ISF climatique et une taxe sur les superprofits": "Trois impôts nouveaux : 2 % par an sur les plus grandes fortunes, un impôt sur la fortune qui tient compte de sa pollution, et une taxe sur les bénéfices exceptionnels des grandes entreprises.", "Aides à l'achat de voitures électriques et de pompes à chaleur": "Une pompe à chaleur chauffe le logement à l'électricité en puisant la chaleur de l'air ou du sol ; elle remplace une chaudière au gaz ou au fioul.", "Un « prix juste » du carbone, montant non précisé": "Faire payer les émissions de CO2 à un niveau qui reflète les dégâts qu'elles causent, pour orienter vers des solutions moins polluantes.", "Suppression des certificats d'économies d'énergie": "Ce dispositif oblige les fournisseurs d'énergie à financer des économies d'énergie (primes à l'isolation, au changement de chaudière…) ; son coût est répercuté sur les factures.", "Découpler le prix de l'électricité de celui du gaz": "En Europe, le prix de l'électricité sur le marché dépend souvent du coût des centrales au gaz, même quand l'électricité vient du nucléaire. L'idée est que le prix payé en France suive plutôt le coût de production français.", "Arrêt de l'éolien (2022)": "Ne plus construire d'éoliennes.", "Suppression des zones à faibles émissions (2022)": "Ces zones interdisent l'accès des voitures les plus polluantes dans certaines grandes villes.", "Nucléaire et renouvelables ensemble, sans opposer les deux": "Produire l'électricité à la fois avec les centrales nucléaires et avec l'éolien et le solaire.", "« Neutralité technologique » entre énergies bas carbone": "Ne pas favoriser une énergie par principe : toutes celles qui émettent peu de CO2 sont soutenues.", "Prolonger les réacteurs existants": "Faire fonctionner les centrales actuelles plus longtemps, au-delà de 50 ou 60 ans, si l'autorité de sûreté nucléaire l'autorise après ses contrôles tous les dix ans.", "Décider du nombre de nouveaux réacteurs après une expertise de la Cour des comptes": "La Cour des comptes contrôle l'usage de l'argent public. Il attend son analyse des coûts avant de dire combien de réacteurs construire.", "Position différente de celle de Yannick Jadot, opposé à de nouveaux réacteurs": "Sur ce point, il se distingue d'une partie de ses alliés écologistes.", "Développer la 4e génération": "Des réacteurs d'un nouveau type, encore au stade de la recherche, qui pourraient réutiliser une partie des déchets nucléaires comme combustible.", "Rouvrir Fessenheim (2022)": "La plus ancienne centrale française (Haut-Rhin), fermée en 2020. La rouvrir supposerait de remettre en état des installations arrêtées depuis plusieurs années.", "Refus des conditions posées par Bruxelles à l'aide d'État, jugées « inacceptables »": "L'État veut prêter de l'argent à EDF pour les nouveaux réacteurs. L'Union européenne doit vérifier que cette aide ne fausse pas la concurrence et pourrait poser des conditions, par exemple obliger EDF à vendre une partie de son électricité à ses concurrents.", "Relancer le nucléaire et l'hydroélectricité": "Construire de nouveaux réacteurs et développer les barrages qui produisent de l'électricité.", "Solaire en autoconsommation, jugé selon son « rapport coût-bénéfice »": "Des panneaux solaires installés par des particuliers ou des entreprises pour leur propre consommation, soutenus seulement quand ils sont rentables.", "Fermeture progressive des réacteurs": "Arrêter les réacteurs un par un, à mesure que les renouvelables les remplacent.", "Abandon du stockage des déchets à Bure (Cigéo)": "Cigéo est le projet de stockage des déchets les plus radioactifs à 500 mètres sous terre, à Bure (Meuse).", "Retour sur la fusion de l'ASN et de l'IRSN": "Depuis 2025, le gendarme du nucléaire (ASN) et l'institut d'expertise (IRSN) forment une seule autorité, l'ASNR. Le projet est de les séparer à nouveau, pour que l'expertise reste indépendante de la décision.", "Financement avec la Banque européenne d'investissement": "La banque de l'Union européenne, qui prête à taux bas pour des projets d'intérêt général.", "Renouvelables « là où elles sont efficaces »": "Développer l'éolien et le solaire seulement là où ils produisent beaucoup pour un coût raisonnable.", "Relancer le réacteur de 4e génération Astrid": "Astrid était un prototype de réacteur capable de réutiliser une partie des déchets nucléaires. L'État l'a abandonné en 2019.", "Arrêt des EPR2 et des petits réacteurs (SMR)": "Ne pas construire les six nouveaux réacteurs prévus, ni les petits réacteurs modulaires (SMR) en projet.", "Moratoire sur Cigéo": "Suspendre le projet de stockage souterrain des déchets les plus radioactifs à Bure (Meuse).", "Annulation de la fusion de l'ASN et de l'IRSN": "Depuis 2025, le gendarme du nucléaire (ASN) et l'institut d'expertise (IRSN) forment une seule autorité, l'ASNR. Le projet est de les séparer à nouveau, pour que l'expertise reste indépendante de la décision.", "Reconversion des salariés et des territoires": "Accompagner vers d'autres emplois les salariés des centrales, et aider les communes qui vivent de leur présence.", "Poursuivre le programme dans un « pacte productif »": "Inscrire le nucléaire dans un plan plus large pour l'industrie et l'emploi.", "Un prix de l'électricité qui ne suive plus celui du gaz": "En Europe, le prix de l'électricité sur le marché dépend souvent du coût des centrales au gaz, même quand l'électricité vient du nucléaire. L'idée est que le prix payé en France suive plutôt le coût de production français.", "Relance du nucléaire et 4e génération (2022)": "Construire de nouveaux réacteurs et développer la 4e génération, des réacteurs encore au stade de la recherche.", "Un référendum sur l'avenir du nucléaire": "Faire trancher par un vote des Français la question : construire de nouveaux réacteurs ou sortir du nucléaire.", "Plus de recherche sur les renouvelables": "Investir davantage d'argent public dans la recherche sur l'éolien, le solaire et le stockage."};

es.eu/article/actualites/energies/glucksmann-veut-plus-que-doubler-les-renouvelables-dici-2035-sans-lacher-le-nucleaire-2522/", "date": "9 novembre 2026", "reponse": "Plus que doubler la production renouvelable d'ici 2035", "chiffres": ["Production renouvelable plus que doublée d'ici 2035", "Soit plus de 310 TWh, contre environ 156 TWh en 2025 (calcul de la presse)", "200 Md€ d'investissements publics sur cinq ans, toutes politiques confondues"], "mesures": [{"titre": "Plus que doubler la production renouvelable d'ici 2035", "explication": "Produire deux fois plus d'électricité (ou d'énergie) à partir du vent, du soleil, de l'eau et de la biomasse qu'aujourd'hui.", "pourquoi": "Il faudrait environ +15 TWh par an, contre environ +10 TWh par an ces dernières années. Le périmètre (électricité seule ou toute l'énergie) n'est pas précisé.", "note": {"realisme": 3, "droit": 2, "financement": 1, "precision": 1}}, {"titre": "Financer par l'investissement public et une contribution sur les très grandes fortunes", "explication": "L'État investirait directement, et une taxe de 5 % sur les patrimoines de plus de 100 M€ apporterait une partie des recettes.", "pourquoi": "Recette nommée, mais sans estimation indépendante à ce taux ; la part allant aux renouvelables n'est pas précisée. Une taxe de ce type présente un risque constitutionnel selon plusieurs juristes.", "note": {"realisme": 4, "droit": 1, "financement": 1, "precision": 1}}]}}}, "le-pen": {"ecologie": {"2": {"texte": "Le RN propose d'« arrêter le développement de l'éolien et du photovoltaïque », jugeant que la France a assez de capacités et exporte beaucoup. Il veut supprimer les tarifs de rachat préférentiels (environ 7,2 Md€ d'économies par an selon son contre-budget 2026) et démanteler certains parcs éoliens. Il vise 60 % de nucléaire et 40 % de renouvelables en 2050. On ne sait pas si l'arrêt toucherait les panneaux des particuliers.", "source": "https://www.les-energies-renouvelables.eu/article/actualites/energie ammation-arrive-enfin-par-decret-155776/"}]}}});

REPERES.ecologie[3] = [{"texte": "Zones à faibles émissions : depuis le 1er janvier 2025, les voitures Crit'Air 3, 4 et 5 sont interdites dans le Grand Paris (en semaine, de 8 h à 20 h) et à Lyon. À Paris, pas d'amende avant 2027.", "source": "https://guichetcartegrise.com/blog/suppression-des-zfe-le-vote-du-8-octobre-2026-na-pas-abouti-ce-qui-change-pour-vous"}, {"texte": "La suppression des ZFE, votée en avril 2026, a été censurée le 21 mai 2026 par le Conseil constitutionnel, pour une raison de procédure. Une proposition de loi du RN n'a pas pu être votée le 8 octobre 2026.", "source": "https://lcp.fr/actualites/zfe-le-conseil-constitutionnel-censure-la-suppression-des-zones-a-faibles-emissions"}, {"texte": "Fin du thermique en 2035 : la règle européenne de 2023 (100 % de baisse du CO2 des voitures neuves) s'applique toujours. La Commission a proposé 90 % ; la commission Environnement du Parlement européen a voté 87,5 % le 4 novembre 2026. Texte final attendu en 2027.", "source": "https://www.journaldugeek.com/2026/11/05/le-100-electrique-en-2035-cest-presque-fini-les-eurodeputes-sauvent-le-moteur-thermique/"}, {"texte": "Voitures électriques : 41 % des voitures neuves vendues en octobre 2026, 32 % depuis janvier.", "source": "https://yopcar.fr/auto-9360-marche-automobile-doctobre-2026-lelectrique-depasse-41-des-voitures-neuves-dacia-decroche"}, {"texte": "Carburants : record du gazole à 2,38 € le litre le 18 septembre 2026, après la crise du détroit d'Ormuz. Le gouvernement refuse de baisser les taxes et a doublé l'aide aux gros rouleurs.", "source": "https://www.connaissancedesenergies.org/afp/la-campagne-dattal-et-de-philippe-percutee-par-la-crise-des-carburants-260922"}, {"texte": "Leasing social 2026 : 50 000 voitures électriques à moins de 200 € par mois, 401 M€ financés par les certificats d'économies d'énergie.", "source": "https://www.connaissancedesenergies.org/afp/leasing-social-de-vehicules-electriques-pres-de-20000-commandes-en-deux-semaines-lescure-260730"}];
deepMerge(POSITIONS, {"arthaud": {"ecologie": {"3": {"texte": "Pas de position connue pour 2027 sur les zones à faibles émissions, la fin des voitures thermiques ou le prix des carburants.", "source": "", "date": "", "reponse": "Pas de réponse connue"}}}, "dupont-aignan": {"ecologie": {"3": {"texte": "Pas de position connue pour 2027 sur les zones à faibles émissions, la fin des voitures thermiques ou le prix des carburants.", "source": "", "date": "", "reponse": "Pas de réponse connue"}}}, "lisnard": {"ecologie": {"3": {"texte": "Pas de position connue pour 2027 sur les zones à faibles émissions, la fin des voitures thermiques ou le prix des carburants.", "source": "", "date": "", "reponse": "Pas de réponse connue"}}}, "ruffin": {"ecologie": {"3": {"texte": "Pas de position connue pour 2027 sur les zones à faibles émissions, la fin des voitures thermiques ou le prix des carburants.", "source": "", "date": "", "reponse": "Pas de réponse connue"}}}, "villepin": {"ecologie": {"3": {"texte": "Pas de position précise connue. Au colloque de l'UFE du 23 juin 2026, il a évoqué les voitures électriques parmi les usages de l'électricité, sans proposition chiffrée.", "source": "https://www.sfen.org/rgn/presidentielle-2027-au-colloque-de-lufe-les-grands-partis-listent-leurs-positions-sur-le-nucleaire/", "date": "23 juin 2026", "reponse": "Pas de réponse connue"}}}, "zemmour": {"ecologie": {"3": {"texte": "Pas de déclaration 2026 trouvée sur ce sujet. En 2022, il proposait de mettre fin aux interdictions de circuler en ville selon le type de véhicule, c'est-à-dire aux zones à faibles émissions.", "source": "https://www.institutmontaigne.org/presidentielle-2022/eric-zemmour/mettre-fin-aux-interdictions-de-circuler-en-ville-en-fonction-du-type-de-vehicule", "date": "2022", "reponse": "Pas de réponse récente (en 2022 : supprimer les ZFE)", "mesures": [{"titre": "Supprimer les zones à faibles émissions (2022)", "explication": "Ne plus interdire aux voitures les plus anciennes de circuler dans certaines grandes villes.", "pourquoi": "Non noté : position de 2022, comme pour la note d'ensemble.", "note": null}]}}}, "attal": {"ecologie": {"3": {"texte": "Face à la hausse des carburants, il soutient la ligne du gouvernement : des aides ciblées et temporaires plutôt qu'une baisse générale des taxes. Il refuse la TVA à 5,5 % sur les carburants proposée par le RN, qu'il chiffre à 12 à 15 Md€. À plus long terme, il veut rendre l'électricité durablement moins chère que le pétrole et étendre le leasing social aux voitures électriques d'occasion. Pas de position connue sur les ZFE ni sur la fin du thermique en 2035.", "source": "https://www.linfodurable.fr/carburant-attal-soutient-le-gouvernement-et-developpe-deux-plan-desendettement-et-sortie-des-59092", "date": "23 septembre 2026", "reponse": "Aider de façon ciblée, pas de baisse générale des taxes", "chiffres": ["12 à 15 Md€ : son estimation du coût d'une TVA à 5,5 % sur les carburants, qu'il refuse", "100 € d'aide aux gros rouleurs modestes, environ 20 centimes par litre sur six mois (dispositif du gouvernement qu'il soutient)"], "mesures": [{"titre": "Aides ciblées et temporaires pour ceux qui dépendent de leur voiture", "explication": "Plutôt que baisser les taxes pour tout le monde, verser une aide aux personnes modestes qui roulent beaucoup pour aller travailler.", "pourquoi": "C'est le dispositif en place, chiffré par le gouvernement (plan de 450 M€ en septembre 2026). Pas d'objectif propre au-delà.", "note": {"realisme": 4, "droit": 2, "financement": 2, "precision": 1}}, {"titre": "Étendre le leasing social aux voitures électriques d'occasion", "explication": "Le leasing social permet de louer une voiture électrique neuve pour moins de 200 € par mois. Il propose de l'ouvrir aussi aux voitures d'occasion, avec une prime à l'achat.", "pourquoi": "Faisable, mais ni nombre de voitures, ni montant, ni calendrier : la note est plafonnée à 5.", "note": {"realisme": 4, "droit": 2, "financement": 0, "precision": 0}}], "citation": {"texte": "La logique, c'est de cibler un soutien envers ceux qui en ont le plus besoin et le faire de façon temporaire", "date": "23 septembre 2026"}}}}, "philippe": {"ecologie": {"3": {"texte": "Face à la hausse des carburants, il propose de doubler tout de suite l'aide ciblée aux automobilistes qui dépendent de leur voiture, financée par des économies sur les dépenses de l'État, plutôt que de baisser les taxes. Il rappelle son expérience des gilets jaunes. Pas de position connue sur les ZFE ni sur la fin du thermique en 2035.", "source": "https://www.connaissancedesenergies.org/afp/la-campagne-dattal-et-de-philippe-percutee-par-la-crise-des-carburants-260922", "date": "22 septembre 2026", "reponse": "Doubler l'aide ciblée, financée par des économies", "chiffres": ["Aide actuelle : 100 € pour les gros rouleurs modestes", "Proposition : la doubler"], "mesures": [{"titre": "Doubler l'aide aux automobilistes qui dépendent de leur voiture", "explication": "Passer de 100 € à environ 200 € l'aide versée aux personnes modestes qui roulent beaucoup pour travailler.", "pourquoi": "Le gouvernement a annoncé ce doublement le même mois. Le financement par « des économies » n'est pas détaillé.", "note": {"realisme": 4, "droit": 2, "financement": 1, "precision": 1}}], "citation": {"texte": "L'expérience (lui) a appris qu'avant de demander un effort aux Français", "auteur": "Édouard Philippe, cité par l'AFP", "date": "22 septembre 2026"}}}}, "le-pen": {"ecologie": {"3": {"texte": "Le RN demande de baisser la TVA sur les carburants de 20 % à 5,5 %. Ses députés ont déposé en juin 2026 une proposition de loi pour supprimer les zones à faibles émissions, qui n'a pas pu être votée le 8 octobre 2026. Son programme de 2024 prévoyait de renoncer à l'interdiction de vendre des voitures thermiques neuves en 2035.", "source": "https://www.connaissancedesenergies.org/afp/la-campagne-dattal-et-de-philippe-percutee-par-la-crise-des-carburants-260922", "date": "22 septembre 2026", "reponse": "Baisser la TVA sur les carburants et supprimer les ZFE", "chiffres": ["TVA sur les carburants : de 20 % à 5,5 %", "Coût estimé par Gabriel Attal : 12 à 15 Md€ par an"], "mesures": [{"titre": "Baisser la TVA sur les carburants à 5,5 %", "explication": "La TVA représente environ un sixième du prix à la pompe. La passer de 20 % à 5,5 % ferait baisser le litre d'environ 25 à 30 centimes.", "pourquoi": "La directive européenne sur la TVA ne prévoit pas de taux réduit pour les carburants : il faudrait la modifier, ce qui demande l'accord des 27 pays. Le coût, plus de 10 Md€ par an, n'est pas financé.", "note": {"realisme": 4, "droit": 0, "financement": 0, "precision": 1}}, {"titre": "Supprimer les zones à faibles émissions", "explication": "Mettre fin aux règles qui interdisent aux voitures les plus anciennes de circuler dans certaines grandes villes, comme Paris ou Lyon.", "pourquoi": "Une loi suffit : le Parlement l'avait votée en avril 2026, et le Conseil constitutionnel ne l'a censurée que pour une raison de procédure (mesure sans lien avec le texte).", "note": {"realisme": 4, "droit": 2, "financement": 2, "precision": 1}}, {"titre": "Renoncer à la fin des voitures thermiques neuves en 2035 (programme 2024)", "explication": "Continuer à autoriser la vente de voitures neuves à essence ou diesel après 2035.", "pourquoi": "L'Union européenne va déjà dans ce sens, mais le texte n'est pas définitif ; la France ne peut pas décider seule.", "note": {"realisme": 3, "droit": 1, "financement": 2, "precision": 1}}]}}}, "melenchon": {"ecologie": {"3": {"texte": "Veut bloquer le prix des carburants à 1,70 € le litre, en s'appuyant sur le Code de commerce, et plafonner les marges des raffineurs. Son programme automobile prévoit un leasing social généralisé, des voitures électriques à 10 000 € et l'achat par l'État de 300 000 voitures électriques par an, et garde l'objectif de 100 % de ventes électriques en 2035. Ses députés ont voté la suppression des ZFE en avril 2026.", "source": "https://www.publicsenat.fr/actualites/politique/jean-luc-melenchon-denonce-un-gouvernement-depasse-face-a-la-flambee-des-prix-des-carburants", "date": "23 septembre 2026", "reponse": "Bloquer le prix à 1,70 € le litre, et passer à l'électrique", "chiffres": ["Prix bloqué à 1,70 € le litre", "4,5 Md€ pour l'automobile, dont 300 000 voitures électriques achetées par l'État chaque année à 15 000 €", "Voitures électriques à 10 000 €"], "mesures": [{"titre": "Bloquer le prix des carburants à 1,70 € le litre", "explication": "Le gouvernement peut fixer un prix maximum pendant une crise. Les marges des raffineurs seraient aussi plafonnées.", "pourquoi": "Possible par décret, pour six mois au plus. Mais l'essence était à environ 2,14 € début octobre 2026 : si les marges ne suffisent pas à combler l'écart, le risque est la pénurie, comme en Hongrie en 2022.", "note": {"realisme": 2, "droit": 2, "financement": 1, "precision": 1}}, {"titre": "Leasing social généralisé et voitures électriques à 10 000 €", "explication": "L'État achèterait des voitures électriques pour les louer à bas prix aux ménages modestes, et pousserait la production de modèles très bon marché.", "pourquoi": "Montant annoncé (4,5 Md€), mais une voiture électrique neuve à 10 000 € est bien en dessous des modèles les moins chers aujourd'hui. Détails rapportés par la presse, pas encore dans un programme publié.", "note": {"realisme": 2, "droit": 2, "financement": 1, "precision": 1}}, {"titre": "Garder la fin des voitures thermiques neuves en 2035", "explication": "Ne vendre que des voitures neuves électriques à partir de 2035, comme le prévoit la règle européenne actuelle.", "pourquoi": "La règle européenne actuelle interdit la vente de voitures neuves qui émettent du CO2 à partir de 2035, mais l'Union est en train de l'assouplir (87,5 % de baisse au lieu de 100 %, vote en commission du Parlement européen le 4 novembre 2026). La France ne peut pas la maintenir seule : elle devrait function noteGlobale(cid, tid, k){
  const p = POSITIONS[cid]?.[tid]?.[k], g = NOTES[cid]?.[tid]?.[k];
  const pos = g ? noteSur10(g) : null;
  const ms = (p?.mesures || []).filter(m => m.note).map(m => noteSur10(m.note));
  const moy = ms.length ? ms.reduce((a, b) => a + b, 0) / ms.length : null;
  if (pos === null && moy === null) return null;
  if (g && g.realisme === 0) return {s: 0, pos, moy, veto: true};
  const raw = pos === null ? moy : moy === null ? pos : (pos + moy) / 2;
  return {s: Math.round(raw * 2) / 2, pos, moy};
}

}

const GRILLE = [
  {k:"realisme", nom:"Réalisme", max:4, aide:"4 : déjà fait ailleurs ou en cours · 3 : réaliste, avec une part d'incertitude · 2 : très difficile (rythme ou technique jamais atteints) · 1 : à la limite du possible · 0 : impossible en l'état, et la note tombe à 0/10"},
  {k:"droit", nom:"Droit", max:2, aide:"2 : une loi ou un décret suffit · 1 : il faut réviser la Constitution ou obtenir l'accord de l'Union européenne · 0 : contraire à une règle très difficile à changer"},
  {k:"financement", nom:"Financement", max:2, aide:"2 : coût chiffré et financé, ou pas de dépense notable · 1 : coût ou financement en partie indiqué · 0 : dépense certaine, ni chiffrée ni financée"},
  {k:"precision", nom:"Précision", max:2, aide:"2 : objectif chiffré et daté · 1 : chiffré ou daté · 0 : vague, et la note est plafonnée à 5/10 car on ne peut pas vérifier ce qui n'est pas défini"}
];
/* Note sur 10 = somme des critères ; 0 si irréaliste ; plafonnée à 5 si vague */
const noteSur10 = (n) => { if (!n) return null; if (n.realisme === 0) return 0;
  const s = GRILLE.reduce((a, g) => a + (n[g.k] || 0), 0); return n.precision === 0 ? Math.min(s, 5) : s; };
const noteHTML = (n) => { if (!n) return "";
  return `<ul class="crit">${GRILLE.map(g => `<li title="${esc(g.aide)}"><span>${esc(g.nom)}</span><b>${n[g.k] ?? 0}/${g.max}</b></li>`).join("")}</ul>${n.realisme === 0 ? `<p class="cap">Irréalisable en l'état : note ramenée à 0.</p>` : n.precision === 0 && GRILLE.reduce((a, g) => a + (n[g.k] || 0), 0) > 5 ? `<p class="cap">Trop vague pour être vérifié : note plafonnée à 5.</p>` : ""}`; };
const fxSummary = (n) => n ? `Faisabilité : <b>${String(noteSur10(n)).replace(".", ",")}/10</b>` : "Faisabilité : non noté";
const fxList = (items) => `<ul>${items.map(f => `<li>${esc(f.texte)}${f.source ? ` <a href="${esc(f.source)}" target="_blank" rel="noopener">Source</a>` : ""}</li>`).join("")}</ul>`;
const fmt = (x) => String(x).replace(".", ",");
const scoreBadge = (n, label) => { const s = n ? noteSur10(n) : null;
  return s === null ? `<span class="score none">Non noté</span>`
    : `<span class="score" title="${label || "Faisabilité"} : ${fmt(s)} sur 10"><span class="meter" aria-hidden="true"><i style="width:${s * 10}%"></i></span><b>${fmt(s)}</b><small>/10</small></span>`; };
const scoreBadgeS = (s, label) => s === null || s === undefined ? `<span class="score none">Non noté</span>`
  : `<span class="score" title="${label || "Note d'ensemble"} : ${fmt(s)} sur 10"><span class="meter" aria-hidden="true"><i style="width:${s * 10}%"></i></span><b>${fmt(s)}</b><small>/10</small></span>`;
const srcLink = (p) => p.source ? `<a href="${esc(p.source)}" target="_blank" rel="noopener">Voir la source</a>` : `<span>Source à ajouter</span>`;

function mesureHTML(m){
  const n = m.note;
  return `<li><div class="mtop"><strong>${esc(m.titre)}</strong>${n ? scoreBadge(n, "Faisabilité de la mesure") : m.pourquoi ? `<span class="score none">Non noté</span>` : ""}</div>
    ${m.explication ? `<span>${esc(m.explication)}</span>` : ""}
    ${n ? `<details class="mwhy"><summary>Pourquoi ${fmt(noteSur10(n))}/10 ?</summary><p>${esc(m.pourquoi)}</p>${noteHTML(n)}</details>` : m.pourquoi ? `<p class="mnn">${esc(m.pourquoi)}</p>` : ""}</li>`;
}

/* Corps d'une réponse : chiffres, mesures expliquées et notées, citation, puis source et faisabilité */
function answerBody(c, t, k, p){
  const q = p.citation, fx = FAISABILITE[c.id]?.[t.id]?.[k], n = NOTES[c.id]?.[t.id]?.[k];
  const structured = p.chiffres || p.mesures || q;
  const cols = [
    p.chiffres ? `<div class="part"><h4>En chiffres</h4><ul class="figs">${p.chiffres.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "",
    p.mesures ? `<div class="part"><h4>Mesures</h4><ul class="mes">${p.mesures.map(mesureHTML).join("")}</ul></div>` : ""
  ].filter(Boolean);
  const G = noteGlobale(c.id, t.id, k);
  const calc = !G ? "" : G.veto ? "Position principale irréalisable : note d'ensemble 0/10, quelles que soient les mesures."
    : G.pos !== null && G.moy !== null ? `Moitié position principale (${fmt(G.pos)}/10), moitié moyenne des mesures (${fmt(Math.round(G.moy * 10) / 10)}/10).`
    : G.pos !== null ? "Seule la position principale est notée." : "Seules les mesures sont notées ; la position principale ne l'est pas.";
  const verdict = G ? `<div class="verdict"><div class="vtop"><span class="vlab">Faisabilité</span>${scoreBadgeS(G.s)}</div>
      ${n?.bref ? `<p>${esc(n.bref)}</p>` : ""}
      ${n ? noteHTML(n) : ""}
      <p class="vcalc">${calc}</p>
      ${fx ? `<details class="fx"><summary>Les vérifications et leurs sources</summary><div class="fx-body">${fxList(fx)}</div></details>` : ""}
    </div>` : fx ? `<div class="verdict"><div class="vtop"><span class="vlab">Faisabilité</span><span class="score none">Non noté</span></div>${fxList(fx)}</div>` : "";
  return `<div class="ab">
    ${verdict}
    ${structured ? `
      ${cols.length ? `<div class="cols${cols.length === 1 ? " solo" : ""}">${cols.join("")}</div>` : ""}
      ${q ? `<figure class="quote"><blockquote>${esc(q.texte)}</blockquote><figcaption>${esc(q.auteur || c.nom)}${q.date ? `, ${esc(q.date)}` : ""}</figcaption></figure>` : ""}
      <details class="more"><summary>Lire le résumé complet</summary><p>${esc(p.texte)}</p></details>`
    : `<p>${esc(p.texte)}</p>`}
    <div class="meta-row">${srcLink(p)}${p.date ? `<span>Position du ${esc(p.date)}</span>` : ""}</div>

  </div>`;
}

function reperesHTML(t, k){
  if (!REPERES[t.id]?.[k]) return "";
  return `<details class="rep"><summary>Repères officiels et grille de notation</summary><div class="rep-body">
    ${fxList(REPERES[t.id][k])}
    <p><b>Grille de faisabilité.</b> Quatre critères qui s'additionnent : réalisme sur 4, droit, financement et précision sur 2 chacun. La même grille note la position principale et chaque mesure. La note d'ensemble est pour moitié celle de la position principale, pour moitié la moyenne des mesures. Les principes généraux et les positions de 2022 ou 2023 ne sont pas notés.</p>
    <ul>${GRILLE.map(g => `<li><b>${esc(g.nom)}</b> : ${esc(g.aide)}</li>`).join("")}</ul>
    <p class="muted">La note mesure la précision et la faisabilité d'une proposition, pas son intérêt.</p>
  </div></details>`;
}

const whoHTML = (c) => `<span class="mono" aria-hidden="true">${initials(c.nom)}</span><span class="who"><b>${esc(c.nom)}</b><small>${esc(c.parti)}</small></span>`;

function themeSide(t){

    return `<li><a href="#theme-${x.id}"${x===t?' aria-current="page"':""}><span>${esc(x.nom)}</span><span class="n${d.length?" has":""}">${d.length}/${x.sa.length}</span></a>

}

function cardHTML(c, t, k){
  const p = POSITIONS[c.id]?.[t.id]?.[k];
  if (!p) return `<div class="card none mini"><span class="card-top">${whoHTML(c)}</span><span class="rep unk">À renseigner</span></div>`;
  const lbl = `<span class="lbl-open">Voir le détail</span><span class="lbl-close">Fermer</span>`;
  if (isUnk(p)) return `<article class="card mini" id="c-${t.id}-${k}-${c.id}">
      <button class="card-btn" data-open="${c.id}|${t.id}|${k}" aria-expanded="false"><span class="card-top">${whoHTML(c)}</span><span class="go">${lbl}</span></button>
    </article>`;
  return `<article class="card" id="c-${t.id}-${k}-${c.id}">
      <button class="card-btn" data-open="${c.id}|${t.id}|${k}" aria-expanded="false">
        <span class="card-top">${whoHTML(c)}</span>
        <span class="rep">${esc(p.reponse || p.texte)}</span>
        <span class="card-foot">${scoreBadgeS(scoreOf(c.id, t.id, k))}<span class="go">${p.mesures ? `${p.mesures.length} mesure${p.mesures.length > 1 ? "s" : ""} · ` : ""}${lbl}</span></span>
      </button>
    </article>`;
}

  const mnav = THEMES.map(x => `<a class="chip${x===t?" on":""}" href="#theme-${x.id}">${esc(x.nom)}</a>`).join("");

  const qs = done.map(k => {
    const L = listFor(t.id, k).filter(c => !focusC || c.id === focusC);
    const known = L.filter(c => { const p = POSITIONS[c.id]?.[t.id]?.[k]; return p && !isUnk(p); });
    const unk = L.filter(c => !known.includes(c));

      <div class="qbody">
        ${reperesHTML(t, k)}
        ${known.length ? `<div class="cards">${known.map(c => cardHTML(c, t, k)).join("")}</div>` : ""}
        ${unk.length ? `<div class="minis"><p class="minis-h">${focusC ? "" : `Pas de réponse connue (${unk.length})`}</p><div class="cards cards-mini">${unk.map(c => cardHTML(c, t, k)).join("")}</div></div>` : ""}
        <div class="qfoot"><button class="btn" data-share="${BASE}#theme-${t.id}-${k}" data-title="${esc(qText(t, k))}">Partager cette question</button></div>
      </div>
    </details>`; }).join("");
  const pick = `<label class="pick"><span class="muted">Candidat</span><select data-focus aria-label="Afficher un seul candidat">
      <option value="">Tous les candidats</option>${byName.map(c => `<option value="${c.id}"${c.id === focusC ? " selected" : ""}>${esc(c.nom)}</option>`).join("")}</select></label>`;
  return `${topbar("theme")}
  <div class="shell">${themeSide(t)}
    <main class="main">
      <nav class="mnav" aria-label="Thèmes">${mnav}</nav>
      <div class="phead"><div><span class="eyebrow">Thème</span><h1>${esc(t.nom)}</h1>
        <p class="muted">${done.length ? `${done.length} question${done.length > 1 ? "s" : ""} comparée${done.length > 1 ? "s" : ""} sur ${t.sa.length}. Ouvrez une question pour voir les réponses, puis une carte pour le détail.` : `Aucune question n'est encore comparée sur ce thème.`}</p></div>
        ${done.length ? orderToggle() : ""}</div>
      ${done.length ? `<div class="qtools">${pick}<button class="btn" data-allq>${allOpen ? "Tout replier" : "Tout déplier"}</button></div>` : ""}
      <div class="qlist">${qs}</div>
      ${todo.length ? `<section class="hsec" aria-labelledby="h-later"><h2 id="h-later">${done.length ? "Questions à venir" : "Questions prévues"}</h2>
        <div class="later">${todo.map(k => `<span>${esc(saShort(t.sa[k]))}</span>`).join("")}</div></section>` : ""}
    </main></div>
  ${footer()}`;
}

function candView(c){
  const l = list(), i = l.indexOf(c), prev = l[(i - 1 + l.length) % l.length], next = l[(i + 1) % l.length];
  const side = `<nav class="side" aria-label="Candidats"><p class="side-h">Candidats</p><ul>${l.map(x => `<li><a href="#candidat-${x.id}"${x===c?' aria-current="page"':""}><span>${esc(x.nom)}</span></a></li>`).join("")}</ul></nav>`;
  const mnav = l.map(x => `<a class="chip${x===c?" on":""}" href="#candidat-${x.id}">${esc(x.nom)}</a>`).join("");
  const withPos = THEMES.filter(t => answered(t).some(k => POSITIONS[c.id]?.[t.id]?.[k]));
  const nAns = THEMES.reduce((a, t) => a + answered(t).filter(k => POSITIONS[c.id]?.[t.id]?.[k]).length, 0);
  const sections = withPos.map(t => `
    <section class="hsec" aria-labelledby="h-${t.id}">
      <div class="phead"><div><h2 id="h-${t.id}">${esc(t.nom)}</h2></div><a class="btn" href="#theme-${t.id}">Comparer avec les autres →</a></div>
      <div class="ccards">${answered(t).filter(k => POSITIONS[c.id]?.[t.id]?.[k]).map(k => { const p = POSITIONS[c.id][t.id][k];
        return `<article class="ccard">
          <div class="top"><span class="eyebrow">${esc(saShort(t.sa[k]))}</span><h3>${esc(qText(t, k))}</h3></div>
          <div class="rep-line"><p>${esc(p.reponse || "")}</p></div>
          ${answerBody(c, t, k, p)}
          <a class="qlink" href="#theme-${t.id}-${k}-${c.id}">Comparer cette réponse avec les autres candidats →</a>
        </article>`; }).join("")}</div>
    </section>`).join("");
  const later = THEMES.filter(t => !withPos.includes(t));
  return `${topbar("cand")}
  <div class="shell">${side}
    <main class="main">
      <nav class="mnav" aria-label="Candidats">${mnav}</nav>
      <div class="phead"><div class="chead"><span class="mono" aria-hidden="true">${initials(c.nom)}</span>
        <div><span class="eyebrow">${esc(c.statut)}</span><h1>${esc(c.nom)}</h1><p class="muted">${esc(c.parti)} · ${nAns} réponse${nAns > 1 ? "s" : ""} sur ${totalAnswered()} question${totalAnswered() > 1 ? "s" : ""} comparée${totalAnswered() > 1 ? "s" : ""}</p></div></div>
        ${orderToggle()}</div>
      ${sections}
      ${later.length ? `<section class="hsec" aria-labelledby="h-later"><h2 id="h-later">Thèmes à venir</h2>

    </main></div>
  ${footer()}`;
}

/* Détail d'une réponse : la carte s'agrandit sur toute la largeur de la grille */
function toggleCard(btn){
  const card = btn.closest(".card"), grid = card.closest(".qbody") || card.closest(".cards");
  const was = card.classList.contains("sel");
  closePanel(grid);
  if (was && location.hash.startsWith("#theme-")) history.replaceState(null, "", location.hash.replace(/^(#theme-[a-z]+-\d+)-.*$/, "$1"));
  if (was) return;
  const [cid, tid, ks] = btn.dataset.open.split("|"), c = cand(cid), t = theme(tid), k = +ks, p = POSITIONS[cid]?.[tid]?.[k];
  const panel = document.createElement("div");
  panel.className = "detail"; panel.id = "detail-" + tid + "-" + k; panel.setAttribute("role", "region"); panel.setAttribute("aria-label", "Détail : " + c.nom);
  panel.innerHTML = `<div class="detail-head"><span class="who"><b>${esc(c.nom)}</b><small>${esc(p.reponse || "")}</small></span><button class="icon" data-fold aria-label="Fermer le détail">×</button></div>`
    + answerBody(c, t, k, p) + `<div class="card-end"><a href="#candidat-${c.id}">Toutes les réponses de ${esc(c.nom)} →</a><button class="btn" data-share="${BASE}#theme-${tid}-${k}-${cid}" data-title="${esc(c.nom)} : ${esc(qText(t, k))}">Partager cette réponse</button></div>`;
  placePanel(card, panel);
  card.classList.add("sel"); btn.setAttribute("aria-expanded", "true"); btn.setAttribute("aria-controls", panel.id);
  if (location.hash.startsWith("#theme-")) history.replaceState(null, "", `#theme-${tid}-${k}-${cid}`);
  const r = panel.getBoundingClientRect();
  if (r.top > innerHeight - 120) panel.scrollIntoView({block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}
/* le panneau se place juste après la dernière carte de la rangée de la carte choisie */
function placePanel(card, panel){
  const cards = [...card.closest(".cards").children].filter(x => x.classList.contains("card"));
  const top = card.offsetTop; let last = card;
  for (const x of cards) if (x.offsetTop === top) last = x;
  last.after(panel);
}
function closePanel(grid){
  grid.querySelectorAll(".detail").forEach(d => d.remove());
  grid.querySelectorAll(".card.sel").forEach(x => { x.classList.remove("sel"); const b = x.querySelector(".card-btn"); b.setAttribute("aria-expanded", "false"); b.removeAttribute("aria-controls"); });
}
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => document.querySelectorAll(".card.sel").forEach(card => { const d = card.closest(".cards").querySelector(".detail"); if (d) placePanel(card, d); }), 120); });

function render(){
  const h = location.hash.slice(1);
  let html, anchor = null;
  const m = h.match(/^theme-([a-z]+)(?:-(\d+)(?:-([a-z-]+))?)?$/);
  if (m && theme(m[1])) { if (m[2] !== undefined) { openQ.add(m[1] + "-" + m[2]); anchor = "q-" + m[2]; if (m[3] && focusC && focusC !== m[3]) focusC = ""; } html = themeView(theme(m[1])); }
  else if (h.startsWith("candidat-") && cand(h.slice(9))) html = candView(cand(h.slice(9)));
  else { html = home(); if (["themes","candidats","tableau"].includes(h)) anchor = h; }
  $("#app").innerHTML = html;
  if (anchor) document.getElementById(anchor)?.scrollIntoView(); else window.scrollTo(0,0);
  const btn = m?.[3] && document.querySelector(`#q-${m[2]} [data-open^="${m[3]}|"]`);
  if (btn) { toggleCard(btn); btn.closest(".card").scrollIntoView({block: "start"}); }
  const on = document.querySelector(".mnav .on");
  if (on) on.parentElement.scrollLeft = on.offsetLeft - (on.parentElement.clientWidth - on.offsetWidth) / 2;
}

document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelectorAll(".cards").forEach(g => { if (g.querySelector(".detail")) { const c = g.querySelector(".card.sel .card-btn"); closePanel(g); c?.focus(); } }); });
document.addEventListener("click", (e) => {
  const f = e.target.closest("[data-fold]");
  if (f) { const grid = f.closest(".cards"), card = grid.querySelector(".card.sel"); closePanel(grid); if (card) { card.querySelector(".card-btn").focus(); card.scrollIntoView({block: "nearest"}); } return; }
  const o = e.target.closest("[data-open]");
  if (o) { toggleCard(o); return; }
  const sh = e.target.closest("[data-share]");
  if (sh) { shareLink(sh.dataset.share, sh.dataset.title); return; }
  if (e.target.closest("[data-top]")) { window.scrollTo({top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); return; }
  const aq = e.target.closest("[data-allq]");
  if (aq) { const all = [...document.querySelectorAll("details.qsec")], open = all.some(d => !d.open); all.forEach(d => d.open = open); aq.textContent = open ? "Tout replier" : "Tout déplier"; return; }
  const b = e.target.closest("[data-order]");
  if (!b) return;
  order = b.dataset.order;
  try { localStorage.setItem("ordre", order); } catch(err) {}
  const y = window.scrollY; render(); window.scrollTo(0, y);
});
window.addEventListener("hashchange", render);
/* Question dépliée ou repliée : mémorisée pendant la visite, et l'adresse suit pour pouvoir la partager */
document.addEventListener("toggle", (e) => {
  const d = e.target; if (!d.matches || !d.matches("details.qsec")) return;
  const q = d.dataset.q, own = "#theme-" + q;
  if (d.open) { openQ.add(q); if (location.hash !== own && !location.hash.startsWith(own + "-")) history.replaceState(null, "", own); }
  else { openQ.delete(q); if (location.hash === own || location.hash.startsWith(own + "-")) history.replaceState(null, "", "#theme-" + q.split("-")[0]); }
  const all = [...document.querySelectorAll("details.qsec")], aq = document.querySelector("[data-allq]");
  if (aq) aq.textContent = all.every(x => x.open) ? "Tout replier" : "Tout déplier";
}, true);
document.addEventListener("change", (e) => {
  if (!e.target.matches("[data-focus]")) return;
  focusC = e.target.value;
  if (focusC) document.querySelectorAll("details.qsec").forEach(d => openQ.add(d.dataset.q));
  const y = window.scrollY; render(); window.scrollTo(0, y);
});
const toTop = document.createElement("button");
toTop.className = "totop"; toTop.dataset.top = ""; toTop.setAttribute("aria-label", "Revenir en haut de la page"); toTop.textContent = "↑";
document.body.appendChild(toTop);
addEventListener("scroll", () => toTop.classList.toggle("on", window.scrollY > 700), {passive: true});
render();
</script>
</body>
</html>
