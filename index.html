026", "reponse": "Encadrer l'IA et placer les infrastructures numériques sous contrôle public", "mesures": [{"titre": "Passer les infrastructures numériques sous contrôle public", "explication": "Centres de données et réseaux télécoms appartiendraient à l'État ou seraient contrôlés par lui.", "pourquoi": "Ni périmètre, ni coût, ni calendrier : trop vague pour être notée.", "note": {"v2": 1, "technique": 3, "droit": 2, "financement": 0, "precision": 0, "portee": "T", "statut": "N"}}, {"titre": "Interdire les IA qui simulent une relation affective", "explication": "Interdire les applications de « compagnons » virtuels conçues pour créer un attachement.", "pourquoi": "Le règlement européen sur l'IA fixe la liste des pratiques interdites : une interdiction nationale supplémentaire devrait passer par une règle européenne. Sans coût.", "note": {"v2": 1, "technique": 3, "droit": 1, "financement": 2, "precision": 1, "portee": "S", "statut": "N"}}]}, "9": {"texte": "Veut « bloquer et encadrer les prix des produits de première nécessité (alimentation, énergie, carburant) » et « indexer les salaires sur l'inflation dans le privé comme dans la fonction publique ». Manuel Bompard, coordinateur de LFI, veut pouvoir bloquer les prix des carburants par décret « quelques jours » après l'arrivée au pouvoir ; plusieurs responsables du parti parlent d'instaurer un « état d'urgence sociale ».", "source": "https://melenchon2027.fr/programme/livre/une-economie-au-service-des-besoins/chapitre2", "date": "programme mis à jour le 7 novembre 2026 (et 8 novembre 2026)", "reponse": "Bloquer les prix des produits de première nécessité et des carburants", "mesures": [{"titre": "Bloquer et encadrer les prix des produits de première nécessité", "explication": "L'État fixerait un prix maximum pour l'alimentation, l'énergie et les carburants de base.", "pourquoi": "Possible par décret pour six mois au plus en cas de crise ; au-delà, il faut une loi. Produits désignés par grandes catégories, sans liste ni calendrier.", "note": {"v2": 1, "technique": 3, "droit": 2, "financement": 2, "precision": 1, "portee": "S", "statut": "N"}}, {"titre": "Bloquer les prix des carburants par décret", "explication": "Fixer un prix maximum à la pompe quelques jours après l'arrivée au pouvoir.", "pourquoi": "Voir thème Écologie, où la mesure est évaluée avec son prix plafond.", "note": null}, {"titre": "Indexer les salaires sur l'inflation", "explication": "Les salaires augmenteraient automatiquement comme les prix.", "pourquoi": "Sera évaluée avec les salaires (thème Travail) : non notée ici.", "note": null}]}}}, "philippe": {"economie": {"0": {"texte": "Veut « rompre » sans « sortir de l'économie de marché » et poursuivre la politique de l'offre. Il mise sur le travail (fin des 35 heures, heures supplémentaires exonérées), la baisse de la dépense publique et « un pacte de stabilité » pour les entreprises. Il reprend son échange de 50 Md€ de baisse des impôts de production contre 50 Md€ d'aides aux entreprises en moins (voir Entreprises). Objectif : déficit entre 2 et 2,5 %, avec une « double règle d'or ».", "source": "https://www.publicsenat.fr/actualites/politique/capitalisation-suppression-de-250-000-postes-de-fonctionnaires-autonomie-des-ecoles-fin-des-35-heures-aides-pour-les-familles-edouard-philippe-presente-son-projet-massif-et", "date": "18 novembre 2026", "reponse": "Plus de travail, moins de dépense publique et des règles stables pour les entreprises", "mesures": [{"titre": "Un « pacte de stabilité » pour les entreprises", "explication": "S'engager à ne pas changer les impôts et les règles des entreprises.", "pourquoi": "Une loi de programmation peut fixer ce cadre, mais elle ne lie pas les lois suivantes : c'est surtout un engagement politique. Sans coût. Le périmètre exact n'est pas détaillé.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 2, "precision": 1, "portee": "T", "statut": "N"}}], "citation": {"texte": "Nous devons rompre, mais je ne veux pas sortir de l'économie de marché", "date": "18 novembre 2026"}}, "1": {"texte": "Promet « le plus grand choc de compétitivité jamais réalisé » : 50 Md€ d'impôts de production en moins, compensés par 50 Md€ d'aides en moins (voir Entreprises), aucun nouvel impôt ni nouvelle norme pendant le quinquennat, et des délais divisés par deux pour les projets industriels. Face à la Chine, il veut imposer dans les secteurs stratégiques des transferts de technologie, des quotas de production et des coentreprises, et une préférence européenne. Il dit vouloir « sauver » l'automobile, la sidérurgie et le nucléaire.", "source": "https://www.edouardphilippe.fr/programme/entreprises", "date": "18 novembre 2026", "reponse": "Un « choc de compétitivité » et une préférence européenne face à la Chine", "citation": {"texte": "le plus grand choc de compétitivité jamais réalisé", "date": "18 novembre 2026"}}, "2": {"texte": "Propose « un pacte fiscal massif » : un échange entre 50 Md€ de baisse des impôts de production (la CVAE, la C3S et la CFE sont visées, sans répartition) et 50 Md€ de baisse des aides, qu'il juge « saupoudrées, complexes, incompréhensibles ». Public Sénat chiffre l'opération à 250 Md€ sur le quinquennat. Il promet « aucun nouvel impôt ni aucune nouvelle norme pendant le quinquennat », une loi annuelle de suppression de normes, la suppression des cotisations patronales au-delà de la 37e heure, et limiterait dans le temps le statut d'auto-entrepreneur.", "source": "https://www.edouardphilippe.fr/programme/entreprises", "date": "18 novembre 2026 (proposition de novembre 2025)", "reponse": "50 Md€ de baisse des impôts de production, contre 50 Md€ d'aides en moins", "chiffres": ["50 Md€ de baisse d'impôts contre 50 Md€ de baisse d'aides", "250 Md€ sur le quinquennat (calcul de Public Sénat)"], "mesures": [{"titre": "Baisser les impôts de production de 50 Md€ par an, en supprimant des aides", "explication": "Les entreprises paieraient moins d'impôts, mais recevraient moins d'aides publiques : l'équipe présente l'opération comme neutre pour l'État.", "pourquoi": "Montant, financement et durée indiqués. C'est plus que le CICE et le pacte de responsabilité (environ 40 Md€) : une baisse de cette ampleur n'a jamais été faite, et les aides à supprimer ne sont pas listées.", "note": {"v2": 1, "technique": 2, "droit": 3, "financement": 2, "precision": 2, "portee": "T", "statut": "N"}}], "citation": {"texte": "Un deal à 50 milliards d'euros de baisse d'impôts d'un côté et de baisse de dépenses de l'autre", "date": "6 novembre 2025"}}, "3": {"texte": "Veut que l'Europe pose des conditions à la Chine face à une « concurrence déloyale chinoise » : transferts de technologie, quotas de production et coentreprises dans les secteurs stratégiques, et un prix du carbone aux frontières européennes, y compris sur les produits chinois. Il veut aussi « l'achèvement du marché unique européen », en supprimant les « spécifications nationales » « qui agissent comme des droits de douane cachés ».", "source": "https://www.edouardphilippe.fr/programme/entreprises", "date": "18 novembre 2026", "reponse": "Des conditions européennes face à la Chine et l'achèvement du marché unique", "mesures": [{"titre": "Conditionner l'accès des entreprises chinoises au marché européen", "explication": "Les entreprises chinoises devraient transférer des technologies, produire en Europe ou s'associer à des entreprises européennes pour vendre dans les secteurs stratégiques.", "pourquoi": "Relève de la politique commerciale européenne, décidée à la majorité qualifiée, et doit respecter les engagements à l'OMC. Sans coût direct ; secteurs visés non listés.", "note": {"v2": 1, "technique": 3, "droit": 1, "financement": 2, "precision": 1, "portee": "T", "statut": "N"}}]}, "4": {"texte": "Veut « faire de l'Europe une puissance souveraine du numérique » et une « puissance énergétique », avec une préférence européenne « massive » dans l'industrie et des conditions posées à la Chine (voir Commerce et Numérique et IA).", "source": "https://www.edouardphilippe.fr/programme/intelligence-artificielle", "date": "18 novembre 2026", "reponse": "Une souveraineté européenne, par la préférence européenne"}, "5": {"texte": "Veut « fusionner, supprimer ou privatiser une trentaine d'agences et d'opérateurs de l'État », « avec par exemple la privatisation de France Travail et la suppression du CESE ». Pas de nationalisation.", "source": "https://www.edouardphilippe.fr/programme/comptes-publics", "date": "18 novembre 2026", "reponse": "Privatiser ou supprimer une trentaine d'agences, dont France Travail", "mesures": [{"titre": "Fusionner, supprimer ou privatiser une trentaine d'agences, dont France Travail", "explication": "Des organismes publics seraient regroupés ou fermés, et certaines missions, comme l'accompagnement des chômeurs, confiées à des entreprises privées.", "pourquoi": "Possible par la loi : des opérateurs privés accompagnent déjà une partie des chômeurs. Réduit la dépense. Seule France Travail est nommée parmi les privatisations. Supprimer le CESE, inscrit dans la Constitution, demanderait de la réviser.", "note": {"v2": 1, "technique": 3, "droit": 2, "financement": 2, "precision": 1, "portee": "S", "statut": "N"}}]}, "6": {"texte": "Veut « un « livret capital France » et des fonds de capitalisation pour diriger l'épargne vers nos entreprises », et achever en priorité l'union européenne des marchés de capitaux.", "source": "https://www.edouardphilippe.fr/programme/entreprises", "date": "18 novembre 2026", "reponse": "Un « livret capital France » pour orienter l'épargne vers les entreprises", "mesures": [{"titre": "Un « livret capital France »", "explication": "Un nouveau produit d'épargne investi dans les entreprises françaises.", "pourquoi": "Ni plafond, ni avantage fiscal, ni rendement précisés : trop vague pour être notée.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 1, "precision": 0, "portee": "S", "statut": "N"}}]}, "7": {"texte": "Veut « lancer le plan Horizon 2050 pour succéder à France 2030 : un euro public pour un euro privé ». Il veut faire passer le nombre d'ingénieurs formés chaque année « de 40 000 à 100 000 en cinq ans », et un « droit à la reconversion » pour les métiers menacés par l'automatisation.", "source": "https://www.edouardphilippe.fr/programme/intelligence-artificielle", "date": "18 novembre 2026 (et 15 septembre 2026)", "reponse": "Un plan « Horizon 2050 » et 100 000 ingénieurs par an", "chiffres": ["De 40 000 à 100 000 ingénieurs formés par an, en cinq ans"], "mesures": [{"titre": "Former 100 000 ingénieurs par an d'ici cinq ans, contre 40 000", "explication": "Multiplier par deux et demi le nombre d'ingénieurs diplômés chaque année.", "pourquoi": "Objectif et délai précis, mais difficile à tenir en cinq ans : il faut beaucoup plus de places et d'enseignants. Coût non chiffré.", "note": {"v2": 1, "technique": 2, "droit": 3, "financement": 0, "precision": 2, "portee": "S", "statut": "N"}}, {"titre": "Un plan « Horizon 2050 » : un euro public pour un euro privé", "explication": "Un programme d'investissement dans les technologies d'avenir, cofinancé à parts égales par l'État et les entreprises.", "pourquoi": "Ni montant ni durée : trop vague pour être notée.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 0, "precision": 0, "portee": "S", "statut": "N"}}], "citation": {"texte": "Il faut instaurer un droit à la reconversion pour les métiers les plus menacés par l'automatisation.", "date": "15 septembre 2026"}}, "8": {"texte": "Veut « un pacte européen de puissance numérique, avec une priorité européenne dans l'achat technologique » (un « Buy European Tech Act »), des « zones d'accélération de l'IA », « faire de la France le leader européen de la puissance de calcul et des data centers » et transformer les services publics par l'IA. Il prévoit « zéro IA avant le collège » et un « Bouclier Cyber ». En septembre, un article lui prêtait l'objectif de doubler la puissance de calcul en cinq ans ; son programme ne le reprend pas.", "source": "https://www.edouardphilippe.fr/programme/intelligence-artificielle", "date": "18 novembre 2026 (et 15 septembre 2026)", "reponse": "Acheter européen dans la tech et devenir leader européen du calcul", "mesures": [{"titre": "Un « Buy European Tech Act »", "explication": "Les acheteurs publics européens choisiraient en priorité des technologies européennes.", "pourquoi": "Suppose de changer les règles européennes des marchés publics (majorité qualifiée) et de tenir compte des engagements à l'OMC. Sans coût direct ; part réservée non précisée.", "note": {"v2": 1, "technique": 3, "droit": 1, "financement": 2, "precision": 1, "portee": "T", "statut": "N"}}, {"titre": "Doubler la puissance de calcul en cinq ans", "explication": "Deux fois plus de supercalculateurs et de centres de données pour l'IA en France et en Europe.", "pourquoi": "Formule d'un journaliste de 75secondes en septembre ; le programme publié en novembre ne reprend ni le chiffre ni le délai : non noté.", "note": null}]}, "9": {"texte": "Pas de baisse générale des taxes sur les carburants. Son porte-parole, Christophe Béchu, veut « investir dans les causes plutôt que dans les symptômes » : garder les certificats d'économies d'énergie et aider à changer de chauffage ou de voiture.", "source": "https://www.les-energies-renouvelables.eu/article/actualites/energies/plan-energie-edouard-philippe-impact-sur-votre-facture-2282/", "date": "15 octobre 2026", "reponse": "Pas de baisse générale des taxes ; aider à changer d'équipement"}}}, "retailleau": {"economie": {"0": {"texte": "Promet « un grand coup de frein à la dépense publique et un coup d'accélérateur à la croissance » : 197 Md€ d'économies d'ici 2032, dont 146 sur la dépense et 51 « rendus » aux ménages (21, facture d'électricité comprise) et aux entreprises (30). « Il n'y aura pas d'impôt nouveau. »", "source": "https://lcp.fr/actualites/face-a-une-france-quasiment-en-faillite-bruno-retailleau-presente-un-plan-d-economies-de", "date": "12 octobre 2026", "reponse": "Freiner la dépense publique et baisser les impôts pour accélérer la croissance", "chiffres": ["197 Md€ d'économies d'ici 2032", "51 Md€ rendus aux ménages et aux entreprises, dont 30 pour les entreprises"], "citation": {"texte": "Il n'y aura pas d'impôt nouveau", "date": "12 octobre 2026"}}, "1": {"texte": "Propose un « Fonds France Production » de 600 M€ par an pour moderniser les usines, piloté par les régions, avec un suramortissement des équipements et un registre national des friches. Il veut baisser jusqu'à 10 % le prix de l'électricité pour l'industrie avec des contrats nucléaires de long terme, supprimer 100 règles « dès le lendemain de l'élection » puis procéder par ordonnances après une loi d'habilitation à l'été 2027. Il veut aussi réduire de 40 Md€ le « handicap fiscal » des entreprises, aides comprises : plus de 25 Md€ sur le coût du travail et près de 15 Md€ sur les impôts de production (voir Entreprises). Ce chiffre est plus large que les 30 Md€ de baisses pour les entreprises de son plan d'économies (voir Croissance).", "source": "https://www.avecretailleau.fr/projet/theme/industrie-entreprises", "date": "1er septembre 2026, mis à jour le 11 septembre", "reponse": "Un fonds pour moderniser les usines et une électricité moins chère", "chiffres": ["600 M€ par an pour le Fonds France Production", "Jusqu'à −10 % sur le prix de l'électricité pour l'industrie", "Jusqu'à 30 TWh par an de contrats nucléaires sur quinze ans"], "mesures": [{"titre": "Un « Fonds France Production » de 600 M€ par an", "explication": "Un fonds géré par les régions pour aider les usines à acheter des machines modernes : 200 M€ de l'État, 200 M€ des régions et 200 M€ de fonds européens.", "pourquoi": "Montant, répartition et gestionnaire donnés. Les fonds régionaux et européens existent déjà. Les 200 M€ des régions et des fonds européens dépendent de leur accord.", "note": {"v2": 1, "techniqu son plan d'économies, sans toucher aux aides. Une baisse de cette ampleur a déjà été faite (CICE et pacte de responsabilité, environ 40 Md€) ; la CFE finance les collectivités et devrait être compensée.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 2, "precision": 2, "portee": "S", "statut": "N"}}, {"titre": "Relever de 50 à 100 salariés les seuils d'obligations", "explication": "Les obligations qui s'appliquent à partir de 50 salariés ne s'appliqueraient plus qu'à partir de 100.", "pourquoi": "Sans coût et possible par la loi pour les seuils français. Certaines obligations viennent du droit européen (consultation des salariés à partir de 50 salariés) et ne pourraient pas être relevées seules.", "note": {"v2": 1, "technique": 3, "droit": 2, "financement": 2, "precision": 2, "portee": "S", "statut": "N"}}], "citation": {"texte": "Aucune de ces économies ne provient d'une coupe dans les aides aux entreprises.", "date": "11 septembre 2026"}}, "3": {"texte": "Veut contrôler davantage les importations : aujourd'hui, « 0,008 % seulement des importations font l'objet d'un contrôle physique ». Il s'engage à ce qu'« au moins la moitié des contrôles portera sur les produits importés », à effectifs constants. Il veut des clauses de réciprocité dans tous les accords commerciaux, portées au niveau européen, et étendre l'ajustement carbone aux frontières aux produits transformés.", "source": "https://www.avecretailleau.fr/projet/mesure/controler-davantage-les-importations-et-exiger-la", "date": "1er septembre 2026 (mis à jour le 24 septembre 2026)", "reponse": "Plus de contrôles sur les importations et la réciprocité dans les accords", "chiffres": ["0,008 % des importations contrôlées physiquement (son chiffre)", "Au moins la moitié des contrôles sur les produits importés"], "mesures": [{"titre": "Consacrer au moins la moitié des contrôles aux produits importés", "explication": "Les services de contrôle (douanes, répression des fraudes) vérifieraient en priorité tat", "mesures": [{"titre": "Confier au privé l'immobilier, les commandes et l'informatique de l'État", "explication": "Des entreprises géreraient ces fonctions à la place des administrations, pour un coût présenté comme moindre.", "pourquoi": "Possible par contrat et par la loi. Économie chiffrée (5 Md€), sans calendrier détaillé.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 2, "precision": 1, "portee": "S", "statut": "N"}}]}, "6": {"texte": "Veut « financer nos entreprises avec l'épargne » : simplifier les produits d'épargne, rendre la fiscalité plus favorable au placement de long terme, et créer un compte d'épargne retraite pour chaque actif, alimenté par l'intéressement, la participation et l'épargne volontaire. Il vise un socle « de l'ordre de 1 000 milliards d'euros ». Pas de mesure sur les banques.", "source": "https://www.avecretailleau.fr/projet/mesure/financer-les-entreprises-avec-l-epargne-et-preparer-la", "date": "1er septembre 2026 (mis à jour le 11 septembre 2026)", "reponse": "Orienter l'épargne vers les entreprises par un compte d'épargne retraite", "chiffres": ["Épargne des Français : « près de 6 000 milliards d'euros » (son chiffre)", "Socle visé : « de l'ordre de 1 000 milliards d'euros »"], "mesures": [{"titre": "Un compte d'épargne retraite pour chaque actif, investi dans les entreprises", "explication": "Chaque actif aurait un compte, alimenté par l'intéressement, la participation et son épargne, placé notamment dans les entreprises.", "pourquoi": "Des produits proches existent déjà (plan d'épargne retraite). La campagne assure qu'il « ne pèse pas sur les finances publiques », mais la fiscalité plus favorable annoncée a un coût non chiffré. Ni calendrier ni règles détaillées.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 1, "precision": 1, "portee": "S", "statut": "N"}}]}, "7": {"texte": "Veut concentrer les financements publics de recherche sur sept priorités industrielles (énergies du futur dont le nucléaire, IA, biotechnologies, batteries et matériaux, microélectronique, cybersécurité, quantique) : « Nous sortirons du saupoudrage ». Il ne financerait plus la recherche « sans débouché industriel », et veut « sanctuariser le crédit d'impôt recherche », à budget constant.", "source": "https://www.avecretailleau.fr/projet/mesure/concentrer-la-recherche-sur-sept-priorites-industrielles", "date": "1er et 11 septembre 2026", "reponse": "Concentrer la recherche sur sept priorités et garder le crédit d'impôt recherche", "mesures": [{"titre": "Concentrer la recherche publique sur sept priorités industrielles", "explication": "Les crédits de recherche iraient surtout à sept secteurs, avec une feuille de route et des résultats mesurés.", "pourquoi": "Relève des choix budgétaires de l'État, à budget constant. Secteurs listés, mais ni calendrier ni répartition des crédits.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 2, "precision": 1, "portee": "S", "statut": "N"}}, {"titre": "« Sanctuariser » le crédit d'impôt recherche", "explication": "Garder cet avantage fiscal tel quel, en luttant contre les abus.", "pourquoi": "Maintien de l'existant : non noté.", "note": null}], "citation": {"texte": "Nous sortirons du saupoudrage.", "date": "1er septembre 2026"}}, "8": {"texte": "Promet que « la France n'imposera jamais plus que ce que l'Europe exige » et veut un régime expérimental de trois ans dérogeant au RGPD et au règlement européen sur l'IA pour des projets stratégiques. Il vise « 1 gigawatt de calcul souverain d'ici 2030 », financé surtout par des capitaux privés, un assistant public « Marianne » et l'IA dans les services publics, pour redéployer 125 000 agents sur le terrain.", "source": "https://www.avecretailleau.fr/projet/mesure/lever-les-freins-reglementaires-a-l-innovation-en-ia", "date": "1er septembre 2026 (mis à jour le 23 novembre 2026)", "reponse": "Alléger les règles sur l'IA et bâtir un calcul souverain", "chiffres": ["1 GW de calcul souverain d'ici 2030, environ 4 GW vers 2035-2038", "10 à 15 Md€ par gigawatt, surtout privés (son chiffre)", "Budget de transformation de l'État par l'IA : 5 Md€ sur le quinquennat"], "mesures": [{"titre": "Déroger pendant trois ans au règlement européen sur l'IA et au RGPD", "explication": "Suspendre certaines règles européennes pour des projets de recherche et d'innovation stratégiques.", "pourquoi": "Ces règlements s'appliquent directement : la France ne peut pas y déroger seule. L'AI Act prévoit seulement des « bacs à sable » encadrés.", "note": {"v2": 1, "technique": 3, "droit": 0, "financement": 2, "precision": 2, "portee": "S", "statut": "N"}}, {"titre": "1 gigawatt de calcul souverain d'ici 2030", "explication": "Des centres de données sous juridiction française ou européenne, raccordés au réseau en dix-huit mois grâce à un guichet unique.", "pourquoi": "Objectif et délai précis ; des projets de cette taille sont déjà annoncés en France. Financement surtout privé ; l'État apporte le terrain, le raccordement et des commandes publiques garanties, non chiffrées.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 1, "precision": 2, "portee": "S", "statut": "N"}}, {"titre": "« Marianne », un assistant administratif pour chaque Français", "explication": "Un assistant numérique gratuit qui explique les droits et préremplit les démarches, sans rien décider.", "pourquoi": "Financé dans un budget de 5 Md€ sur le quinquennat ; sans difficulté juridique, calendrier non précisé.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 2, "precision": 1, "portee": "S", "statut": "N"}}], "citation": {"texte": "Il n'y aura pas de développement de l'IA en France si nous n'avons pas une électricité décarbonée et peu chère", "date": "30 août 2026"}}, "9": {"texte": "Vise un prix de l'électricité « indexé sur nos coûts de production, plus sur les marchés », par un contrat entre EDF et les fournisseurs, pour une baisse de 5 à 10 % de la facture « à partir de 2030 ». Il retirerait l'électricité des certificats d'économies d'énergie, pour « 5 % de baisse immédiate sur la facture ». Pas de mesure sur les carburants.", "source": "https://www.avecretailleau.fr/projet/mesure/stabiliser-le-prix-de-l-electricite", "date": "1er septembre 2026 (mis à jour le 22 septembre 2026)", "reponse": "Baisser la facture d'électricité par un prix fondé sur les coûts du nucléaire", "chiffres": ["−5 % immédiat, puis −5 à −10 % à partir de 2030 (ses chiffres)"], "mesures": [{"titre": "Un prix de l'électricité fondé sur les coûts de production d'EDF", "explication": "Un contrat entre EDF et les fournisseurs, sur 100 à 130 TWh : si le prix de marché dépasse un prix de référence fixé par le régulateur, le surplus revient aux clients ; s'il est plus bas, EDF est compensée.", "pourquoi": "Mécanisme proche de ceux prévus par la réforme européenne du marché de l'électricité de 2024, à faire valider par Bruxelles. Sans flux budgétaire. Volumes, prix de référence et échéance précisés.", "note": {"v2": 1, "technique": 3, "droit": 2, "financement": 2, "precision": 2, "portee": "S", "statut": "N"}}, {"titre": "Retirer l'électricité des certificats d'économies d'énergie", "explication": "Supprimer une charge payée par les fournisseurs d'électricité et répercutée sur les factures.", "pourquoi": "Possible par la loi, mais la France doit atteindre ses objectifs européens d'économies d'énergie autrement, et ces certificats financent des aides à la rénovation. Sans coût budgétaire ; baisse chiffrée.", "note": {"v2": 1, "technique": 3, "droit": 2, "financement": 2, "precision": 2, "portee": "S", "statut": "N"}}], "citation": {"texte": "c'est l'équivalent de deux mois de facture rendus chaque année aux Français", "date": "22 septembre 2026"}}}}, "roussel": {"economie": {"0": {"texte": "Candidat depuis septembre 2026, il met en avant la « réindustrialisation de la France » et « un travail qui paie correctement ». En 2025, comme secrétaire national du PCF, il présentait une « nouvelle industrialisation » pilotée par l'État comme « un projet de société » qui « remet en cause le capitalisme ». Pas de programme 2027 chiffré publié.", "source": "https://lcp.fr/actualites/fabien-roussel-officiellement-candidat-du-pcf-a-l-election-presidentielle-de-2027-441389", "date": "6 septembre 2026 (et 17 mai 2025)", "reponse": "Une économie planifiée par l'État, qui « remet en cause le capitalisme »", "citation": {"texte": "C'est un projet de société car forcément, cela remet en cause le capitalisme", "date": "17 mai 2025"}}, "1": {"texte": "Propose un « Fonds d'avenir » de 500 Md€ sur cinq ans, porté par les banques publiques (Caisse des dépôts, Bpifrance), qui prêterait à taux zéro aux projets industriels. Objectif : porter l'industrie à 12 % du PIB en cinq ans et créer plus de 700 000 emplois industriels. Il veut conditionner les aides publiques aux entreprises à des critères sociaux, écologiques et territoriaux, et faire examiner toutes les solutions avant une fermeture d'usine (« inciter avant d'interdire »).", "source": "https://moissacaucoeur.fr/2026/06/28/fabien-roussel-il-faut-relancer-leconomie-par-les-salaires-in-alternatives-economiques/", "date": "27 juin 2026", "reponse": "Un fonds public de 500 Md€ pour réindustrialiser", "chiffres": ["500 Md€ sur cinq ans pour le Fonds d'avenir", "Industrie à 12 % du PIB en cinq ans", "700 000 emplois industriels"], "mesures": [{"titre": "Un « Fonds d'avenir » de 500 Md€ en cinq ans", "explication": "Les banques publiques prêteraient environ 100 Md€ par an, à taux zéro ou presque, aux entreprises qui investissent dans l'industrie.", "pourquoi": "Montant et durée donnés. C'est plus que tout ce que Bpifrance prête et investit aujourd'hui chaque année. Des prêts à taux zéro sont des aides d'État encadrées par les règles européennes. Le coût des taux bonifiés, plusieurs milliards par an, n'est pas financé.", "note": {"v2": 1, "technique": 2, "droit": 2, "financement": 0, "precision": 2, "portee": "T", "statut": "N", "gc": 1}}]}, "2": {"texte": "Veut « conditionner ces soutiens publics à des critères sociaux, écologiques et territoriaux », réserver les aides et les baisses d'impôts aux entreprises dont les emplois ne sont pas délocalisables, et regrouper les aides dans un guichet unique. « L'État n'est pas l'ennemi des entreprises. »", "source": "https://moissacaucoeur.fr/2026/06/28/fabien-roussel-il-faut-relancer-leconomie-par-les-salaires-in-alternatives-economiques/", "date": "27 juin, 27 août et 19 novembre 2026", "reponse": "Réserver les aides aux entreprises qui gardent leurs emplois en France", "mesures": [{"titre": "Conditionner les aides publiques à des critères sociaux, écologiques et territoriaux", "explication": "Une entreprise aidée devrait respecter des engagements, notamment garder ses emplois en France.", "pourquoi": "Possible par la loi, sans coût. Les critères ne sont pas détaillés. Même note que la mesure proche de Jean-Luc Mélenchon.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 2, "precision": 1, "portee": "S", "statut": "N"}}], "citation": {"texte": "L'État n'est pas l'ennemi des entreprises", "date": "27 août 2026"}}, "3": {"texte": "Critique « les traités libéraux européens » et veut relocaliser des productions en utilisant les marchés publics pour « produire en France ».", "source": "https://assets.nationbuilder.com/pcf/pages/30221/attachments/original/1747822112/Intro_FR_nouvelleind_170525.pdf", "date": "17 mai 2025", "reponse": "Contre les traités libéraux ; produire en France grâce aux marchés publics"}, "4": {"texte": "Place « la bataille de l'énergie » au cœur de sa campagne : « Il y a deux défis principaux pour la France, le défi de la paix et la bataille de l'énergie ». En 2025, il voulait que « la France et l'Europe » retrouvent « une autonomie stratégique », par des nationalisations (voir Nationalisations).", "source": "https://lcp.fr/actualites/presidentielle-a-la-fete-de-l-huma-fabien-roussel-au-defi-de-prouver-l-utilite-d-une", "date": "11 septembre 2026 (et 17 mai 2025)", "reponse": "La paix et l'énergie d'abord ; une « autonomie stratégique » par des nationalisations", "citation": {"texte": "Il y a deux défis principaux pour la France, le défi de la paix et la bataille de l'énergie", "date": "11 septembre 2026"}}, "5": {"texte": "Menace de nationaliser TotalEnergies si le groupe refuse de baisser le prix de l'essence de 30 à 50 centimes : « alors il faudra la nationaliser ». En 2025, il proposait déjà « la nationalisation de groupes stratégiques, de banques privées » et soutenait la pétition pour nationaliser ArcelorMittal France.", "source": "https://lcp.fr/actualites/presidentielle-a-la-fete-de-l-huma-fabien-roussel-au-defi-de-prouver-l-utilite-d-une", "date": "11 septembre 2026 (et 17 mai 2025)", "reponse": "Nationaliser TotalEnergies s'il ne baisse pas ses prix, et des groupes stratégiques", "mesures": [{"titre": "Nationaliser TotalEnergies s'il refuse de baisser ses prix", "explication": "L'État deviendrait propriétaire du groupe pétrolier pour faire baisser le prix des carburants.", "pourquoi": "Possible par la loi avec indemnisation des actionnaires, mais le coût serait très élevé (la valeur en Bourse du groupe), ni chiffré ni financé.", "note": {"v2": 1, "technique": 3, "droit": 2, "financement": 0, "precision": 1, "portee": "S", "statut": "N", "gc": 1}}, {"titre": "Nationaliser ArcelorMittal France", "explication": "L'État deviendrait propriétaire des usines françaises du sidérurgiste.", "pourquoi": "Déjà fait pour d'autres groupes (1982, chantiers STX en 2017). Possible par la loi avec indemnisation. Coût non chiffré.", "note": {"v2": 1, "technique": 3, "droit": 2, "financement": 0, "precision": 1, "portee": "P", "statut": "N"}}, {"titre": "Nationaliser des banques privées", "explication": "L'État prendrait le contrôle de banques aujourd'hui privées.", "pourquoi": "Les banques visées ne sont pas désignées : trop vague pour être notée.", "note": {"v2": 1, "technique": 3, "droit": 2, "financement": 0, "precision": 0, "portee": "T", "statut": "N"}}], "citation": {"texte": "alors il faudra la nationaliser", "date": "11 septembre 2026"}}, "6": {"texte": "Veut « reprendre la main sur l'argent, le rôle des banques, le rôle de l'État », en nationalisant des banques privées et en mobilisant le pôle public bancaire. Son groupe a déposé une proposition de loi pour interdire les licenciements boursiers.", "source": "https://assets.nationbuilder.com/pcf/pages/30221/attachments/original/1747822112/Intro_FR_nouvelleind_170525.pdf", "date": "17 mai 2025", "reponse": "Reprendre le contrôle public des banques"}, "7": {"texte": "Pas de position connue pour 2027 sur l'innovation.", "source": "", "date": "", "reponse": "Pas de réponse connue"}, "8": {"texte": "Pas de position connue pour 2027 sur le numérique et l'IA.", "source": "", "date": "", "reponse": "Pas de réponse connue"}, "9": {"texte": "Veut ramener la TVA sur les carburants de 20 % à 5,5 %, pour, selon lui, « 30 centimes en moins sur le prix du litre d'essence » (plutôt 25 centimes au prix de septembre), et supprimer les certificats d'économies d'énergie sur l'essence (15 centimes). Il demande à TotalEnergies de baisser ses marges et appelle à « se mobiliser » sur les ronds-points.", "source": "https://www.connaissancedesenergies.org/afp/prix-de-lenergie-roussel-pcf-appelle-a-se-mobiliser-sur-les-ronds-points-260911", "date": "11 et 19 septembre 2026", "reponse": "Baisser la TVA sur les carburants et faire pression sur TotalEnergies", "mesures": [{"titre": "TVA à 5,5 % sur les carburants", "explication": "Baisser le prix du litre d'environ 12 % : environ 25 centimes au prix de septembre 2026, et non 30 comme il l'annonce.", "pourquoi": "La directive européenne sur la TVA n'autorise pas de taux réduit sur les carburants : il faudrait la changer, à l'unanimité des 27. Coût de plusieurs milliards par an, non financé.", "note": {"v2": 1, "technique": 3, "droit": 0, "financement": 0, "precision": 1, "portee": "S", "statut": "N", "gc": 1}}, {"titre": "Supprimer les certificats d'économies d'énergie sur les carburants", "explication": "Supprimer une charge payée par les vendeurs de carburants et répercutée à la pompe (environ 15 centimes par litre).", "pourquoi": "Possible par la loi, mais la France doit atteindre ses objectifs européens d'économies d'énergie autrement, et ces certificats financent des aides à la rénovation. Sans coût budgétaire ; baisse chiffrée.", "note": {"v2": 1, "technique": 3, "droit": 2, "financement": 2, "precision": 2, "portee": "S", "statut": "N"}}], "citation": {"texte": "30 centimes en moins sur le prix du litre d'essence", "date": "11 septembre 2026"}}}}, "tondelier": {"economie": {"0": {"texte": "Le projet des Écologistes est construit autour d'une « prospérité écologique ». Il veut rompre avec la politique de l'offre et inscrire la protection de la nature « au cœur même du modèle économique des entreprises ». En octobre 2025, le parti a adopté un texte qui veut « remettre en cause la logique de croissance sans fin de la production et de la consommation », « ni renoncement ni récession », avec une planification et d'autres indicateurs que le PIB.", "source": "https://www.lagazettefrance.fr/article/2027-les-ecologistes-veulent-instaurer-la-premiere-republique-ecologique-et-citoyenne", "date": "13 juillet et 18 novembre 2026", "reponse": "La « prospérité écologique » plutôt que la croissance à tout prix"}, "1": {"texte": "Propose un fonds souverain financé par un « livret industrie » rémunéré à 1,7 % (le taux du livret A), qui financerait des investissements d'avenir sous conditions environnementales et sociales. Le parti parle d'une « révolution industrielle souveraine, écologique et sociale ».", "source": "https://vert.eco/politique/conge-climatique-interdiction-des-pesticides-sortie-du-nucleaire-ce-que-contient-le-programme-de-marine-tondelier-sur-lecologie/", "date": "18 novembre 2026", "reponse": "Un « livret industrie » pour financer un fonds souverain", "mesures": [{"titre": "Créer un « livret industrie » qui alimente un fonds souverain", "explication": "Un livret d'épargne, comme le livret A, dont l'argent serait prêté ou investi dans l'industrie.", "pourquoi": "Les livrets réglementés et Bpifrance existent déjà : une loi suffit. Taux fixé (1,7 %), mais ni plafond ni montant à collecter.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 1, "precision": 1, "portee": "S", "statut": "N"}}]}, "2": {"texte": "Les aides aux entreprises de plus de 250 salariés seraient « subordonnées au respect de plans de transition écologique ». Elle propose aussi un guichet unique pour les PME et ETI et des prêts de long terme à taux zéro pour décarboner. Elle reconnaît que toutes les TPE et PME ne pourront pas absorber seules un Smic à 2 000 € brut, et promet des aides différenciées.", "source": "https://vert.eco/politique/conge-climatique-interdiction-des-pesticides-sortie-du-nucleaire-ce-que-contient-le-programme-de-marine-tondelier-sur-lecologie/", "date": "18 novembre 2026", "reponse": "Conditionner les aides des grandes entreprises à la transition écologique", "mesures": [{"titre": "Conditionner les aides des entreprises de plus de 250 salariés", "explication": "Une grande entreprise ne recevrait d'aides que si elle suit un plan de transition écologique.", "pourquoi": "Possible par la loi, sans coût. Périmètre défini (plus de 250 salariés), calendrier non précisé.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 2, "precision": 1, "portee": "S", "statut": "N"}}, {"titre": "Un guichet unique pour les PME et ETI", "explication": "Un seul interlocuteur pour les démarches des petites et moyennes entreprises.", "pourquoi": "Réorganisation administrative possible ; coût non indiqué.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 0, "precision": 1, "portee": "S", "statut": "N"}}, {"titre": "Des prêts de long terme à taux zéro pour décarboner", "explication": "L'État prêterait sans intérêt aux entreprises qui réduisent leurs émissions.", "pourquoi": "Ni montant ni bénéficiaires : trop vague pour être notée.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 0, "precision": 0, "portee": "S", "statut": "N"}}]}, "3": {"texte": "Veut un « protectionnisme écologique et social » européen. Elle propose des quotas de matériaux bas carbone dans la commande publique européenne : « Il faut que les usines implantées en Europe soient aidées dans la vente en Europe ».", "source": "https://www.frenchweb.fr/presidentielle-2027-ce-que-les-candidats-ont-reellement-compris-de-la-puissance-technologique/463107", "date": "30 août 2026 (et 18 novembre 2026)", "reponse": "Un protectionnisme écologique et social à l'échelle européenne", "mesures": [{"titre": "Des quotas de matériaux bas carbone dans la commande publique européenne", "explication": "Une part minimale d'acier, de ciment ou d'autres matériaux peu émetteurs, souvent produits en Europe, dans les achats publics.", "pourquoi": "Suppose une règle européenne votée à la majorité qualifiée. Sans coût direct ; niveau des quotas non précisé.", "note": {"v2": 1, "technique": 3, "droit": 1, "financement": 2, "precision": 1, "portee": "T", "statut": "N"}}], "citation": {"texte": "Il faut que les usines implantées en Europe soient aidées dans la vente en Europe", "date": "30 août 2026"}}, "4": {"texte": "Le parti veut « poser les bases d'une révolution industrielle souveraine, écologique et sociale », financée notamment par un fonds souverain (voir Industrie).", "source": "https://europeecologie.eu/wp-content/uploads/2026/01/conventionindustrie_preprogramme-3.pdf", "date": "7 février 2026", "reponse": "Une « révolution industrielle souveraine », financée par un fonds souverain"}, "5": {"texte": "« Les autoroutes seront progressivement renationalisées. »", "source": "https://vert.eco/politique/conge-climatique-interdiction-des-pesticides-sortie-du-nucleaire-ce-que-contient-le-programme-de-marine-tondelier-sur-lecologie/", "date": "18 novembre 2026", "reponse": "Renationaliser progressivement les autoroutes", "mesures": [{"titre": "Renationaliser progressivement les autoroutes", "explication": "L'État reprendrait la gestion des autoroutes à péage aux sociétés privées.", "pourquoi": "Possible sans indemnité à la fin des contrats (2031 à 2036) ; plus tôt, il faudrait indemniser. Ni calendrier ni coût.", "note": {"v2": 1, "technique": 3, "droit": 2, "financement": 0, "precision": 1, "portee": "S", "statut": "N"}}]}, "6": {"texte": "« La taxe sur les transactions financières sera portée à 0,7 % (contre 0,4 % actuellement). »", "source": "https://vert.eco/politique/conge-climatique-interdiction-des-pesticides-sortie-du-nucleaire-ce-que-contient-le-programme-de-marine-tondelier-sur-lecologie/", "date": "18 novembre 2026", "reponse": "Relever la taxe sur les transactions financières à 0,7 %", "mesures": [{"titre": "Taxe sur les transactions financières de 0,4 % à 0,7 %", "explication": "Augmenter la taxe payée lors de l'achat d'actions de grandes entreprises françaises.", "pourquoi": "Une loi de finances suffit, et le taux a déjà été relevé. Recette non chiffrée.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 1, "precision": 2, "portee": "S", "statut": "N"}}]}, "7": {"texte": "Veut recentrer le crédit d'impôt recherche : « Je veux une recherche-développement publique forte pour une recherche-développement privée forte ».", "source": "https://www.frenchweb.fr/presidentielle-2027-ce-que-les-candidats-ont-reellement-compris-de-la-puissance-technologique/463107", "date": "30 août 2026", "reponse": "Recentrer le crédit d'impôt recherche et renforcer la recherche publique", "mesures": [{"titre": "Recentrer le crédit d'impôt recherche", "explication": "Réserver cet avantage fiscal à certaines dépenses ou entreprises.", "pourquoi": "Critères non précisés : trop vague pour être notée.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 1, "precision": 0, "portee": "S", "statut": "N"}}], "citation": {"texte": "Je veux une recherche-développement publique forte pour une recherche-développement privée forte.", "date": "30 août 2026"}}, "8": {"texte": "Son parti veut « appliquer strictement le règlement IA européen », imposer l'étiquetage des contenus créés par IA, donner aux grandes plateformes un « statut d'éditeur » responsable de ce qu'elles diffusent, et « créer des capacités souveraines en IA, basées sur un cloud européen ».", "source": "https://cf.eelv.fr/wp-content/uploads/sites/6/2026/02/CF-2026-02-8-10-ME-consent-numerique.pdf", "date": "8 et 10 février 2026", "reponse": "Encadrer strictement l'IA et les plateformes, avec un cloud européen", "mesures": [{"titre": "Un « statut d'éditeur » pour les grandes plateformes", "explication": "Les réseaux sociaux seraient responsables des contenus qu'ils diffusent, comme un journal.", "pourquoi": "Le règlement européen sur les services numériques fixe ce régime : il faudrait le changer au niveau européen. Sans coût.", "note": {"v2": 1, "technique": 3, "droit": 1, "financement": 2, "precision": 1, "portee": "T", "statut": "N"}}, {"titre": "Étiqueter les contenus créés par l'IA", "explication": "Signaler clairement les textes, images et vidéos produits par une IA.", "pourquoi": "Déjà prévu en grande partie par le règlement européen sur l'IA (article 50) : non noté.", "note": null}]}, "9": {"texte": "Propose un « bouclier climat » pour protéger les Français contre les hausses des prix, et le remplacement du chèque énergie par un crédit d'impôt.", "source": "https://vert.eco/politique/conge-climatique-interdiction-des-pesticides-sortie-du-nucleaire-ce-que-contient-le-programme-de-marine-tondelier-sur-lecologie/", "date": "18 novembre 2026", "reponse": "Un « bouclier climat » contre les hausses de prix", "mesures": [{"titre": "Un « bouclier climat » contre les hausses de prix", "explication": "Des aides ou des plafonds pour limiter l'effet des hausses de prix liées à la transition.", "pourquoi": "Mécanisme et coût non précisés : trop vague pour être notée.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 0, "precision": 0, "portee": "S", "statut": "N"}}]}}}, "villepin": {"economie": {"0": {"texte": "Propose un « big bang » fiscal : suppression de toutes les niches fiscales et sociales, neuf grands impôts seulement, et bascule de « plus de deux cents milliards » de cotisations vers une CSG à taux unique. Déficit sous 3 % en 2031, avec une hypothèse de croissance de 0,8 % par an. « Les caisses sont vides, les marges de manœuvre sont nulles. » Il juge le système actuel « féodal » et veut « séparer la société de l'État ».", "source": "https://lcp.fr/actualites/presidentielle-2027-dominique-villepin-veut-une-nouvelle-abolition-des-privileges-et-un", "date": "28 août et 20 novembre 2026", "reponse": "Un « big bang » fiscal et la réduction des déficits", "citation": {"texte": "Les caisses sont vides, les marges de manœuvre sont nulles", "date": "20 novembre 2026"}}, "1": {"texte": "Pas de position connue pour 2027 sur l'industrie.", "source": "", "date": "", "reponse": "Pas de réponse connue"}, "2": {"texte": "La suppression de toutes les niches fiscales et sociales s'accompagnerait d'une compensation pour « l'emploi » et « la viabilité des entreprises et des associations », sans détail. Il étendrait la participation à toutes les entreprises de plus de 50 salariés, avec la règle d'« un euro de participation aux salariés pour deux euros de dividendes versés », et exonérerait les biens professionnels de son impôt unique sur le patrimoine.", "source": "https://lcp.fr/actualites/presidentielle-2027-dominique-villepin-veut-une-nouvelle-abolition-des-privileges-et-un", "date": "28 août et 22 novembre 2026", "reponse": "Supprimer les niches et partager les profits avec les salariés", "mesures": [{"titre": "Un euro de participation pour deux euros de dividendes", "explication": "Dans les entreprises de plus de 50 salariés, pour deux euros versés aux actionnaires, un euro irait aux salariés.", "pourquoi": "La participation existe déjà à partir de 50 salariés ; une loi peut changer son calcul. Une règle aussi contraignante pourrait être contestée au nom de la liberté d'entreprendre. Sans coût pour l'État.", "note": {"v2": 1, "technique": 3, "droit": 2, "financement": 2, "precision": 2, "portee": "S", "statut": "N"}}]}, "3": {"texte": "Appelle à davantage de protection : « Il faut que nous acceptions de devenir enfin un peu protectionnistes ». Pas de mesure précise.", "source": "https://www.journaldunet.com/business/action-publique/1552267-dominique-de-villepin-soutient-la-creation-d-un-grand-fonds-souverain-pour-capter-l-epargne-des-francais/", "date": "2 juillet 2026", "reponse": "« Un peu » plus de protectionnisme, sans mesure précise", "citation": {"texte": "Il faut que nous acceptions de devenir enfin un peu protectionnistes", "date": "2 juillet 2026"}}, "4": {"texte": "Propose « un grand fonds de souveraineté et de solidarité » pour orienter l'épargne privée des Français (6 500 Md€) vers des investissements stratégiques français et européens.", "source": "https://www.journaldunet.com/business/action-publique/1552267-dominique-de-villepin-soutient-la-creation-d-un-grand-fonds-souverain-pour-capter-l-epargne-des-francais/", "date": "2 juillet 2026", "reponse": "Un grand fonds souverain alimenté par l'épargne des Français", "chiffres": ["6 500 Md€ d'épargne privée en France, 35 000 Md€ dans l'Union (ses chiffres)"], "mesures": [{"titre": "Créer un grand fonds de souveraineté et de solidarité", "explication": "Un fonds public qui recueillerait une partie de l'épargne pour l'investir dans des secteurs stratégiques.", "pourquoi": "Des fonds de ce type existent (Bpifrance, fonds norvégien). Ni taille, ni mode de collecte, ni secteurs : trop vague pour être notée.", "note": {"v2": 1, "technique": 3, "droit": 3, "financement": 1, "precision": 0, "portee": "T", "statut": "N"}}]}, "5": {"te function toast(msg){ document.querySelector(".toast")?.remove(); const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status"); d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 3200); }
async function shareLink(url, title){
  if (navigator.share) { try { await navigator.share({title, url}); return; } catch(e) { if (e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(url); toast("Lien copié : vous pouvez le coller où vous voulez."); }
  catch(e) { toast("Lien à copier : " + url); }
}

}

/* Plafonds : technique, puis droit à 0 (au plus 3), puis gros coût non financé (au plus 6) */
const plafond = (n) => Math.min(PLAFOND[n.technique], n.droit === 0 ? 3 : 10, n.gc && (n.financement ?? 0) < 2 ? 6 : 10);
/* Note sur 10 = somme des critères, plafonnée selon la technique ; pas de note si trop vague ou déjà décidée */
const noteSur10 = (n) => { if (!n || n.statut === "D" || n.technique === null || n.technique === undefined) return null;
  if (n.technique === 0) return 0; if (!n.precision) return null;
  const s = GRILLE.reduce((a, g) => a + (n[g.k] || 0), 0); return Math.min(s, plafond(n)); };
const noteMot = (n) => { if (!n) return "Non noté"; if (n.statut === "D") return "Déjà décidée";
  if (n.technique === null || n.technique === undefined) return "Technique non évaluée";
  if (n.technique === 0) return "Impossible"; if (!n.precision) return "Trop vague pour être notée";
  if (n.technique === 1 || n.droit === 0) return "Très improbable"; if (n.technique === 2) return "Difficile";
  return noteSur10(n) >= 7 ? "Faisable" : "Difficile"; };

  return `<ul class="crit">${GRILLE.map(g => `<li title="${esc(g.aide)}"><span>${esc(g.nom)}</span><b>${n[g.k] ?? "?"}/${g.max}</b></li>`).join("")}</ul>${cap ? `<p class="cap">${cap}</p>` : ""}`; };
const fxSummary = (n) => n ? `Faisabilité : <b>${noteMot(n)}</b>${noteSur10(n) !== null ? ` (${fmt(noteSur10(n))}/10)` : ""}` : "Faisabilité : non noté";

const scoreBadgeS = (n, label) => scoreBadge(n, label || "Faisabilité de la position principale", false);

const FXORDRE = ["f", "d", "i", "z", "v", "x", "n", "o", "u", "w"];
/* Position connue mais non notée : ancienne (avant 2026) ou récente non notée ; « pas encore de réponse » ne compte pas */
const noPos = (p) => !p || isUnk(p) || /^Pas encore de réponse/.test(p.reponse || "");

const plur = (n, a, b) => `${n} ${n > 1 ? b : a}`;
function fxSynthese(c, t, done){
  const q = (k) => COURT[t.id]?.[k] || saShort(t.sa[k]);
  const K = done.map(k => ({k, kind: fxKind(c, t, k), s: noteSur10(NOTES[c.id]?.[t.id]?.[k])}));
  const cnt = (x) => K.filter(e => e.kind === x).length;
  const notees = K.filter(e => ["f", "d", "i", "z"].includes(e.kind));
  const parts = [[cnt("f"), "faisable", "faisables"], [cnt("d"), "difficile", "difficiles"], [cnt("i"), "très improbable", "très improbables"], [cnt("z"), "impossible", "impossibles"],
    [cnt("v"), "trop vague", "trop vagues"], [cnt("x"), "déjà décidée", "déjà décidées"], [cnt("n"), "non notée", "non notées"], [cnt("o"), "ancienne", "anciennes"]].filter(x => x[0]).map(x => plur(...x));
  const sans = cnt("u"), nw = cnt("w");

  if (notees.length >= 2) {

      : `<div class="fxm" title="Moyenne sur ${s.length} position${s.length > 1 ? "s" : ""} notée${s.length > 1 ? "s" : ""}${few ? " : à lire avec prudence" : ""}"><span class="fxl">Faisabilité moyenne</span><span class="trk"><i class="fill ${z}${few ? " few" : ""}" style="width:${mean * 10}%"></i><i class="t7"></i></span><b>${fmt(mean)}<small>/10</small><em>${s.length} notée${s.length > 1 ? "s" : ""}</em></b></div>`;
    return `<li class="fxb"><a class="nm" href="#candidat-${c.id}" title="${esc(c.nom)} (${esc(c.parti)})">${esc(c.nom)}</a>${cov}${fea}</li>`; }).join("");
  return `<div class="fxbars"><div class="fxhead" aria-hidden="true"><span></span><span>Sujets couverts <small>(sur ${nq})</small></span><span>Faisabilité moyenne <small>(sur 10, positions notées)</small></span></div><ul>${rows}</ul>

}

    <p class="muted">Pour chaque candidat : à gauche, combien de sujets du thème il couvre ; à droite, la faisabilité moyenne de ses positions notées. Touchez un nom pour voir le candidat. Ce n'est pas un classement : la note ne juge ni l'ambition ni le bien-fondé d'une position.</p>

      <li><span class="fxc v">vague</span>Trop vague pour être notée</li><li><span class="fxc x">déjà</span>Déjà décidée</li><li><span class="fxc n">non notée</span>Position non notée</li><li><span class="fxc o">ancienne</span>Position d'avant 2026, non notée</li><li><span class="fxc u">–</span>Pas de position connue</li></ul>

}

      ${fxSummaryHTML(t, t.sa.map((s, k) => k))}

function candView(c){

      <div class="pager"><a class="btn" href="#candidat-${prev.id}">← ${esc(prev.nom)}</a><a class="btn" href="#candidat-${next.id}">${esc(next.nom)} →</a></div>
    </main></div>

/* Détail d'une réponse : la carte s'agrandit sur toute la largeur de la grille */
function toggleCard(btn){
  const card = btn.closest(".card"), grid = card.closest(".qbody") || card.closest(".cards");
  const was = card.classList.contains("sel");
  closePanel(grid);
  if (was && location.hash.startsWith("#theme-")) history.replaceState(null, "", location.hash.replace(/^(#theme-[a-z]+-\d+)-.*$/, "$1"));
  if (was) return;
  const [cid, tid, ks] = btn.dataset.open.split("|"), c = cand(cid), t = theme(tid), k = +ks, p = POSITIONS[cid]?.[tid]?.[k];
  const panel = document.createElement("div");
  panel.className = "detail"; panel.id = "detail-" + tid + "-" + k; panel.setAttribute("role", "region"); panel.setAttribute("aria-label", "Détail : " + c.nom);
  panel.innerHTML = `<div class="detail-head"><span class="who"><b>${esc(c.nom)}</b><small>${esc(p.reponse || "")}</small></span><button class="icon" data-fold aria-label="Fermer le détail">×</button></div>`
    + answerBody(c, t, k, p) + `<div class="card-end"><a href="#candidat-${c.id}">Toutes les réponses de ${esc(c.nom)} →</a><button class="btn" data-share="${BASE}#theme-${tid}-${k}-${cid}" data-title="${esc(c.nom)} : ${esc(qText(t, k))}">Partager cette réponse</button></div>`;
  placePanel(card, panel);
  card.classList.add("sel"); btn.setAttribute("aria-expanded", "true"); btn.setAttribute("aria-controls", panel.id);
  if (location.hash.startsWith("#theme-")) history.replaceState(null, "", `#theme-${tid}-${k}-${cid}`);
  const r = panel.getBoundingClientRect();
  if (r.top > innerHeight - 120) panel.scrollIntoView({block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}
/* le panneau se place juste après la dernière carte de la rangée de la carte choisie */
function placePanel(card, panel){
  const cards = [...card.closest(".cards").children].filter(x => x.classList.contains("card"));
  const top = card.offsetTop; let last = card;
  for (const x of cards) if (x.offsetTop === top) last = x;
  last.after(panel);
}
function closePanel(grid){
  grid.querySelectorAll(".detail").forEach(d => d.remove());
  grid.querySelectorAll(".card.sel").forEach(x => { x.classList.remove("sel"); const b = x.querySelector(".card-btn"); b.setAttribute("aria-expanded", "false"); b.removeAttribute("aria-controls"); });
}
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => document.querySelectorAll(".card.sel").forEach(card => { const d = card.closest(".cards").querySelector(".detail"); if (d) placePanel(card, d); }), 120); });

/* ===== Comparer 2 à 4 candidats sur un thème ===== */
const cmpIds = (s) => (s || "").split(",").filter((id, i, a) => cand(id) && a.indexOf(id) === i).slice(0, 4);
const cmpHref = (tid, ids) => `#comparer-${tid}${ids.length ? "/" + ids.join(",") : ""}`;
const POS = {"1": ["Pour", "✓", "pour"], "0": ["Contre", "✕", "contre"], "0.5": ["Nuancé", "≈", "nuance"]};
function posHTML(x, withNote = true){
  if (!x) return `<span class="pos none">— Pas de position connue</span>`;
  const [l, i, c] = POS[String(x.v)];
  return `<span class="pos ${c}"><span aria-hidden="true">${i}</span>${l}${x.an ? ` <small>(${x.an})</small>` : ""}</span>${withNote && x.n ? `<span class="pos-n">${esc(x.n)}</span>` : ""}`;
}
/* commun : tous se prononcent pareil ; partiel : ceux qui se prononcent sont d'accord ; diverge : désaccord ; seul : un seul se prononce */
function axStatus(ax, ids){
  const d = ids.map(id => ax.p[id]).filter(Boolean);
  if (d.length < 2) return d.length ? "seul" : "aucun";
  if (d.every(x => x.v === d[0].v)) return d.length === ids.length ? "commun" : "partiel";
  return "diverge";
}
const firstName = (c) => c.nom.split(" ")[0];
const lastName = (c) => c.tri || c.nom.split(" ").slice(1).join(" ");

function compareView(t, ids){
  const sel = ids.map(cand), n = sel.length, many = n > 2 ? " many" : "";
  const done = answered(t), axes = AXES[t.id] || {};
  const tnav = THEMES.map(x => `<a class="chip${x === t ? " on" : ""}${answered(x).length ? "" : " off"}" href="${cmpHref(x.id, ids)}">${esc(x.nom)}</a>`).join("");
  const picker = byName.map(c => { const on = ids.includes(c.id);
    return `<button class="chip${on ? " on" : ""}" data-cmp="${c.id}" aria-pressed="${on}">${esc(c.nom)}</button>`; }).join("");
  const head = `<div class="phead"><div><span class="eyebrow">Comparer · ${esc(t.nom)}</span><h1>${n >= 2 ? sel.map(c => esc(lastName(c))).join(" · ") : "Comparer des candidats"}</h1>
      <p class="muted">Choisissez 2 à 4 candidats : leurs réponses côte à côte, ce qui les rapproche et ce qui les oppose, question par question.</p></div></div>
    <nav class="cmp-tnav" aria-label="Thèmes">${tnav}</nav>
    ${n >= 2 ? `<details class="cmp-pick cmp-sel"><summary class="btn">Changer de candidats (${n} sur 4)</summary><div class="chips" role="group" aria-label="Candidats à comparer">${picker}</div></details>`
      : `<div class="cmp-pick" role="group" aria-label="Candidats à comparer"><div class="chips">${picker}</div></div>`}`;
  let body;
  if (n < 2) body = `<div class="panel cmp-empty"><h2>${n ? `Ajoutez au moins un autre candidat à comparer avec ${esc(sel[0].nom)}` : "Choisissez au moins deux candidats"}</h2><p class="muted">Touchez les noms ci-dessus. Jusqu'à quatre candidats à la fois.</p></div>`;
  else if (!done.length) body = `<div class="panel cmp-empty"><h2>Aucune question n'est encore comparée sur ce thème</h2><p class="muted">Choisissez un autre thème ci-dessus.</p></div>`;
  else {
    const tot = {commun: 0, diverge: 0, seul: 0}, jump = [];
    const blocks = done.map(k => {
      const A = axes[k] || [], g = {commun: [], partiel: [], diverge: [], seul: []};
      A.forEach(ax => { const s = axStatus(ax, ids); if (g[s]) g[s].push(ax); });
      const same = g.commun.concat(g.partiel);
      tot.commun += same.length; tot.diverge += g.diverge.length; tot.seul += g.seul.length;
      jump.push(`<a href="#cq-${k}">${esc(saShort(t.sa[k]))}${A.length ? `<span>${same.length} en commun · ${g.diverge.length} opposé${g.diverge.length > 1 ? "s" : ""}</span>` : ""}</a>`);
      const cols = sel.map(c => { const p = POSITIONS[c.id]?.[t.id]?.[k];
        return `<div class="cc"><div class="cc-h"><span class="mono s" aria-hidden="true">${initials(c.nom)}</span><span>${esc(c.nom)}</span></div>
          ${p ? `<p class="cc-r${isUnk(p) ? " unk" : ""}">${esc(p.reponse || p.texte)}</p>${isUnk(p) ? "" : scoreBadgeS(NOTES[c.id]?.[t.id]?.[k])}<a href="#theme-${t.id}-${k}-${c.id}">Détail et sources →</a>`
              : `<p class="cc-r unk">Position à renseigner</p>`}</div>`; }).join("");
      const divRows = g.diverge.sort((a, b) => {
          const opp = (ax) => { const v = ids.map(id => ax.p[id]?.v).filter(v => v !== undefined); return v.includes(1) && v.includes(0) ? 0 : 1; };
          return opp(a) - opp(b); })
        .map(ax => `<li class="ax"><p class="ax-t">${esc(ax.t)}</p><div class="axv${many}">${sel.map(c => `<div><span class="nm"><span class="mono s" aria-hidden="true">${initials(c.nom)}</span>${esc(lastName(c))}</span>${posHTML(ax.p[c.id])}</div>`).join("")}</div></li>`).join("");
      const sameRows = same.map(ax => { const d = ids.filter(id => ax.p[id]), v = ax.p[d[0]].v, silent = sel.filter(c => !ax.p[c.id]);
        const lab = (silent.length ? (d.length === 2 ? "Les deux qui se prononcent : " : "Ceux qui se prononcent : ") : (n === 2 ? "Les deux : " : "Tous : ")) + POS[String(v)][0].toLowerCase();
        const notes = d.filter(id => ax.p[id].n || ax.p[id].an).map(id => `${lastName(cand(id))} : ${ax.p[id].n ? esc(ax.p[id].n) : ""}${ax.p[id].an ? ` (${ax.p[id].an})` : ""}`).join(" · ");
        return `<li class="ax ax-c"><span class="pos ${POS[String(v)][2]}"><span aria-hidden="true">${POS[String(v)][1]}</span>${lab}</span><span class="ax-t">${esc(ax.t)}</span>
          ${notes || silent.length ? `<small>${notes}${notes && silent.length ? " · " : ""}${silent.length ? `${silent.map(c => esc(lastName(c))).join(", ")} : pas de position connue` : ""}</small>` : ""}</li>`; }).join("");
      const soloRows = g.seul.map(ax => { const id = ids.find(i => ax.p[i]);
        return `<li class="ax ax-c">${posHTML(ax.p[id], false)}<span class="ax-t"><b>${esc(lastName(cand(id)))}</b> : ${esc(ax.t)}${ax.p[id].n ? ` (${esc(ax.p[id].n)})` : ""}</span></li>`; }).join("");
      const more = sel.map(c => { const p = POSITIONS[c.id]?.[t.id]?.[k];
        return `<div class="cm cc"><div class="cc-h"><span class="mono s" aria-hidden="true">${initials(c.nom)}</span><span>${esc(c.nom)}</span></div>
          ${p?.chiffres ? `<ul class="figs">${p.chiffres.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
          ${p?.mesures ? `<ul>${p.mesures.map(m => `<li>${esc(m.titre)}${m.note ? ` · <b>${esc(noteMot(m.note))}</b>${noteSur10(m.note) !== null ? ` ${fmt(noteSur10(m.note))}/10` : ""}` : ""}</li>`).join("")}</ul>` : ""}
          ${!p?.chiffres && !p?.mesures ? `<p class="muted">Aucun chiffre ni mesure.</p>` : ""}</div>`; }).join("");
      return `<section class="cq" id="cq-${k}" aria-labelledby="cqh-${k}" style="--n:${n}">
        <div class="cq-h"><span class="eyebrow">${esc(saShort(t.sa[k]))}</span><h2 id="cqh-${k}">${esc(qText(t, k))}</h2>
          ${A.length ? `<p class="cq-n"><span><b>${same.length}</b> point${same.length > 1 ? "s" : ""} commun${same.length > 1 ? "s" : ""}</span><span><b>${g.diverge.length}</b> différence${g.diverge.length > 1 ? "s" : ""}</span><span><b>${g.seul.length}</b> proposition${g.seul.length > 1 ? "s" : ""} d'un seul</span></p>` : ""}</div>
        <div class="cmp-cols${many ? " scrollx" : ""}" style="--n:${n}">${cols}</div>
        ${divRows ? `<div class="cg"><h3 class="cg-h">Ce qui les oppose</h3><ul class="axl">${divRows}</ul></div>` : ""}
        ${sameRows ? `<div class="cg"><h3 class="cg-h same">Ce qui les rapproche</h3><ul class="axl">${sameRows}</ul></div>` : ""}
        ${soloRows ? `<details class="cmp-solo"${!divRows && !sameRows ? " open" : ""}><summary>Propositions portées par un seul d'entre eux (${g.seul.length})</summary><ul class="axl">${soloRows}</ul></details>` : ""}
        ${A.length && !divRows && !sameRows && !soloRows ? `<p class="cmp-note">Aucun de ces candidats ne se prononce sur les points de comparaison de cette question.</p>` : ""}
        ${!A.length ? `<p class="cmp-note">Points de comparaison pas encore établis pour cette question : comparez les réponses ci-dessus.</p>` : ""}
        <details class="cmp-more"><summary>Chiffres et mesures côte à côte</summary><div class="cmp-cols${many ? " scrollx" : ""}" style="--n:${n}">${more}</div></details>
        <p class="cq-foot"><a href="#theme-${t.id}-${k}">Voir les réponses de tous les candidats à cette question →</a></p>
      </section>`; });
    const who = sel.map(c => { const sc = done.map(k => scoreOf(c.id, t.id, k)).filter(x => x !== null);
      const known = done.filter(k => { const p = POSITIONS[c.id]?.[t.id]?.[k]; return p && !isUnk(p) && !isOld(p); }).length;
      const avg = sc.length ? Math.round(sc.reduce((a, b) => a + b, 0) / sc.length * 10) / 10 : null;
      return `<div class="cw"><div class="cw-h">${whoHTML(c)}</div><button class="cw-x" data-cmp="${c.id}" aria-label="Retirer ${esc(c.nom)} de la comparaison">×</button>
        <dl><dt>Réponses connues</dt><dd>${known} sur ${done.length}</dd><dt>Faisabilité moyenne</dt><dd>${avg === null ? "non noté" : `<b>${fmt(avg)}</b>/10 (${sc.length} réponse${sc.length > 1 ? "s" : ""} notée${sc.length > 1 ? "s" : ""})`}</dd></dl>
        <a class="qlink" href="#candidat-${c.id}">Toutes ses réponses →</a></div>`; }).join("");
    body = `<div class="cmp-who" style="--n:${n}">${who}</div>
      <div class="cmp-tot"><span class="tot"><b>${tot.commun}</b> point${tot.commun > 1 ? "s" : ""} commun${tot.commun > 1 ? "s" : ""}</span><span class="tot diverge"><b>${tot.diverge}</b> différence${tot.diverge > 1 ? "s" : ""}</span><span class="tot"><b>${tot.seul}</b> proposition${tot.seul > 1 ? "s" : ""} d'un seul</span>
        <button class="btn" data-share="${BASE}${cmpHref(t.id, ids)}" data-title="${esc(sel.map(c => c.nom).join(" et "))} : ${esc(t.nom)}">Partager cette comparaison</button></div>
      <p class="cmp-note">« Pour », « contre » et « nuancé » résument la position de chaque candidat sur des propositions précises, à partir de ses réponses et de leurs sources. Une position ancienne est suivie de son année.</p>
      <nav class="cmp-jump" aria-label="Questions">${jump.join("")}</nav>
      <div class="cmp-sticky" aria-hidden="true"><div class="row${many}" style="--n:${n}">${sel.map(c => `<span>${esc(lastName(c))}</span>`).join("")}</div></div>
      ${blocks.join("")}`;
  }
  return `${topbar("cmp")}
  <div class="shell full"><main class="main">${head}${body}</main></div>
  ${footer()}`;
}

function render(){
  const h = location.hash.slice(1);
  let html, anchor = null;
  const m = h.match(/^theme-([a-z]+)(?:-(\d+)(?:-([a-z-]+))?)?$/), mc = h.match(/^comparer-([a-z]+)(?:\/(.*))?$/);
  if (mc && theme(mc[1])) html = compareView(theme(mc[1]), cmpIds(mc[2]));
  else if (m && theme(m[1])) { if (m[2] !== undefined) { openQ.add(m[1] + "-" + m[2]); anchor = "q-" + m[2]; if (m[3] && focusC && focusC !== m[3]) focusC = ""; } html = themeView(theme(m[1])); }
  else if (h.startsWith("candidat-") && cand(h.slice(9))) html = candView(cand(h.slice(9)));
  else { html = home(); if (["themes","candidats","tableau"].includes(h)) anchor = h; }
  $("#app").innerHTML = html;
  const tb = document.querySelector(".topbar"); if (tb) document.documentElement.style.setProperty("--tb", tb.offsetHeight + "px");
  if (anchor) document.getElementById(anchor)?.scrollIntoView(); else window.scrollTo(0,0);
  const btn = m?.[3] && document.querySelector(`#q-${m[2]} [data-open^="${m[3]}|"]`);
  if (btn) { toggleCard(btn); btn.closest(".card").scrollIntoView({block: "start"}); }
  const on = document.querySelector(".mnav .on");
  if (on) on.parentElement.scrollLeft = on.offsetLeft - (on.parentElement.clientWidth - on.offsetWidth) / 2;
}

document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelectorAll(".cards").forEach(g => { if (g.querySelector(".detail")) { const c = g.querySelector(".card.sel .card-btn"); closePanel(g); c?.focus(); } }); });
document.addEventListener("click", (e) => {
  const fs = e.target.closest("[data-fxsort]");
  if (fs) { const sec = fs.closest(".fxsum"), t = theme(sec.dataset.t), openD = [...sec.querySelectorAll("details")].map(d => d.open);
    fxSort = fs.dataset.fxsort; sec.outerHTML = fxSummaryHTML(t, t.sa.map((s, k) => k));
    const n = document.querySelector(".fxsum"); n.querySelectorAll("details").forEach((d, i) => { if (openD[i]) d.open = true; });
    n.querySelector(`[data-fxsort="${fxSort}"]`)?.focus(); return; }
  const f = e.target.closest("[data-fold]");
  if (f) { const grid = f.closest(".cards"), card = grid.querySelector(".card.sel"); closePanel(grid); if (card) { card.querySelector(".card-btn").focus(); card.scrollIntoView({block: "nearest"}); } return; }
  const o = e.target.closest("[data-open]");
  if (o) { toggleCard(o); return; }
  const cb = e.target.closest("[data-cmp]");
  if (cb) { const mc = location.hash.match(/^#comparer-([a-z]+)(?:\/(.*))?$/); if (!mc) return;
    let ids = cmpIds(mc[2]); const id = cb.dataset.cmp;
    if (ids.includes(id)) ids = ids.filter(x => x !== id); else if (ids.length >= 4) { toast("Quatre candidats au maximum : retirez-en un d'abord."); return; } else ids.push(id);
    history.replaceState(null, "", cmpHref(mc[1], ids)); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  const sh = e.target.closest("[data-share]");
  if (sh) { shareLink(sh.dataset.share, sh.dataset.title); return; }
  if (e.target.closest("[data-top]")) { window.scrollTo({top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); return; }
  const aq = e.target.closest("[data-allq]");
  if (aq) { const all = [...document.querySelectorAll("details.qsec")], open = all.some(d => !d.open); all.forEach(d => d.open = open); aq.textContent = open ? "Tout replier" : "Tout déplier"; return; }
  const b = e.target.closest("[data-order]");
  if (!b) return;
  order = b.dataset.order;
  try { localStorage.setItem("ordre", order); } catch(err) {}
  const y = window.scrollY; render(); window.scrollTo(0, y);
});
window.addEventListener("hashchange", render);
/* Question dépliée ou repliée : mémorisée pendant la visite, et l'adresse suit pour pouvoir la partager */
document.addEventListener("toggle", (e) => {
  const d = e.target; if (!d.matches || !d.matches("details.qsec")) return;
  const q = d.dataset.q, own = "#theme-" + q;
  if (d.open) { openQ.add(q); if (location.hash !== own && !location.hash.startsWith(own + "-")) history.replaceState(null, "", own); }
  else { openQ.delete(q); if (location.hash === own || location.hash.startsWith(own + "-")) history.replaceState(null, "", "#theme-" + q.split("-")[0]); }
  const all = [...document.querySelectorAll("details.qsec")], aq = document.querySelector("[data-allq]");
  if (aq) aq.textContent = all.every(x => x.open) ? "Tout replier" : "Tout déplier";
}, true);
document.addEventListener("change", (e) => {
  if (!e.target.matches("[data-focus]")) return;
  focusC = e.target.value;
  if (focusC) document.querySelectorAll("details.qsec").forEach(d => openQ.add(d.dataset.q));
  const y = window.scrollY; render(); window.scrollTo(0, y);
});
const toTop = document.createElement("button");
toTop.className = "totop"; toTop.dataset.top = ""; toTop.setAttribute("aria-label", "Revenir en haut de la page"); toTop.textContent = "↑";
document.body.appendChild(toTop);
addEventListener("scroll", () => toTop.classList.toggle("on", window.scrollY > 700), {passive: true});
render();
</script>
</body>
</html>
